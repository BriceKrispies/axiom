# Build the browser/WASM demos and publish the mobile-first demo gallery
# to GitHub Pages on every push to main.
#
# This is repo tooling, NOT part of the engine dependency graph — same status as
# the CI workflow, the Makefile, and scripts/. It PACKAGES each standalone demo
# app (scripts/package_gallery.py) into dist/<id>/ behind its capability-detecting
# loader, with the static landing grid (apps/axiom-gallery/web) laid over dist/,
# matching `make gallery`, and deploys it.
#
# It runs the FAST packaging path (`--fast`: a normal wasm-bindgen build behind the
# loader, no wasm2js fallback), to stay on stable. `make gallery` locally builds the
# deploy-grade bundles WITH the wasm2js fallback; to deploy those, switch the package
# step to drop `--fast` and add a nightly toolchain + rust-src (the fallback needs the
# MVP `-Z build-std` rebuild).
#
# `--tuning shipping` is the separate — and load-bearing — half of that. `--fast` is a
# TOOLCHAIN choice; the tuning decides how hard the wasm is optimized. These used to be
# the same flag, so the deploy silently published a build tuned for build latency:
# thin LTO at 16 codegen units, finished with size-first `wasm-opt -Oz`. On the
# branchless spine, whose hot loops are per-element closure chains across crate
# boundaries, that is the difference between inlined straight-line code and an
# indirect call per element — a phone measured ~20fps on the deployed bundle against
# ~56fps on the same app served locally, which builds plain `--release`.
#
# So the deploy pays the build time (fat LTO re-runs whole-program optimization per
# app) and the bundle size, and publishes what a player should actually get. If this
# job's runtime becomes the problem, the fix is caching or fewer apps per run — NOT
# quietly dropping back to `preview`, which trades the player's frame rate for CI
# minutes.
#
# One-time setup: enable Pages in repo Settings → Pages → Source: GitHub Actions.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token plus the OIDC id-token the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deploy at a time; newer pushes supersede older runs.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          rustup default stable

      # Pin wasm-bindgen-cli to the exact wasm-bindgen version locked in
      # Cargo.lock — a mismatched generator errors out, so we read it rather
      # than hardcode it.
      - name: Resolve wasm-bindgen version
        id: wb
        run: |
          version="$(cargo metadata --format-version 1 --locked \
            | python3 -c 'import json,sys; pkgs=json.load(sys.stdin)["packages"]; print(next(p["version"] for p in pkgs if p["name"]=="wasm-bindgen"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $version"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pages-${{ hashFiles('**/Cargo.lock') }}

      # Package every REGISTERED app (every app carrying an app.json) into dist/<id>/
      # via scripts/package_gallery.py, the same driver `make gallery` uses: Rust apps
      # behind their loader, TypeScript apps bundled against the ONE shared
      # @axiom/web-engine build under dist/engine/. `--fast` keeps this on stable with
      # no wasm2js fallback; `--tuning shipping` is what makes the published wasm fast
      # to RUN (see the header). The packager installs whatever node_modules it needs
      # on demand, so this step does not have to mirror them.
      - name: Package the gallery (dist/)
        run: |
          npm --prefix scripts/packaging install --no-audit --no-fund
          python3 scripts/package_gallery.py --fast --tuning shipping

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
