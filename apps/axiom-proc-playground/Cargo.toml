[package]
name = "axiom-proc-playground"
description = "Axiom app: the procedural-generation playground. Proves the space -> entropy -> recipe -> proc-core -> proc-validate stack end to end - it builds a tiny deterministic recipe graph, executes it at a content address into neutral output words, validates those words against generic constraints, and reports the provenance digests. Same (seed, address) => byte-identical words, every run. Headless and golden-tested (a composition leaf; exempt from the spine gates, but ships its own determinism tests)."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axiom-space = { path = "../../crates/axiom-space" }
axiom-recipe = { path = "../../crates/axiom-recipe" }
axiom-proc-core = { path = "../../crates/axiom-proc-core" }
axiom-proc-validate = { path = "../../crates/axiom-proc-validate" }

[lints.rust]
unsafe_code = "forbid"
