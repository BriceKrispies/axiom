# Semantic vertical-slice contract for the rotating-cube demo's App-core render
# boundary.
#
# Carved out of the merged gallery's `slice.toml` in the gallery de-merge. Where
# the headless `apps/axiom-demo-rotating-cube` crate proves the records-only
# named-contract chain, this slice is proven at the boundary the demo actually
# renders through: `RunningApp::tick -> FrameOutcome` (the mesh-batch /
# camera-view-proj / light data the live GPU and Canvas2D backends consume).
# `tests/render_determinism.rs` pins that boundary with a replay-equal assertion
# and a NEGATIVE (perturbed-differs) assertion — a later animated tick must
# render different bytes.
#
# The two committed golden `.bin` files and their SHA-256 pins were removed on
# 2026-08-11, having drifted from what this app actually renders, and for a while
# what remained proved only that the boundary replays equal to itself — a
# property a completely broken renderer also has.
#
# They are back, re-blessed on 2026-08-16, because this app is the **regression
# control** for the shader/material field system: it is the only thing in the
# repository that pins what *trivial* rendering looks like. Its material is still
# one line —
#
#     Material::lit(color).with_texture(Texture::Checker)
#
# — and these bytes are what would catch a field system that quietly made the
# simple case cost a graph, change a mesh/material id, or move a draw. Two ticks
# rather than one, so the pin covers an animated frame as well as the first.
#
# `harness_entry` names the renderable App-core this crate exposes; `harness`
# points at the axiom-shot registration (`--app rotating-cube`).
[slice]
name = "rotating-cube"
crate_name = "axiom-rotating-cube"
harness_entry = "rotating_cube_core"
determinism_test = "render_determinism"
harness = "rotating-cube"

# --- tick 0: the first frame the app renders --------------------------------
[[golden]]
path = "tests/golden/rotating_cube_tick0_render.bin"
sha256 = "ea005472f5c19a939027e05286efc1fc82f73b6acc7cdd66d3d3a06c5aee4b2e"

# --- tick 60: one second in, cubes spun and point lights orbited ------------
[[golden]]
path = "tests/golden/rotating_cube_tick60_render.bin"
sha256 = "84f8acd12d0b4b7acd8b4e7f74bd40590b475cec99a646fa36d7964aaa241d3c"

