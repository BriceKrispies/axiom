[package]
name = "axiom-shmup"
description = "shmup: the browser FPS at C:/dev/Claude-of-Duty (Three.js r180, ISC) ported onto Axiom. This crate carries the game — every gameplay concept stays app-local, per the Module Law's composition-leaf rule."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `cdylib` for the browser bundle (the `shmup_parts_start` entry in
# `viewer`); `rlib` so the native golden tests keep linking the same crate.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine umbrella (module `engine`): the `App`/`setup`/`install`/`run`
# authoring surface the weapon-parts viewer (`viewer`) is written against, and
# the `MeshData` the ported `weapons::geometry::Geo` buckets are uploaded
# through. The viewer is the port's first rendering arm — everything above it
# (the viewmodel rig, the world, the frame graph) still lands behind this same
# facade.
axiom = { path = "../../modules/axiom" }

# `Seconds` (the fixed step and the frame delta handed to every subsystem),
# `Meters` (the player capsule dimensions and the shadow distance) and `Ratio`
# (render scale, exposure, the ADS FOV/sensitivity scales) — the dimensioned
# quantities the ported `config.js` data is authored in, so a naked float never
# crosses a subsystem boundary with its unit left to guesswork.
axiom-kernel = { path = "../../crates/axiom-kernel" }

# `Mat4`/`Vec3`/`Quat` — the weapon geometry kit's transform primitives
# (`weapons::geometry`). `Geo::apply` uses `Mat4`'s normal-matrix-correct
# point/direction transform directly; the primitive builders (`box_geo`,
# `lathe_z`, `dome`, `knurl_band`, ...) build `Mat4::translation`/`::scale`
# and `Mat4::from_quaternion` rotations to reproduce
# `BufferGeometry.translate`/`rotateX`/`rotateZ`/`scale` (`geometry.js`)
# rather than hand-rolling a second, parallel transform path.
axiom-math = { path = "../../crates/axiom-math" }

# `ProceduralBakeRequest`/`ProceduralBakeMaps` — the neutral bake contract
# `materials::gpu_bake` authors. The forge's nineteen surfaces are ~15.5 us a
# texel-evaluation on the CPU; at the shipping 1024^2 that is minutes, so the
# real bake runs on the device. The request type lives in `host` (not in the
# backend that executes it) because Module Law #8 lets a module publish exactly
# one facade — so the contract between the app that authors a bake and the
# backend that runs it has to sit in a layer both can name.
axiom-host = { path = "../../crates/axiom-host" }
# `WorldTag` — the engine's agent-interrogable noun. `scene::console` emits one
# per installed batch so a screenshot can name what it is showing.
axiom-introspect = { path = "../../crates/axiom-introspect" }

# The live presentation arm. `scene::app`'s browser entry drives
# `WindowingApi::run_web_multi` directly, in the exact shape `App::run` does,
# because `run`'s per-frame closure takes no app callback and an input-driven
# game has to read this frame's input and write this frame's camera before the
# engine renders. See `scene::app`'s module doc comment for the engine-side fix
# that would remove this dependency.
[target.'cfg(target_arch = "wasm32")'.dependencies.axiom-windowing]
path = "../../modules/axiom-windowing"

# wasm32-only: the Web Audio binding in `audio::web_audio`, which realises a
# recorded `AudioGraph` against real nodes. Native `cargo test` never compiles
# it, which is exactly the point — the whole synthesis path is verified natively
# against goldens captured from the original JavaScript, and the browser edge is
# a transcriber with no decisions of its own. Module Law #9 confines `web_sys`
# to the `host` layer and the `windowing` module; that rule governs layers and
# modules. This is an app — the tier that owns browser bootstrap.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `Reflect::set`, to hang the dev console off `window` where a Playwright
# `eval` can reach it. wasm-bindgen has no property setter of its own.
js-sys = "0.3"
# The browser entries' panic hook, so a wasm panic reaches the console with a
# Rust backtrace instead of an opaque `unreachable`.
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterType",
    "ConvolverNode",
    "DynamicsCompressorNode",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "OverSampleType",
    "PannerNode",
    "PanningModelType",
    "PeriodicWave",
    "PeriodicWaveOptions",
    "StereoPannerNode",
    "WaveShaperNode",

    # DOM binding for `ui::dom` (the `el`/`svg`/`setStyle`/`setText`/`setClass`
    # realiser — `src/ui/util.js:30-77`), `ui::style` (the injected stylesheet,
    # `src/ui/style.js`), and every widget's element construction. The HUD is a
    # DOM/CSS overlay, not a canvas draw — this is its only browser surface.
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "HtmlBodyElement",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlStyleElement",
    "Node",
    "SvgElement",
    "SvggElement",
    "Window",
    # The minimap is the one canvas widget in a DOM HUD: `minimap.js` paints a
    # canvas2d display list, and `ui::minimap::view` is its realiser.
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",

    # Input (`input::dom` — the nine listeners `core/input.js`'s `attach()`
    # binds, plus the pointer-lock request and the gamepad poll) and the frame
    # clock the presentation loop measures its delta with.
    "EventTarget",
    "Gamepad",
    "KeyboardEvent",
    # The touch overlay (`crate::touch`). `PointerEvent` rather than
    # `TouchEvent`: it unifies mouse, touch and pen behind one event, carries the
    # `pointerId` the multi-touch bookkeeping needs, and extends `MouseEvent`
    # which is already here. `MediaQueryList` answers `(pointer: coarse)`, which
    # is half of "is this really a phone" — the other half is the width test.
    "MediaQueryList",
    "MouseEvent",
    "PointerEvent",
    "Navigator",
    "Performance",
    "WheelEvent",
] }

[dev-dependencies]
# `GpuBackendApi::bake_procedural_texture` — the executor for the requests
# `materials::gpu_bake` builds. Dev-only *here*: the shipped browser bundle
# reaches the same entry through `axiom-windowing`'s live binding, so the app
# itself never names the backend. The test names it because CPU<->GPU parity is
# the only thing that proves the WGSL in `materials::wgsl` and the CPU bake in
# `materials::bake` are the same function.
axiom-gpu-backend = { path = "../../modules/axiom-gpu-backend", features = ["offscreen"] }

# Reads `tests/audio/golden.json` — the capture of the original `src/audio/*.js`
# running under Node. Dev-only: nothing in the shipped crate parses JSON.
#
# `arbitrary_precision` is not decoration. serde_json 1.0.150 parses a decimal
# through `zmij`, whose rounding is off by one ULP on some inputs — measured
# here: the golden `0.20738044381141663` (an exact `f32` widened to `f64`) came
# back as `0.20738044381141665`, one ULP high, where `str::parse::<f64>` gives
# the correctly-rounded value. With this feature a `Number` keeps its source
# text and `as_f64` goes through `str::parse`, so a golden compares as the exact
# value the JavaScript printed. Without it the whole-graph comparisons would
# need a tolerance they do not deserve.
serde_json = { version = "1", features = ["arbitrary_precision"] }

# The deterministic agent substrate, and the runtime step that drives one
# decision. Dev-only: `tests/player_feel.rs` is a review bench, not shipped
# code, and it drives the movement controller the way an agent would rather
# than by poking `Input` — see that file's header for why that distinction is
# the point rather than ceremony.
axiom-agent = { path = "../../modules/axiom-agent" }
axiom-runtime = { path = "../../crates/axiom-runtime" }
