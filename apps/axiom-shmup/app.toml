# Axiom app manifest — Claude of Duty.
#
# The port of the browser FPS at `C:/dev/Claude-of-Duty` (Three.js r180, ISC).
# A composition leaf: nothing may depend on it. Every gameplay concept — the
# subsystem registry, the frame loop, the weapon and world data — lives here,
# never in a layer or a module. Engine *capability* the port needs (HDR targets,
# capsule contacts, the frame graph) lands in `crates/` and `modules/` and is
# consumed from here; see `docs/work-manifests/shmup-port/00-manifest.md`.
#
# Every entry below is a layer or module this app *names in non-test code*; an
# entry it never named would be the same ceremonial-dependency failure the Layer
# Law bans. The list grows as the port lands its rendering, physics and audio
# arms — today the ported deterministic core needs exactly one.

[app]
name = "shmup"
crate_name = "axiom-shmup"

allowed_layers = [
    # `Seconds` (the fixed step and the per-frame delta), `Meters` (the player
    # capsule and shadow distances) and `Ratio` (render scale, exposure, the ADS
    # scales) — the dimensioned quantities `config.js` ports into.
    "kernel",
    # `Mat4`/`Quat`/`Vec3` — the weapon geometry kit's (`weapons::geometry`)
    # transform composition and point/normal transforms, reused rather than
    # re-derived. See `apps/shmup/Cargo.toml`.
    "math",
    # `ProceduralBakeRequest`/`ProceduralBakeMaps` — the neutral bake contract
    # `materials::gpu_bake` authors so the procedural forge runs on the device
    # instead of at ~15.5 us a texel-evaluation on the CPU. It lives in a layer
    # rather than in the backend that executes it because Module Law #8 allows
    # one facade per module. Also `MapPixels`, the four optional maps a
    # `MaterialTexture` now carries.
    "host",
    # `WorldTag` — a stable name, a kind and a world position per point of
    # interest. `scene::console` tags every installed level batch with the
    # palette key it is made of, so the dev console can draw the codebase's own
    # identifier over the thing on screen. Without it an agent looking at a
    # screenshot has no route from a pixel back to a symbol, which is the
    # bottleneck this whole console exists to remove.
    "introspect",
]

allowed_modules = [
    # The engine umbrella. `viewer` and `scene::app` author against its
    # `App`/`setup`/`install`/`build` surface and upload the ported
    # `world::geo::WorldGeo` batches and `weapons::geometry::Geo` buckets
    # through its `MeshData`. This is the port's rendering arm; a *second* app
    # could not host it, because the Module Law makes apps leaves — nothing,
    # app or otherwise, may depend on `axiom-shmup`, so the scene has
    # to live in the crate that owns the geometry.
    "engine",
    # The live presentation loop, wasm32 only. `scene::app`'s browser entry
    # drives `WindowingApi::run_web_multi` itself — the same call `App::run`
    # makes — because `run` exposes no per-frame app hook, and an input-driven
    # game must read this frame's input and write this frame's camera before
    # the engine renders. `apps/burnt-rubber` and `apps/dog` do the same, for
    # the same reason.
    "windowing",
    # Test-only: `GpuBackendApi::bake_procedural_texture` executes the requests
    # `materials::gpu_bake` builds, and the CPU<->GPU parity test is the only
    # thing that proves `materials::wgsl` and `materials::bake` compute the same
    # function. The shipped bundle reaches the same entry through `windowing`.
    "gpu-backend",
]
