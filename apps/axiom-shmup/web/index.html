<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shmup</title>
  <style>
    /* The page the HUD's own stylesheet assumes.

       `ui/style.css.tpl` lays `.ow-hud` out as `position: fixed; inset: 0`, so
       every widget positions against the VIEWPORT. The canvas therefore has to
       BE the viewport: a letterboxed canvas centred inside a `<main>` put the
       crosshair on the middle of the page rather than the middle of the view,
       and the surrounding prose sat underneath an overlay that covers it. */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;
                 background: #07090c; color: #c9d4dd;
                 font-family: ui-monospace, Menlo, Consolas, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; background: #040507;
             touch-action: none; cursor: none; }
  </style>
</head>
<body>
<canvas id="shmup"></canvas>
<!-- `scene::wiring::hud::HOST_ID`. The HUD builds its overlay, its four layers
     and every widget's DOM in here, and injects `style.css.tpl` alongside. -->
<div id="ui"></div>
<!-- `?diag=1` — mirror the engine's own `axiom:` console lines onto the page.

     A phone has no console you can read over someone's shoulder, and the two
     facts that decide how a frame is exposed (which backend won, and whether
     the device granted HDR attachments) are logged and nowhere else. This turns
     a screenshot into a measurement. Off unless asked for, and it captures
     rather than generates: it prints what the engine already said. -->
<script>
  if (new URLSearchParams(location.search).has("diag")) {
    const box = document.createElement("pre");
    box.style.cssText =
      "position:fixed;left:0;top:0;z-index:99;margin:0;padding:8px;max-width:100vw;" +
      "white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.82);" +
      "color:#8fe;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace";
    box.textContent = "axiom diag: waiting for the backend to bind\u2026\n";
    addEventListener("DOMContentLoaded", () => document.body.append(box));
    const seen = [];
    const log = console.log.bind(console);
    console.log = (...a) => {
      const line = a.map(String).join(" ");
      if (line.startsWith("axiom:")) {
        seen.push(line);
        box.textContent = seen.join("\n\n");
      }
      log(...a);
    };
  }
</script>
<!-- `?report` — the device profiles ITSELF and posts the result back.

     A fault that appears on one phone and no desktop is diagnosed by asking
     that phone questions, and a screenshot is a terrible channel for it: one
     value per round trip, at human latency, through a tone map that saturates
     anything above a tenth to white. This sends DATA instead.

     The GPU facts come from a throwaway WebGL2 context, never the game's: the
     canvas's context type cannot be reclaimed once taken, so probing the real
     one would risk the very bind we are trying to inspect. A second context on
     a detached canvas answers the same driver.

     `text/plain` and no custom headers keeps this a CORS "simple request", so
     it needs no preflight and the sink needs no CORS implementation. -->
<script>
  if (new URLSearchParams(location.search).has("report")) {
    const lines = [];
    const say = (k, v) => lines.push(k + ": " + v);
    const log = console.log.bind(console);
    const warn = console.warn.bind(console);
    const captured = [];
    console.log = (...a) => { captured.push(a.map(String).join(" ")); log(...a); };
    console.warn = (...a) => { captured.push("WARN " + a.map(String).join(" ")); warn(...a); };
    addEventListener("error", (e) => captured.push("PAGEERROR " + e.message));

    const gpuFacts = () => {
      const c = document.createElement("canvas");
      const gl = c.getContext("webgl2");
      if (!gl) { say("webgl2", "UNAVAILABLE"); return; }
      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      say("renderer", dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "(masked)");
      say("vendor", dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : "(masked)");
      say("version", gl.getParameter(gl.VERSION));
      say("glsl", gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
      // The float-format extensions. These are the ones that differ between a
      // desktop ANGLE context and a mobile GLES driver, and they decide whether
      // a float target is renderable, filterable, or neither.
      ["EXT_color_buffer_float", "EXT_color_buffer_half_float",
       "OES_texture_float_linear", "OES_texture_half_float_linear",
       "WEBGL_depth_texture", "EXT_float_blend",
       "EXT_texture_filter_anisotropic", "OES_standard_derivatives"]
        .forEach((e) => say("ext " + e, gl.getExtension(e) ? "YES" : "no"));
      // Limits the shader is written against.
      [["MAX_TEXTURE_SIZE", gl.MAX_TEXTURE_SIZE],
       ["MAX_VARYING_VECTORS", gl.MAX_VARYING_VECTORS],
       ["MAX_FRAGMENT_UNIFORM_VECTORS", gl.MAX_FRAGMENT_UNIFORM_VECTORS],
       ["MAX_VERTEX_UNIFORM_VECTORS", gl.MAX_VERTEX_UNIFORM_VECTORS],
       ["MAX_TEXTURE_IMAGE_UNITS", gl.MAX_TEXTURE_IMAGE_UNITS],
       ["MAX_VERTEX_ATTRIBS", gl.MAX_VERTEX_ATTRIBS],
       ["MAX_DRAW_BUFFERS", gl.MAX_DRAW_BUFFERS],
       ["MAX_SAMPLES", gl.MAX_SAMPLES],
       ["MAX_UNIFORM_BLOCK_SIZE", gl.MAX_UNIFORM_BLOCK_SIZE]]
        .forEach(([n, e]) => say("limit " + n, gl.getParameter(e)));
      // Is a depth texture actually complete when sampled? The shadow map is
      // DEPTH_COMPONENT32F and the frame's whole sun term hangs off it.
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT32F, 64, 64);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, t, 0);
      say("depth32f fbo", gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE
        ? "COMPLETE" : "INCOMPLETE(" + gl.checkFramebufferStatus(gl.FRAMEBUFFER) + ")");
      say("gl error after depth fbo", gl.getError());
    };

    const send = () => {
      say("url", location.href);
      say("ua", navigator.userAgent);
      say("dpr", devicePixelRatio);
      say("screen", innerWidth + "x" + innerHeight);
      say("webgpu in navigator", "gpu" in navigator);
      try { gpuFacts(); } catch (e) { say("gpuFacts threw", String(e)); }
      try { say("stats", String(window.__ax_console && window.__ax_console("stats"))); }
      catch (e) { say("stats threw", String(e)); }
      const body = lines.join("\n") + "\n\n--- console ---\n" + captured.join("\n");
      const sink = "http://" + location.hostname + ":8123/report";
      fetch(sink, { method: "POST", mode: "no-cors",
                    headers: { "Content-Type": "text/plain" }, body })
        .then(() => { document.title = "report sent"; })
        .catch((e) => { document.title = "report FAILED " + e; });
      const box = document.createElement("pre");
      box.style.cssText = "position:fixed;left:0;top:0;z-index:99;margin:0;padding:8px;" +
        "max-width:100vw;white-space:pre-wrap;word-break:break-all;" +
        "background:rgba(0,0,0,.85);color:#8fe;font:11px/1.3 ui-monospace,monospace";
      box.textContent = "posted " + body.length + " bytes to " + sink + "\n\n" + body;
      document.body.append(box);
    };
    // Late enough that the engine has bound and logged, without needing a
    // readiness hook the page does not own.
    addEventListener("load", () => setTimeout(send, 12000));
  }
</script>
<script type="module">
  import init, { shmup_start } from "./pkg/axiom_shmup.js";
  await init();
  shmup_start();
</script>
</body>
</html>
