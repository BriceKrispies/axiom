<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Axiom — Sky Drop</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; gap: 10px;
        padding:
          max(14px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
        font: 14px/1.5 system-ui, sans-serif; background: #090b10; color: #d7dbe2;
      }
      h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: 1px; }
      h1 span { color: #4fd6ff; }

      #stage { position: relative; line-height: 0; max-width: 100%; }
      /* Keep the 720×600 aspect when the canvas scales down on narrow / mobile screens
         (height follows width) so the render isn't squished and the swipe, which is
         normalised by canvas height, keeps meaning the same throw. */
      #axiom-canvas {
        width: 720px; height: auto; aspect-ratio: 720 / 600; max-width: 100%;
        border: 1px solid #26303a; border-radius: 8px; background: #6ea8d8;
        touch-action: none; cursor: grab;
      }
      #axiom-canvas:active { cursor: grabbing; }

      /* ── in-canvas overlays ──────────────────────────────────────────────── */

      /* `#stage` sets line-height: 0 so the canvas has no descender gap. Every overlay
         is a child of it and would inherit that, collapsing multi-line readouts on top
         of each other — so each overlay restores a real line box. */
      .overlay {
        position: absolute; pointer-events: none;
        font-family: ui-monospace, monospace; line-height: 1.35;
      }

      /* Top-left: which drop, and the wind you have to beat. */
      #wind {
        left: 12px; top: 12px; display: flex; align-items: center; gap: 9px;
        background: rgba(8, 12, 18, 0.56); border: 1px solid rgba(120, 170, 210, 0.28);
        border-radius: 7px; padding: 7px 11px;
      }
      #wind-arrow {
        width: 26px; height: 26px; flex: none; color: #4fd6ff;
        transition: transform .25s ease-out;
      }
      #wind-text { font-size: 12px; letter-spacing: .5px; }
      #wind-text b { display: block; font-size: 17px; color: #eaf6ff; }
      #wind-calm { color: #8fa6b8; }

      /* Top-right: how many balls are left in the rack. Not a score. */
      #alt {
        right: 12px; top: 12px; text-align: right;
        background: rgba(8, 12, 18, 0.56); border: 1px solid rgba(120, 170, 210, 0.28);
        border-radius: 7px; padding: 7px 11px; opacity: 1; transition: opacity .2s;
      }
      #alt.spent { opacity: 0.4; }
      #alt .big { font-size: 24px; color: #eaf6ff; font-weight: 700; line-height: 1.1; }
      #alt .sub { font-size: 11px; color: #93a9bb; letter-spacing: .6px; }

      /* Bottom strip: drop counter, score, best. */
      #hud {
        display: flex; gap: 22px; width: 720px; max-width: 100%;
        font-family: ui-monospace, monospace; justify-content: center; align-items: center;
      }
      #hud b { color: #ffd08a; font-weight: 700; font-size: 18px; }
      #score { display: inline-block; transition: transform .1s, color .1s; }
      #score.pop { transform: scale(1.45); color: #7fffa8; }
      #mult.up { color: #7fffa8; }

      /* Round-over. Nothing about the score exists on screen before this appears. */
      #gameover {
        inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 7px; border-radius: 8px;
        background: rgba(5, 8, 13, 0.76); opacity: 0; transition: opacity .2s;
        text-align: center;
      }
      #gameover.show { opacity: 1; }
      #go-title { font: 800 34px/1 ui-monospace, monospace; color: #4fd6ff; letter-spacing: 2px; }
      #gameover .row { font-size: 16px; }
      #gameover b { color: #ffd08a; font-size: 23px; }
      #go-best.record { color: #7fffa8; }
      #go-restart { margin-top: 9px; color: #ffe25a; font-weight: 700; font-size: 14px; }

      /* The per-throw breakdown, revealed all at once when the rack is down. */
      #go-table {
        border-collapse: collapse; margin: 4px 0 6px; font-size: 13px;
        color: #cfe0ee;
      }
      #go-table td { padding: 1px 9px; text-align: right; }
      #go-table td.label { text-align: left; color: #9fb6c8; letter-spacing: .5px; }
      #go-table td.pts { color: #7fffa8; font-weight: 700; }
      #go-table tr.miss td, #go-table tr.miss td.pts { color: #d08a8a; }

      #instructions { color: #4fd6ff; font-weight: 700; font-size: 13px; text-align: center; }
    </style>

    <!-- The @axiom/game SDK loads as native ES modules via the import map below. -->
    <script type="importmap">
      { "imports": { "@axiom/game": "/vendor/axiom-game/index.js" } }
    </script>
  </head>
  <body>
    <h1>Axiom — <span>Sky Drop</span></h1>
    <div id="stage">
      <canvas id="axiom-canvas" width="720" height="600"></canvas>

      <div id="wind" class="overlay">
        <svg id="wind-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20V4" /><path d="M6 10l6-6 6 6" />
        </svg>
        <div id="wind-text">WIND<b id="wind-speed">0.0 m/s</b></div>
      </div>

      <div id="alt" class="overlay">
        <div class="big"><span id="alt-value">8</span></div>
        <div class="sub">BALLS LEFT</div>
      </div>

      <div id="gameover" class="overlay">
        <div id="go-title">RACK DOWN</div>
        <table id="go-table"><tbody id="go-rows"></tbody></table>
        <div class="row">TOTAL <b id="go-score">0</b></div>
        <div class="row">BEST <b id="go-best">0</b></div>
        <div class="row" id="go-bulls">0 bullseyes</div>
        <div id="go-restart">Press R or tap for a fresh rack</div>
      </div>
    </div>

    <div id="hud">
      <span>BALL <b id="drop">1/8</b></span>
      <span>THROW FROM <b id="stand">0 m</b></span>
      <span>BEST <b id="best">0</b></span>
    </div>
    <div id="instructions">
      Grab a ball and throw it &mdash; the next is in your hand at once
      &nbsp;·&nbsp; watch where they land and correct for the wind &nbsp;·&nbsp; you score the whole rack at the end
    </div>

    <script type="module" src="/dist/harness.js"></script>
  </body>
</html>
