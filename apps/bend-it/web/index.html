<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1410" />
  <title>Bend It — Axiom penalty-kick trajectory sculptor</title>
  <style>
    :root { color-scheme: dark; }
    /* The page is the game. Nothing scrolls, nothing selects, nothing rubber-bands:
       every gesture inside the viewport belongs to the trajectory editor. This is
       scoped to this page's own document, not to any embedder. */
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #0a1410; color: #e9f2ec;
      overflow: hidden; overscroll-behavior: none;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The canvas is measured, not declared: the wasm arm reads this laid-out box
       and configures the surface from it, so portrait phones get a portrait
       framebuffer instead of a stretched 16:9 one. */
    #axiom-bend-it-canvas {
      position: fixed; inset: 0; display: block;
      width: 100vw; height: 100vh; background: #0a1410;
      touch-action: none;
    }
    #boot {
      position: fixed; left: 0; right: 0; bottom: 12px; text-align: center;
      font-size: 12px; letter-spacing: .14em; color: #7fd6a4; opacity: .8;
    }
  </style>
</head>
<body>
  <canvas id="axiom-bend-it-canvas"></canvas>
  <div id="boot">loading…</div>
  <script type="module">
    const v = Date.now();
    const boot = document.getElementById("boot");
    try {
      const wasm = await import(`./pkg/axiom_bend_it.js?v=${v}`);
      const url = new URL(`./pkg/axiom_bend_it_bg.wasm?v=${v}`, import.meta.url);
      await wasm.default({ module_or_path: url });
      wasm.bend_it_start();
      boot.remove();
    } catch (e) {
      boot.textContent = "Startup failed: " + e;
      boot.style.color = "#ff8a8a";
      throw e;
    }
  </script>
</body>
</html>
