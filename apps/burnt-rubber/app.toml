[app]
name = "burnt-rubber"
crate_name = "axiom-burnt-rubber"

allowed_layers = [
    "kernel",
    "math",
    "frame",
    "host",
    # `RuntimeStep` — stamps each agent decision (the `agent` feature).
    "runtime",
    # The asphalt grain is an authored `FieldGraph` (`render/asphalt_field.rs`)
    # baked to RGBA8 through `TextureOp::Field`; `recipe` is the container that
    # one-node bake recipe is written in, and `proc-mesh` evaluates the graph the
    # boulder is baked from into neutral geometry.
    "field",
    "proc-texture",
    "recipe",
    "proc-mesh",
]

allowed_modules = [
    "engine",
    # The deterministic embodied-agent substrate the agent driver plays through.
    "agent",
    "input",
    "visibility",
    "audio",
    "windowing",
    "debug-overlay",
]
