[app]
name = "burnt-rubber"
crate_name = "axiom-burnt-rubber"

allowed_layers = [
    "kernel",
    "math",
    "frame",
    "host",
    # `RuntimeStep` — stamps each agent decision (the `agent` feature).
    "runtime",
]

allowed_modules = [
    "engine",
    # The deterministic embodied-agent substrate the agent driver plays through.
    "agent",
    "input",
    "visibility",
    "audio",
    "windowing",
    "debug-overlay",
]
