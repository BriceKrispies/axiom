# Semantic vertical-slice contract for **Burnt Rubber's agent-played golden run**.
#
# Where `app.toml` describes this package's *structural* place in the dependency
# graph, this file describes its *semantic* contract: the determinism test that
# proves the slice, and the committed golden `.bin` artifacts it pins.
#
# What is pinned here is not a posed still. It is **one continuous race**, driven
# grid-to-finish by the real `axiom-agent` driver (`src/agent.rs`) through the
# real app, with five checkpoints read out of that single run. See
# `src/golden.rs` for the run definition (seed, profile, tuning, framebuffer,
# driver technique, checkpoint stops) and `tests/agent_golden.rs` for the
# encoders and the assertions.
#
# Three artifacts per checkpoint, compared independently so a diff localizes:
#
#   * `agent_<name>_state.bin`     - the simulation at that checkpoint: where the
#     car is, how fast, how much boost, how many cars threaded, the camera, and
#     the delta to the agent's ghost.
#   * `agent_<name>_render.bin`    - the render boundary: every draw (including
#     its emissive and specular lanes), the camera matrix, the clear colour, the
#     lights, and the authored render look (ambient, fog, sky, bloom, grade).
#     This is the deterministic ancestor of the pixels.
#   * `agent_<name>_resources.bin` - a content fingerprint of every uploaded mesh
#     and every uploaded texture.
#
# The third exists because `FrameOutcome` carries a mesh *id*, never its
# vertices: geometry and texels are uploaded once at bind. Without it a road
# chunk built from a stale track, or a moved constant inside `asphalt_albedo`,
# would render a visibly different game while leaving the draw list byte-
# identical. Note that all five `resources` goldens are expected to hash
# identically to each other - the resource set is installed once at construction
# and nothing is generated during a race. Five files rather than one, so that a
# future change which made resources checkpoint-dependent shows up as a diff.
#
# Each golden is SHA-256-pinned, so a deleted / regenerated / hand-edited golden
# is caught by `cargo run -p xtask -- check-slices` - the CHECKER owns the
# baseline, not the test's `AXIOM_REGOLD` capture path.
#
# `harness` names the axiom-shot registration for the first checkpoint. The
# schema carries one harness name; all five checkpoints are registered
# (`burnt-rubber-golden-{grid,opening,esses,canyon,finish}`) and renderable:
#
#   cargo run -p axiom-shot --features offscreen -- \
#     --backend gpu --app burnt-rubber-golden-canyon --out screenshots/br.png
[slice]
name = "burnt-rubber"
crate_name = "axiom-burnt-rubber"
harness_entry = "build_golden_grid"
determinism_test = "agent_golden"
harness = "burnt-rubber-golden-grid"

# --- checkpoint 1: grid (step 0) - held on the grid, counting in -------------
[[golden]]
path = "tests/golden/agent_grid_state.bin"
sha256 = "1be607a91edef52f017a6f55fdc224a29cd8408c2a88ffb9fc22297b402c7249"

