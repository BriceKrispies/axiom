#     paint compensating for missing light, which poisons color_palette to buy
#     lighting_and_shadow.
# No app-tier config value can turn a directional lamp into a hemisphere, and the
# GLSL literal means the hardware arm could not have followed even if one could.
# The "cannot express" branch of the gate genuinely applies, and going structural on
# the first attempt was correct. What was missing was only the record and the score.

smallest_api = """
packages/axiom-web-engine — one field on the render contract, threaded to both
backends so they cannot diverge:
  * SceneFrame gains `ambient` (linear RGB).
  * the store gains `setAmbient()`, defaulting to DEFAULT_AMBIENT = [0.12, 0.12,
    0.12], so every pre-existing scene is byte-identical.
  * Scene gains an optional `ambient` that the run-game shell applies the same way
    it already applies `clearColor`.
  * shading.ts (the software truth) seeds its diffuse term from `frame.ambient`;
    backend-webgl2.ts replaces its inlined `vec3(0.12)` with a `uAmbient` uniform.
    No backend divergence — the value the software arm reads is the value the
    hardware arm reads.
App tier (apps/casino-games/web/src/games/treasure-chest-pick/scene.ts) then
authors what the reference actually shows: a warm sand-bounce hemisphere
([0.28, 0.25, 0.21]) with key/fill trimmed by exactly the exposure it supplies so
lit faces are unchanged, and the fake emissive dropped from the four materials that
were carrying it.

CRITIC ASSESSMENT OF THE PLACEMENT: correct, and correctly placed. Ambient IS a
per-frame property of the render contract, not a constant of the renderer, and the
diagnosis names that wrong shape rather than routing around it. The new surface is
one field plus one setter; the default reproduces the old constant exactly; the
duplicated GLSL literal — a real second source of truth — is retired rather than
edited; and the change DELETES app-tier debt (the fake fill lamp and four fake
emissives) instead of adding more. Not too-early, not ceremonial.

ONE STANDING CAVEAT: `ambient` is neutral scene data on the render contract, so it
reaches EVERY arm, including the guarded canvas2d one. That is allowed (the guard
is permitted to drift) and it is explicitly not a way to aim a change at one arm.
It is recorded here so nobody later mistakes an ambient change for
capability-gated, arm-scoped richness.
"""

