  * a filament strokes as a quadratic Bézier rather than a line.
  * the headless Canvas2D test stub learns `quadraticCurveTo`.
App tier: treasure-chest-pick opts in by passing a `waviness`.

CRITIC ASSESSMENT OF THE PLACEMENT: sound, minimal, and correctly placed. One
optional field on an existing options interface is the smallest surface that could
express this. `waviness` defaults to 0, and a quadratic whose control point lies on
