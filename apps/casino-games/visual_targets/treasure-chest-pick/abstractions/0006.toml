# And it genuinely is, on the merits. `drawStylizedWaterSurface` owns the RENDERING
# of the effect and the caller owns only the boundary and the cell size. The net's
# filaments were emitted with `lineTo`, so every cell was a literal straight-edged
# polygon. No value of `cellSize` produces a curve: a smaller one is a denser hex
# grid, a larger one is bigger hex tiles. The straightness lives in the geometry,
# inside the module that owns the geometry, so that is where it had to be fixed —
# the alternative would have been the app re-implementing the effect's stroke path
# in the game, which is precisely the "fix placed too high" this repo's No-Shortcuts
# rule bans. Going structural here on the first attempt was correct.

smallest_api = """
packages/axiom-web-engine/src/canvas-water.ts:
  * `StylizedWaterOptions` gains ONE optional field, `waviness` — how far each
