# the only per-surface modulation this engine has is `MeshData.ao`, and the only way
# to supply it is to author the geometry. That is inexpressibility of the plain kind,
# not a preference for going structural.

smallest_api = """
NO NEW ENGINE SURFACE — and that is the strongest thing in this record's favour.
`MeshData.ao` was already shipped by @axiom/web-engine, already multiplied into BOTH
the diffuse and the ambient term by BOTH backends, and entirely unused by every app.
This change is the first consumer, not a widening.

The whole change is one function plus one registry line in the game's own
presentation tier, apps/casino-games/web/src/games/treasure-chest-pick/scene.ts:

  * `aoBoxMeshData()` builds a unit cube — 24 vertices, 12 triangles, same winding,
    `closed: true` — carrying one baked occlusion scalar per vertex: a linear ramp in
    LOCAL y from BOX_AO_FLOOR = 0.8 at the bottom to 1.0 at the top. The 0.8 is
    SOLVED from the reference measurement (166/202 = 0.82 and 151/207 = 0.73 down two
    columns of the reference chest's front panel), not dialled by eye.
  * the shared mesh registry entry changes from `box: { kind: "box" }` to
    `box: { data: aoBoxMeshData() }`.

Nothing else moved: not one call site, not one instance, not one material. Because the
bake is a function of local y it is correct for every box at once rather than a chest
special case — a tall box ramps over its own height, a thin decal over its own small
one, and a floor slab (whose only visible face is its top, all four vertices at
y = +0.5) is left byte-identical, which is why the sand and the lagoon masses the
palette was solved against did not move.
"""

structural_class = """
THE PART THAT MAKES THIS A STRUCTURAL CHANGE RATHER THAN A DATA NUDGE, stated plainly
because the commit does not: the shared `box` is no longer an ENGINE PRIMITIVE. It is
now app-authored custom geometry. Every box in this scene — chest bodies, slats,
strap posts, the lock plate, the hasp, castle walls, the plaque — is drawn from a mesh
this game builds itself, and it therefore no longer participates in whatever the
engine's own `createMesh` path does for a primitive (its per-MeshKind handle cache and
its backend-chosen facet/LOD scaling; see abstractions/0004, which exists because that
cache used to be one handle per kind).

That is exactly the gate blind spot the pass-7 promote entry names in
`gate_blind_spots`: the guard's deterministic ceiling counts scene NODES, so an
app-authored mesh is one node no matter how many triangles it carries, while the
software rasterizer genuinely pays per triangle. This change is the first one on this
target to make that reachable.

ON THE MERITS IT DID NOT SPEND IT: 24 vertices and 12 triangles, byte-for-byte what
the primitive box had, and zero new nodes — so no new cost landed on the guarded arm,
which is this pass's stated arm constraint. The blind spot stays OPEN for the next
change, and closing it means the gate also pinning triangles-per-frame.
"""

