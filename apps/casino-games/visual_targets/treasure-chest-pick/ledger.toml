assumed: `subject_fidelity` scores THE NINE CHESTS AND THE NAMEPLATE, the subject of
the frame. That is the definition the 97aae627 card itself asserted, and used to
criticise pass 6 for spending its subject_fidelity change on the palm. Under the
alternative reading (fold the crab, castle and shells in, as that same card's prose
also did) the axis stays 1 and the attack axis stays subject_fidelity, because the crab
is still a blob. The disagreement is live and is published, not buried — anyone who
holds the other reading should say so before a change is spent.
  The move is credited to 312b0880 (pass-7 modeler), measured on disk. It is NOT
credited to cff697db.

cff697db IS NOT CONVERGENCE AND IS NOT A REGRESSION. It is a correctness fix — props
out of the water, the crab stays on his mark — and it is the right fix at the right
layer. On this exam its effect is neutral-to-slightly-negative and no axis moves for
it: the palm's new home puts its crown within ~0.02 of frame of the LEFT FRAME EDGE
(the commit says the frame edge, not the water, is what caps it), against a reference
palm that sits comfortably inside the frame with its raking shadow filling the left
sand; and the crab's pennant now reads as a red bar laid across his shell. Nobody may
report it as progress toward the reference, and nobody may report the promote of it as
a scored pass — e8ad0260 correctly attached no score to itself.

ABSTRACTION GATE: MISSING RECORD, BACKFILLED AS abstractions/0007.toml. 367bf28d
(pass-7 surfacing) re-declared the game's shared `box` from the ENGINE PRIMITIVE
`{ kind: "box" }` to app-authored custom geometry `{ data: aoBoxMeshData() }` carrying
a baked per-vertex AO ramp, changing the construction path for every box in the scene.
No record existed. ON THE MERITS IT IS SOUND, and the strongest thing about it is what
it did NOT add: `MeshData.ao` was already shipped by @axiom/web-engine and already
consumed by both backends, so this is the first CONSUMER, not a spine widening. The
inexpressibility branch genuinely applies (no textures and no normal maps on either
arm, so a flat facet carries exactly one value and no config can put a gradient inside
it), the bake value is solved from a reference measurement rather than dialled, and it
cost zero new nodes and zero new triangles. NOT too-early on that branch, NOT
ceremonial. The >=3-attempts branch is not satisfied and is not claimed: ZERO bounded
attempts had been spent on this axis, which had been tied-lowest for two passes.
  Three honest riders are in the record. (a) The axis it was booked against did not
  move: material_and_texture_detail is 1 before and 1 after. (b) It is the change that
  makes the guard's gate blind spot REACHABLE — the ceiling counts scene NODES, and an
  app-authored mesh is one node whatever its triangle count — and it did not spend it
  (24 vertices, 12 triangles, byte-for-byte the primitive box), so no new cost landed
  on the guarded arm and this pass's arm constraint holds. The blind spot stays OPEN.
  (c) The other pass-7 change examined for the gate, 312b0880, was judged NOT to owe a
  record (box instances within the vocabulary the scene already used — generation/data,
  not a new primitive); that judgement is written into 0007 rather than left silent,
  because it is the change that moved the lowest axis.
  This is the SIXTH record the critic has backfilled (0003, 0004, 0005, 0006, 0007 —
  six of the campaign's seven). The mechanism that would make the gate
  self-satisfying, a proposing lens writing its own NNNN.toml in its own commit, has
  still never been used once.

RETIRED LEVER CLAIMS, so no change is spent on a dead one. Two claims that stood on
the previous card as unspent wins are now closed, and the card says so:
  * `MeshData.ao` IS NOW IN USE (367bf28d). It is ONE SCALAR per vertex: it darkens,
    it cannot change hue and it cannot add grain.
  * `MaterialSpec.roughness` IS NOT A LEVER ON THIS GEOMETRY. Settled in-tree in the
    pass-7 promote entry's `disputes_resolved`: shading.ts multiplies the Blinn lobe by
    gloss and drives shininess = 8 + 120*gloss from it, so on an axis-aligned box face
    under this rig the specular term peaks near 4.4e-4 — invisible. campaign.toml's
    "the cheapest unspent wins on the board" block still reads as though both levers
    are live and unspent; it is now WRONG on both counts and should be corrected by
    whoever next owns that file. This lens did not edit campaign.toml, to keep this
    commit to bookkeeping the audit strictly requires.

