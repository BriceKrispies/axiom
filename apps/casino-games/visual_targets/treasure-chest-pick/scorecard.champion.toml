# Champion scorecard — treasure-chest-pick
#
# CRITIC PASS 8 — A RE-SCORE OF A NEW IMAGE, NOT A RECALIBRATION OF A MIS-SCORED ONE.
# The card this replaces (97aae627) measured the PASS-6 champion. Since it was
# written, FIVE render changes landed (the pass-7 stack: 78fdb2d8, 312b0880,
# 1a788d9b, 367bf28d, 8abc0027), the champion was re-captured at 0442a4b2, and then
# cff697db moved the palm and the crab off the shoreline and removed the crab's
# side-scuttle idle, forcing a second re-capture (e8ad0260). The promote commit said
# so in its own body: "scorecard.champion.toml still measures the pass-7 image and is
# STALE until this pass's critic re-scores." This file is that re-score.
#
# THE STALE CARD WAS WRONG ABOUT THE IMAGE ON DISK IN FOUR PLACES, ALL IN THE
# DIRECTION OF TOO HARSH, and one of them was load-bearing on the attack axis:
#   1. "the chests ... NO lid strap band, NO corner brackets, NO lock plate" — FALSE
#      of this image. Verified on 7x LANCZOS crops of THREE separate chests (left
#      column bottom, centre bottom, right column middle): every chest carries a gold
#      lock plate with a square keyhole, two small gold corner brackets on the base
#      skirt, and a pair of lighter vertical strap posts framing a barrel-curved lid.
#      That is the pass-7 modeler change (312b0880) in the frame.
#   2. "the sand ... 240,197,113 ... 19 levels too blue and 6 too green" — FALSE of
#      this image. Measured 242,190,96 / 242,190,96 / 243,193,98 / 243,194,98 at four
#      sand samples against the reference's 248,194,97 / 244,190,97 / 238,183,86 /
#      242,188,97. Blue error is ~3 levels, not 19. That is the pass-7 colorist
#      (8abc0027).
#   3. "the castle has no arched doorway" / doorway listed ABSENT — the castle base
#      carries a dark recessed doorway. It is RECTANGULAR, not arched, so the
#      execution gap is real; the presence claim was not.
#   4. "the density target missed: 0.699" — re-measured 0.621 on this image
#      (see lighting_and_shadow). Still short of the reference's 0.556, but not 0.699.
# Points 2-4 do not move a score. Point 1 does, and it moves the attack axis with it.
#
# ── SAME EXAM AS THE CARD IT REPLACES ─────────────────────────────────────────
# Judged arm webgl2, 948x597, --clip stage, scene chests-ready. Reference era D
# (1536x1024, installed 2026-08-06), UNCHANGED. So the delta against the 97aae627
# card is a real result, not an arm/era artifact. Every card at iterations 0-6
# measured canvas2d 468x293 against a different reference and stays void for
# comparison (campaign.toml [scoring.calibration] comparable_from_pass = 6).
#
# canvas2d-guard.png is NOT SCORED HERE AND IS SCORED NOWHERE. It was opened once,
# for legibility only: 468x293, nine chests and the nameplate legible, pool, palm,
# castle, crab and shells present, not black, no error state. Nothing in this file is
# credited to or blamed on it.
#
# ── CALIBRATION ────────────────────────────────────────────────────────────────
# Bar = "indistinguishable from the reference." A render that merely reads as the same
# subject is a 1, not a 3; a stylized/low-poly render is not a 4-5. When unsure
# between two scores, take the LOWER — that rule is doing real work on color_palette
# again this pass (the sand hue now essentially lands, and the axis still holds at 2).
# final_score = lowest_axis * 0.7 + average * 0.3. Lowest axis (ties broken by the
# fixed axis order in campaign.toml [scoring] axes) is the next flaw.
#
# ── MEASUREMENT METHOD ────────────────────────────────────────────────────────
# Every number is measured on the two PNGs on disk (champion md5
# 3b34763099960355b64effe453eaae69, verified byte-identical to the champion worktree).
# Detail energy is mean |laplacian| on a copy resampled to 948px wide so the
# resolution difference flatters neither image. Palm-quadrant foliage mass is a strict
# green mask (g>r+15 & g>b+15) over the upper-left 40% x 50% — the same restricted
# mask the previous card used, NOT the invalid whole-frame version. Water statistics
# here use a centred ellipse mask (0.28w x 0.30h about (0.50, 0.60)) which INCLUDES
# the chests, so its absolute std is not comparable to the previous card's water
# figures; only the champion-vs-reference ratio within this pass is.
#
# ── WHAT THE REFERENCE (1536x1024) IS ─────────────────────────────────────────
# A photoreal-toy beach diorama, path-traced look. Warm tan sand fills the frame with
# a real gradient and grain (four corner samples spread 10/10/11 levels per channel).
# A round turquoise pool sits centre-frame (54,196,199 in open water) carrying
# irregular organic caustic cells — broad soft value bands rising to near-white — plus
# a distinctly paler shallow RIM ring. Nine wooden chests staged 3x3 on the water,
# each with visible plank grain, dark nail marks, strap posts with iron detail, gold
# corner brackets, a large gold lock plate with a chunky square keyhole, and a base
# skirt; their bases are slightly submerged with a legible waterline and a soft
# reflection. Margin props: a tall segmented TAPERING palm with six long drooping
# tapered fronds, three coconuts, a grass tuft, rocks, and a long soft cast shadow
# raking left that throws a LEGIBLE FROND SILHOUETTE; a red crab with modelled claws,
# legs and eyes; a crenellated sand castle with three tapering turrets, an ARCHED
# doorway with a lintel, an arrow slit, and a red pennant on a pole with a silver
# finial; an orange scallop, white scallops, spiral conches, a sea urchin, snail
# shells, pebbles — staged into all four corners. The brand appears EXACTLY ONCE, on a
# red rounded nameplate above the CENTRE chest.
#
# ── WHAT THE CHAMPION (948x597, webgl2, --clip stage, chests-ready) IS ────────
# The same staging skeleton, executed as flat-shaded low-poly proxies — but the
# chests are no longer bare boxes. Each of the nine now reads as a barrel-lidded chest
# with four slats, two strap posts, a base skirt, two gold corner brackets and a gold
# lock plate with a square keyhole, and the ACME nameplate reads cleanly (gold frame,
# red plate, white glyphs) exactly once, on the centre chest. The sand hue now
# essentially lands (242,190,96 against ~243,189,94) and the lagoon base colour still
# does (52..90,189..206 against 54..62,196..199). Against that: the sand is FLAT — four
# samples spread 1/4/2 levels where the reference spreads 10/10/11 — with no grain and
# no gradient; the pool carries a sparse web of thin pale filaments with visible white
# junction dots instead of broad soft caustic cells, and no near-white highlights
# (whole-frame p98 200 against 223); every chest sits ON the water with no waterline,
# no submerged base and no reflection, each ringed by a large soft dark ellipse that
# extends on ALL sides of it, plus a second, much larger and softer dark disc behind
# the centre chest with no reference counterpart; the palm is a radial sawtooth splat
# whose near-horizontal fronds bury its own untapered two-cylinder trunk, with no
# coconuts and no grass tuft, throwing a plain ELLIPSE; the castle is three untapered
# cylinders with a rectangular doorway and a flag plank welded to a tower rather than
# a pennant on a pole; the crab is a red blob with a red bar for a pennant; the shells
# are hard-edged cream polygon fans. Whole-frame: luminance p2/median/p98 =
# 45/168/200 against 35/164/223 (std 43.2 vs 53.0), mean saturation 153.3 vs 159.3,
# mean |laplacian| 7.68 vs 10.78 — 71% of the reference's local detail energy, with
# p99 151 against the reference's 110, i.e. what edge energy it has is still HARDER
# than the reference's rather than richer.
#
# ── cff697db IS NOT CREDITED AS CONVERGENCE ───────────────────────────────────
# It is a correctness fix (props out of the water, crab stays on his mark) and it is
# the right fix. Its visual effect on THIS exam is neutral-to-slightly-negative and
# no axis moves for it: the palm's new home (-6.0,-3.0) puts its crown within ~0.02
# of frame of the LEFT FRAME EDGE, where the reference's palm sits well inside the
# frame with its raking shadow filling the left sand, and the crab's pennant now
# reads as a red bar laid across his shell. Nobody may book cff697db as progress
# toward the reference, and nobody may book the subject_fidelity move below to it —
# that move is the pass-7 modeler (312b0880), measured on disk.

final_score = 1.25   # lowest 1 * 0.7 + average 1.83 * 0.3
next_attack_axis = "material_and_texture_detail"   # earliest of the three axes tied at 1

reference_era = "D"        # 1536x1024, installed 2026-08-06 (1e821742) — unchanged
judged_arm = "webgl2"      # the ONLY arm scored here; canvas2d-guard.png is NOT scored
comparable_with = "the 97aae627 card (same arm, same reference) and pass 8 onward"

# ── THE ONE AXIS THAT MOVED, AND WHY THE ATTACK AXIS MOVES WITH IT ────────────
axis_move = """
subject_fidelity 1 -> 2. It is the only integer that changes, and it changes because
the image changed, not because the bar did.

That +1 retires subject_fidelity as the attack axis after TWO passes at the minimum,
and hands the attack to material_and_texture_detail — the earliest of the three axes
still tied at 1 (material 8th, detail_density 10th, scene_props_completeness 11th in
campaign.toml's canonical order).

THE MOVE HINGES ON A DEFINITION, SO THE DEFINITION IS STATED AND THE BOARD CAN
OVERRULE IT. `subject_fidelity` here scores THE NINE CHESTS AND THE NAMEPLATE — the
subject of this frame. That is the definition the previous card asserted and then used
to criticise pass 6 for spending its subject_fidelity change on the palm ("The subject
of this frame is the nine chests"), and it is the definition that keeps this axis from
double-counting the margin props, which have three axes of their own
(scale_and_proportion, silhouette_readability, scene_props_completeness). Under it, the
chests now satisfy anchor 2 exactly: the right structure is emerging — the three
identifying features the reference chest carries are all present in proxy form — and it
is obviously stylized next to the reference.
  UNDER THE ALTERNATIVE READING (fold the crab, castle and shells into this axis, as
the previous card's prose also did) THIS AXIS STAYS AT 1 AND THE ATTACK AXIS STAYS
subject_fidelity, because the crab is still a blob. That is a live disagreement, not a
resolved one, and it is on the card rather than buried so whoever disagrees can say so
before a change is spent.
"""

[axes]

# The champion's strongest axis, held at 3. The pool still sits where the reference's
# pool sits and the palm, castle and crab still occupy the same quadrants at roughly
# the same relative scale. Clearly on-model -> 3.
# NOT 4, for the same staging reason as before plus one new one:
#   * the reference stages props right into all four corners and along all four edges;
#     the champion's margins carry four or five lone shell fans and three discs, and
#     its bottom corners are nearly bare.
#   * NEW, from cff697db: the palm crown now reaches to within ~0.02 of frame of the
#     LEFT EDGE (the commit says the frame edge, not the water, is what caps how far
#     out it can go), against a reference palm that sits comfortably inside the frame.
#     The prop is at the frame limit and the reference's is not.
#   * the aspect mismatch (1.588 judged vs 1.50 reference) is visible in the crop and
#     can never fully resolve; campaign.toml's aspect_note governs how to read it.
composition_and_framing = 3

# RAISED 1 -> 2, and this is the only score that moves. See `axis_move` above for the
# definitional basis; the evidence is measured, on three separate chests, at 7x:
#   PRESENT NOW (all nine chests): a gold lock plate with a square keyhole; two gold
#   corner brackets on the base skirt; two lighter vertical strap posts framing the
#   lid; a barrel-curved four-slat lid; a base skirt with a dark recess under it. The
#   previous card said "NONE of them", which was true of the image it measured and is
#   false of this one.
#   STILL ABSENT: plank grain, nail marks, the iron banding across the lid, a
#   waterline, a submerged base, and any reflection — all four of which read plainly
#   in the reference at the same crop. The lid is faceted rather than smooth, the
#   hardware is matte where the reference's is brass, and the whole chest reads as
#   moulded plastic.
# Right structure emerging, obviously stylized/simplified next to the reference -> 2.
# This is NOT a claim of convergence on the frame as a whole: the crab, castle and
# shells are unchanged proxies and are scored as such on their own three axes.
subject_fidelity = 2

# Held at 2, and the error on the palm has FLIPPED SIGN rather than closed. Chest-to-
# pool staging is close and the 3x3 grid's footprint is right; the chests remain
# somewhat small and thin for their pool. The margin props are still the real error,
# but no longer by being too small: palm-quadrant foliage mass now measures 14.53%
# against the reference's 12.90% — the canopy is ~113% of the reference's visual mass,
# where the previous card measured 64%. The pass-7 art-director grew the crown ~38%
# and overshot. The castle is still too short for its footprint and its towers do not
# taper; the crab and shells are still tokens. Right structure, obviously simplified
# and now overshooting in the margins -> 2.
scale_and_proportion = 2

# Held at 2. The nine chests read instantly and cleanly at native resolution, and
# their new hardware is legible at 1:1 — that is the subject and it reads. The palm
# does not: the grown crown's fronds now radiate near-horizontally and BURY the trunk,
# so the palm reads as a flat green sawtooth splat rather than as six long drooping
# fronds on a tapering trunk. The castle reads as a cylinder bundle with merlons; the
# crab reads as a blob with a red bar across it; the shells read as folded paper.
# Right structure emerging, obviously stylized -> 2.
silhouette_readability = 2

# HELD AT 2 UNDER "WHEN UNSURE, TAKE THE LOWER", and the note is where the real result
# of pass 7 lives. The sand — 55% of the frame, and the previous card's named dominant
# defect — now essentially LANDS in hue: four samples 242,190,96 / 242,190,96 /
# 243,193,98 / 243,194,98 against the reference's 248,194,97 / 244,190,97 /
# 238,183,86 / 242,188,97. Blue error ~3 levels where the previous card measured 19.
# The lagoon base colour still lands. Whole-frame mean saturation 153.3 against 159.3
# (the previous card measured 144.3 — 56% of that remaining gap closed).
# A 3 is genuinely arguable now and is NOT taken, for two reasons that are about the
# colour SET rather than about execution: the champion's palette contains no
# near-white values at all (whole-frame p98 200 against 223, and the reference's
# brightest caustic cells are its signature), and the reference's brass/gold family is
# reduced to two small matte tabs and a plate per chest. The flatness itself is scored
# under material_and_texture_detail and contrast_and_exposure, not double-counted here.
# The defect on this axis has now RELOCATED TWICE — water (pass 6) -> sand (pass 7) ->
# the missing bright end. That is the actionable fact for whoever attacks it.
color_palette = 2

# Held at 2, and it recovered slightly from the previous card's measured slide.
# Luminance p2/median/p98 = 45/168/200 (champion) against 35/164/223 (reference); std
# 43.2 against 53.0, up from 42.8. Still compressed at BOTH ends — blacks 10 levels
# lighter, highlights 23 levels darker, total range 155 against 188 — and the median
# still sits 4 levels high. The reference's contrast comes from near-white caustic
# highlights against genuinely dark shadow cores; the champion's comes from hard steps
# between flat facets plus the new chest shadow ellipses. Right range family, wrong
# mechanism, still measurably narrower -> 2.
contrast_and_exposure = 2

# Held at 2. There is a coherent key: every shadow offsets the same way, the palm,
# castle, crab and all nine chests are grounded, and the cast-shadow family is
# cool-tinted. The palm shadow density improved and the previous card's figure is
# superseded: shadow core 147,119,69 against sand 242,192,97 = luminance ratio 0.621,
# per-channel [0.607,0.620,0.711], against the reference's core 142,104,55 on sand
# 248,192,92 = 0.556, per-channel [0.573,0.542,0.598]. Closer, still lighter than the
# reference, and NOBODY may quote a landed target: 0.621 is what shipped.
# Not more than 2 for three reasons:
#   * there is still no shadow SHAPE anywhere. Every shadow is a soft blob or an
#     ellipse; the reference's palm throws a long raking silhouette with legible
#     fronds, and the pass-7 crown growth only made the ellipse bigger.
#   * there is still no light in the water: no caustics, no specular, no waterline.
#   * the chest shadows, re-solved for water in pass 7, now read as dark ellipses
#     centred on the chest and extending on all sides of it rather than as offset
#     casts (scored as an artifact below, and it is the same defect seen twice).
# Right structure, obviously simplified -> 2.
lighting_and_shadow = 2

# TIED LOWEST AND NOW THE ATTACK AXIS. @axiom/web-engine has no textures and no normal
# maps on EITHER arm (campaign.toml is explicit), so this axis is flat base colour plus
# a shading model, against a reference carrying plank grain, nail marks, brass sheen,
# sand grain and water caustics. Measured on this image: the sand samples spread
# 1/4/2 levels per channel where the reference spreads 10/10/11 — the largest area in
# the frame carries no surface information at all; mean |laplacian| is 7.68 against
# 10.78 (71%) and the champion's p99 is 151 against the reference's 110, i.e. its edge
# energy is harder, not richer. The slats and the new hardware are geometry, not
# material. A legible flat proxy -> 1.
# WHAT THE ATTACKER MUST KNOW, so no fourth change is spent on a dead lever:
#   * MeshData.ao IS NOW IN USE (pass-7 surfacing, 367bf28d — see abstractions/0007).
#     The unused-lever claim on the previous card is spent. AO is ONE SCALAR per
#     vertex: it can darken, it cannot change hue or add grain.
#   * MaterialSpec.roughness IS NOT A LEVER ON THIS GEOMETRY, settled in-tree in the
#     pass-7 promote entry (`disputes_resolved`): shading.ts multiplies the Blinn lobe
#     by gloss AND drives shininess = 8 + 120*gloss from it, so on an axis-aligned box
#     face under this rig the specular term peaks near 4.4e-4 — invisible. Anyone
#     citing roughness as "the cheapest unspent lever" is repeating a retired error.
#   * the stylized-water primitive (abstractions/0003) and its `waviness` widening
#     (0006) were both justified against a "hex-honeycomb water surface" read off a
#     SUPERSEDED reference. Era D's water is broad soft caustic value bands, not a net
#     of lines. Two changes have already been spent bending that lattice. Re-test the
#     premise before spending a third.
material_and_texture_detail = 1

# Held at 2. The lagoon rim reads as a real shoreline, the paler shallow rim ring is
# present, the chest shadows land on the water and read as water, and sand/water
# separate cleanly by value. Against that, unchanged: the chests sit ON the water
# rather than IN it — no submerged base, no waterline, no reflection, where the
# reference gives all three at the same crop — and the sand is a single flat value
# with no gradient to carry distance across 55% of the frame. Right structure,
# obviously simplified -> 2.
depth_and_separation = 2

# Tied lowest. Measured: 71% of the reference's local detail energy (mean |laplacian|
# 7.68 vs 10.78) on a resolution-normalised copy, up from 68%.
# THE 68% -> 71% IS NOT BOOKED AS CONVERGENCE ON THIS AXIS. Part of the added energy
# is the chest hardware (legible incident, and credited under subject_fidelity), but
# part is the filament net, the leaflet sawtooth and the new shadow-ellipse edges —
# hard line work rather than the reference's soft incident — and the champion's
# |laplacian| p99 of 151 against the reference's 110 shows the added energy is still
# harder-edged than what it stands in for. Absent at every scale, unchanged: sand
# grain, real caustics, coconuts, the grass tuft, rock clusters, an arched doorway,
# plank grain, nail marks, shell variety. The reference is dense at every scale; the
# champion is a clean, sparse proxy -> 1.
detail_density = 1

# Tied lowest, and it is presence that is missing, not just quality. PRESENT: palm,
# castle, pennant, a rectangular castle DOORWAY (which the previous card listed as
# absent and which is plainly there in the base of the plinth), crab, nine chests,
# nameplate, cream shell fans, an orange radial disc and yellow discs, at least one
# grey pebble at the lower-left, and the pool's paler shallow rim ring. Those two
# corrections do not move the score. ABSENT ENTIRELY: the palm's three coconuts, the
# grass tuft, the rock clusters at the palm base, the spiral conches, the snail
# shells, and the pebble scatter — and the reference's five distinct shell forms still
# collapse into one repeated polygon fan. Roughly half the reference's roster is
# missing and the half that is present is proxy -> 1.
scene_props_completeness = 1

# Held at 2. Of the three at-a-glance off-reference artifacts the previous card named,
# one softened further, one got WORSE, and one is untouched:
#   1. SOFTENED AGAIN, NOT RETIRED. The pool's filament net is now sparse and pale
#      rather than a dense web, but it is still a full-pool scatter of thin hard pale
#      outlines with visible white DOTS at the junctions, at a cell pitch several
#      times the reference's caustic cells. It still reads as a drawn decal rather
#      than as light in water. Two commits (bf8cc58e, dc760d39 — one of them a spine
#      widening) have been spent on it without retiring it.
#   2. WORSE, NOT BETTER. Every chest is now ringed by a large soft dark ellipse that
#      extends on ALL sides of it rather than offsetting with the key, and the ellipse
#      shows a visible concentric banding step at its edge. Behind the CENTRE chest
#      there is additionally a much larger, softer dark disc with no reference
#      counterpart at all. The pass-7 lighting change (1a788d9b) made these read as
#      water rather than as smudge, which is a real gain in colour, and simultaneously
#      made the halo geometry more prominent. This is the axis's dominant defect now.
#   3. UNTOUCHED. The shell props still render as hard-edged cream polygon fans that
#      read as clipped geometry, and one of them now visibly intersects a palm frond
#      tip at the upper-left.
# Otherwise clean: no z-fighting, no tearing, no stair-stepping. -> 2.
# The 3 -> 2 drop from an older card was an ARM ARTIFACT (the retired 468x293 canvas2d
# arm hid sub-resolution defects; the judged arm draws at native 1:1). Nobody may book
# that as a regression, and nobody may book any behaviour of the guarded canvas2d arm
# — better or worse — as anything at all. That arm is never scored.
artifact_level = 2
