# Champion scorecard — treasure-chest-pick
#
# CRITIC PASS 7 recalibration. This file REPLACES the pass-6 scorecard, which was
# marked STALE in-file by the pass-6 setup commit (1e821742) because two things
# changed underneath it at once.
#
# ── THIS IS A FRESH DERIVATION, NOT A DELTA ───────────────────────────────────
#
#   1. THE JUDGED ARM CHANGED. Iterations 0-6 all scored the CANVAS2D software
#      rasterizer at 468x293 without the campaign ever saying so. The judged arm
#      is now WEBGL2 at 948x597 native (campaign.toml [arms]).
#   2. THE REFERENCE CHANGED. reference.png was replaced on 2026-08-06 (era C ->
#      era D: 1408903 -> 2085031 bytes, 1614x974 -> 1536x1024, aspect 1.657 ->
#      1.50). It is the FOURTH reference this campaign has had.
#
# Every number below is re-derived from scratch against the CURRENT champion.png
# and the CURRENT reference.png. NONE of it is comparable to any score in
# iterations 0-6 (campaign.toml [scoring.calibration] comparable_from_pass = 6).
# Several axes below read HIGHER than the pass-6 card. THAT IS NOT PROGRESS. It is
# a different arm being measured against a different reference — a different exam.
# Anyone who reports one of these numbers as an improvement is faking progress,
# and the ledger entry for this pass says so in as many words.
#
# ── CALIBRATION ────────────────────────────────────────────────────────────────
# Bar = "indistinguishable from the reference." A render that merely reads as the
# same subject is a 1, not a 3; a stylized/low-poly render is not a 4-5. When
# unsure between two scores, take the LOWER.
# final_score = lowest_axis * 0.7 + average * 0.3. Lowest axis (ties broken by
# the fixed axis order) is the next flaw.
#
# AXIS ORDER. campaign.toml [scoring] axes is the canonical order and this file is
# now laid out in it. It has to be said plainly that the campaign has been
# carrying TWO conflicting "fixed orders": campaign.toml puts
# scene_props_completeness 11th, while every scorecard and ledger key block since
# iteration 0 puts it 3rd. That discrepancy is load-bearing — it IS the tie-break —
# and it is why iterations 1, 2, 5 and 6 each named scene_props_completeness "the
# earliest axis tied at 1" when under campaign.toml's order it is the LAST of the
# tied axes. See the ledger. It does not change this pass's answer: subject_fidelity
# is the earliest axis at the minimum under BOTH orders.
#
# ── WHAT THE REFERENCE (1536x1024) IS ─────────────────────────────────────────
# A photoreal-toy beach diorama, path-traced look. Warm tan sand fills the frame
# with a real gradient and grain (measured 241,186,90 top-left drifting to
# 232,176,81 bottom-left, ~10-12 levels per channel corner to corner). A round
# turquoise pool sits centre-frame (measured 57,196,198 — a BRIGHT cyan, G and B
# essentially equal) carrying irregular, organic caustic ripple cells in near-white,
# plus a distinctly paler shallow RIM ring. Nine wooden chests staged 3x3 on the
# water, each with visible plank grain, dark iron/brass strap bands across the
# barrel lid, gold corner brackets, and a large gold lock plate with a square
# keyhole; their bases are slightly submerged with a legible waterline and soft
# reflections. Margin props: a tall segmented palm with SIX drooping tapered fronds,
# three coconuts, a grass tuft, rocks, and a LONG soft cast shadow raking left; a
# red crab with modelled claws, legs and eyes; a crenellated sand castle with corner
# turrets, an arched doorway and a red pennant on a pole; an orange scallop, white
# scallops, spiral conches, a sea urchin, small snail shells, pebbles. Everything is
# grounded by soft directional cast shadows. The brand appears EXACTLY ONCE, on a
# red rounded nameplate above the CENTRE chest.
#
# ── WHAT THE CHAMPION (948x597, webgl2, --clip stage, chests-ready) IS ────────
# The same staging skeleton, executed as flat-shaded low-poly proxies. Measured:
# a single-value sand field (240,197,113 at three corners, 241,199,114 at the
# fourth — spread <=2 levels, so still NO gradient and no grain, and 11-23 levels
# paler/less saturated than the reference); a round lagoon whose water is the right
# HUE family but far too dark (63,163,158 against the reference's 57,196,198 — G is
# 33 low, B is 40 low) overlaid with a REGULAR geometric hex lattice where the
# reference has irregular caustics; nine chests that are boxes with slat lines, a
# faceted lid and one small flat yellow tab, with NO strap band at the lid seam, NO
# corner brackets and NO lock plate; a five-plank palm with no coconuts, no taper
# and no grass tuft; a cylinder-cluster castle; a red blob crab; and shells that
# render as hard-edged cream polygon fans. Whole-frame measurements: luminance
# p2/median/p98 = 45/181/206 against the reference's 35/164/223 (range 161 vs 188,
# std 45.1 vs 53.0), mean saturation 140.4 vs 158.9, and mean |laplacian| on a
# resolution-normalised copy 6.69 vs 11.0 — the champion carries 61% of the
# reference's local detail energy, and a visible share of what it does carry is the
# hex lattice rather than legible detail.

final_score = 1.23   # lowest 1 * 0.7 + average 1.75 * 0.3
next_attack_axis = "subject_fidelity"   # tied lowest (1), earliest in the fixed axis order

reference_era = "D"        # 1536x1024, installed 2026-08-06 (1e821742)
judged_arm = "webgl2"      # the ONLY arm scored here; canvas2d-guard.png is NOT scored
comparable_with = "pass 7 onward only"

[axes]

# Measured, and it is the champion's strongest axis. The lagoon's watery-pixel
# bounding box lands at x 0.168..0.831, y 0.184..0.988 of frame against the
# reference's x 0.180..0.854, y 0.160..0.979 — width share 0.664 vs 0.674, height
# share 0.804 vs 0.818. The pool sits where the reference's pool sits to within
# ~1.5% of frame on both axes, DESPITE the aspect mismatch (1.588 judged vs 1.50
# reference), and the palm, castle and crab occupy the same quadrants at roughly
# the same relative scale. Clearly on-model -> 3. Not 4: the reference's margins
# are staged edge to edge (props right into all four corners) where the champion's
# bottom corners are nearly bare, and the aspect difference is visible in the crop.
# NOTE: this is a fresh derivation on a new arm and a new reference. Do NOT read it
# against the pass-6 card's 2.
composition_and_framing = 3

# THE LOWEST AXIS, and the one the higher-resolution judged arm exposed. The
# reference chest's three most identifying features are a strap band across the
# barrel lid, gold corner brackets, and a large gold lock plate with a square
# keyhole. At 948x597 native it is now unambiguous that the champion chest has NONE
# of them: it is a box with slat lines, a faceted lid, and one small flat yellow tab
# at the base. The palm is five flat planks with no taper, no coconuts and no grass
# tuft; the crab is a red blob with two dots; the shells are cream polygon fans. The
# ACME nameplate is the one element that genuinely reads. This is the textbook 1:
# you can tell what each thing is MEANT to be, and nobody would mistake any of it
# for the reference. The pass-6 card's 2 was granted on a 468x293 canvas2d image
# where the missing hardware could not be resolved at all; it does not survive
# being able to see the chest.
subject_fidelity = 1

# Mixed, with systematic prop undersizing. Chest-to-pool staging is close and the
# 3x3 grid's footprint is right. The margin props are not: the palm-foliage mask
# covers 1.38% of the champion frame against 2.46% of the reference's — the canopy
# carries 56% of the reference's visual mass — and the castle is too short for its
# footprint while the crab and shells shrink to tokens. Right structure, obviously
# simplified in the margins -> 2.
scale_and_proportion = 2

# The nine chests read instantly and cleanly at native resolution, and that is the
# subject. Nothing in the margins does: the palm silhouette reads as a pinwheel of
# planks rather than a frond crown, the castle as a bundle of cylinders, the crab as
# a smear, the shells as folded paper. Right structure emerging, obviously
# stylized -> 2.
# ARM WARNING: this axis reads the rasterizer directly. Its movement from the
# pass-6 card is caused by the arm switch (half-resolution-and-stretched -> native
# 1:1) and is NOT campaign progress.
silhouette_readability = 2

# The families are right and the hue error the pass-6 card measured is genuinely
# gone — the water is cyan again (champion 63,163,158, G and B within 5 of each
# other, matching the reference's G=B relationship) rather than navy. What is left
# is a VALUE error in the same direction across the whole frame: water 33/40 levels
# too dark in G/B, sand 11/23 levels too pale in G/B and completely flat, mean
# saturation 140.4 vs 158.9, and the chest gold reduced to one small tab so the
# reference's brass mass is essentially absent. Right palette, visibly detuned -> 2.
color_palette = 2

# Re-measured on this arm: luminance p2/median/p98 = 45/181/206 (champion) vs
# 35/164/223 (reference); std 45.1 vs 53.0. The champion is compressed at BOTH
# ends — blacks 10 levels lighter, highlights 17 levels darker, total range 161 vs
# 188 — and its median sits 17 levels high, so the frame reads flat and slightly
# hot. The reference's contrast comes from near-white caustic highlights against
# genuinely dark shadow cores; the champion's comes from hard steps between flat
# facets. Right range family, wrong mechanism, measurably narrower -> 2.
contrast_and_exposure = 2

# There is now a coherent key: every shadow in the frame offsets the same way, and
# the palm, castle, crab and all nine chests are grounded by a contact shadow. That
# is the right structure. It is not more than 2, because every one of those shadows
# is a soft blob or an ellipse — there is no shadow SHAPE anywhere. The reference's
# palm throws a long raking silhouette with legible fronds; the champion's throws a
# diffuse patch. And there is no light in the water at all: no caustics, no
# specular, no waterline. Right structure, obviously simplified -> 2.
lighting_and_shadow = 2

# Tied lowest. @axiom/web-engine has no textures and no normal maps on EITHER arm
# (campaign.toml is explicit), so this axis is flat base colour plus Lambert against
# a reference that carries plank grain, brass sheen, sand grain and water caustics.
# Measured proof that nothing has moved: the sand field samples within 2 levels at
# all four corners while the reference varies 10-12; mean |laplacian| on a
# resolution-normalised copy is 6.69 vs 11.0. The slat lines on the chests are
# geometry, not material. A legible flat proxy -> 1.
# FOR WHOEVER ATTACKS THIS: the stylized-water primitive (abstractions/0003) was
# justified against a "hex-honeycomb water surface" read off a SUPERSEDED
# reference. Era D's water carries IRREGULAR organic caustic cells, not a regular
# hex lattice. Re-examine that premise before spending a change on top of it.
material_and_texture_detail = 1

# The lagoon rim reads as a real shoreline, the chest shadows land on the water,
# and sand/water separate by value. Against that: the chests sit ON the water
# rather than IN it — no submerged base, no waterline, no reflection, where the
# reference gives all three — and the sand is a single flat value with no gradient
# to carry distance. Right structure, obviously simplified -> 2.
depth_and_separation = 2

# Tied lowest. Measured: the champion carries 61% of the reference's local detail
# energy (mean |laplacian| 6.69 vs 11.0) on a resolution-normalised copy, and part
# of that 61% is the hex lattice rather than legible incident. Absent at every
# scale: sand grain, caustics, coconuts, the grass tuft, rock clusters, the castle's
# arched doorway, keyholes, plank grain, shell variety. The reference is dense at
# every scale; the champion is a clean, sparse proxy -> 1.
# ARM WARNING: this axis reads the rasterizer directly. Movement from the pass-6
# card is arm-caused, not progress.
detail_density = 1

# Tied lowest, and it is presence that is missing, not just quality. Present: palm,
# castle, pennant, crab, chests, nameplate, some cream shell fans, orange and yellow
# discs. ABSENT ENTIRELY: the palm's three coconuts, the grass tuft, the rock
# clusters at the palm base, the castle's arched doorway, the pool's paler shallow
# rim ring, the sea urchin, the spiral conches, and the pebble scatter — and the
# reference's five distinct shell forms collapse into one repeated polygon fan.
# Roughly half the reference's roster is missing and the half that is present is
# proxy. Present but proxy -> 1.
scene_props_completeness = 1

# LOWERED FROM 3, and the reason matters for the record. Three off-reference
# artifacts are visible at a GLANCE, which is exactly what a 4 excludes and what a
# 3 ("mostly clean") no longer survives:
#   1. a REGULAR geometric hex lattice is drawn across the whole lagoon — roughly
#      30% of the frame — reading as a wireframe overlay. Era D's reference water
#      carries irregular organic caustics; a uniform hex net matches nothing in it.
#   2. a large soft dark oval still sits behind the centre chest with no reference
#      counterpart.
#   3. the shell props render as hard-edged cream polygon fans that read as clipped
#      geometry rather than as shells.
# Otherwise clean: no z-fighting, no tearing, and the stair-stepped diagonals the
# old arm had are gone. -> 2.
# THIS IS NOT A REGRESSION IN THE APP. Artifact 1 was sub-resolution and "barely
# legible" on the old 468x293 canvas2d arm; the judged arm now draws at native 1:1,
# so it became visible. Nobody may book this as a drop, and nobody may book its
# absence on the guarded arm as a win — the guard is never scored.
artifact_level = 2
