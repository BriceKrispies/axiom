# Champion scorecard — treasure-chest-pick
#
# FRESH CRITIC CALIBRATION against the CURRENT reference.png (the clean beach
# diorama installed 2026-07-24, ledger iteration 4) and the CURRENT champion.png
# (re-shot at f233fe43 from the app at dc16f3b2). This replaces the stale
# scorecard, which scored the RETIRED branded reference and carried
# next_attack_axis = "recalibrate". The recalibration is now paid.
#
# Calibrated to IDENTITY/PARITY, harshly. Bar = "indistinguishable from the
# reference." A render that merely reads as the same subject is a 1, not a 3; a
# stylized/low-poly render is not a 4-5. When unsure between two scores, take the
# LOWER. Axis list + ORDER are fixed for the whole campaign (order breaks
# "lowest axis" ties). final_score = lowest_axis * 0.7 + average * 0.3.
#
# THE REFERENCE (1614x974): a wide storybook beach diorama. Warm golden-tan sand
# fills the frame edge-to-edge with soft gradient and grain; a ROUND turquoise
# pool with a hex-honeycomb surface and a paler shallow rim sits centre-frame;
# nine gilded wooden chests are staged 3x3 ON the water — barrel-arc lids, thick
# gold trim with corner brackets, a gold lock plate with a square keyhole, soft
# modelled shading. Margin props: a tall segmented palm with six drooping tapered
# fronds, coconuts, a grass tuft and a LONG soft cast shadow; a red crab; a
# crenellated sand castle with corner turrets, an arched doorway and a red
# pennant; an orange starfish, a yellow starfish, white seashells, pebbles.
# Everything is grounded by soft cast shadows. The brand appears EXACTLY ONCE: a
# red rounded nameplate above the CENTRE CHEST.
#
# THE CHAMPION (960x600, canvas2d, seed 470573198, shot=90): the same staging
# skeleton, executed as flat proxies. A single-value tan sand field (sampled
# 222,180,106 identically at both corners — no gradient, no grain), a POLYGONAL
# (decagonal) teal-green pool (31,150,143 — greener/darker than the reference's
# 49,158,158) with a soft off-reference glow disc under the centre chest, nine
# flat-front chests with two gold straps, a bright yellow base band and a small
# tab in place of the lock plate (no barrel arc, no corner brackets, no keyhole),
# a stumpy palm with six flat rectangular plank fronds and a small blob shadow,
# a pillar-cluster castle, a red blob crab, and dot-sized shells/starfish.
#
# WHAT THIS PASS CHANGED, AND WHY (recalibration moves in BOTH directions):
#   scene_props_completeness  0 -> 1  RAISED. The old 0 ("not built") is a
#       factual error against today's app: the palm, crab, castle, shells and
#       pebbles were built on the pass-3 line and are visible in the champion.
#       They are crude proxies, so 1 — but scoring absent geometry that exists is
#       as dishonest as inflation.
#   silhouette_readability    2 -> 1  LOWERED. The old 2 was written when the
#       props did not exist and only the chest outlines were being judged. Now
#       that they render, the frame's silhouettes are actively WRONG, not merely
#       missing: the palm reads as a stump with planks, the castle as a bundle of
#       pale fingers, the crab as a blob. A wrong silhouette scores below an
#       absent one being generously graded on the chests alone.
#   artifact_level            4 -> 3  LOWERED. "Clean" no longer holds: the pool
#       boundary is visibly faceted (a decagon where the reference is round) and
#       the centre-chest glow disc is a hard-edged off-reference halo. Both are
#       conspicuous at 100%, so 4 ("look closely to tell them apart") is too high.
#   Everything else is re-derived from scratch against the NEW reference and
#       happens to land on the same number; the prose below is new, the numbers
#       are not carried over.

final_score = 1.2   # lowest 1 * 0.7 + average 1.667 * 0.3
next_attack_axis = "scene_props_completeness"   # lowest (1), earliest in fixed axis order

[axes]
# The compositional skeleton is right: centred pool in a sand surround, 3x3 grid
# on the water, palm upper-left / castle upper-right / crab left / shells along
# the bottom, aspect 1.60 vs the reference's 1.66, pool ~72% of frame width in
# both. It is held at 2 by real deviations you cannot miss side-by-side: the pool
# is a hard decagon where the reference's is round; the props are undersized
# relative to their reference counterparts (the reference palm is ~1/3 frame
# height, the champion's ~1/4 and much narrower); and the margins carry far less
# staged incident. Right structure, obviously simplified -> 2.
composition_and_framing = 2

# The chests are modelled, not boxes: flat-front body, two vertical gold straps,
# a lid/body split, a bright gold base band with a lock TAB, a dark plinth. That
# is "the right structure emerging" -> 2. It is nowhere near 3: the reference lid
# is a barrel ARC (the champion's is a flat slab), the reference carries gold
# CORNER BRACKETS and a real lock PLATE with a square keyhole (the champion has a
# featureless tab), the reference wood is soft-shaded saddle brown and the
# champion's is a paler flat tan with hard value steps. Borderline 1/2; kept at 2
# only because the strap+trim+lock vocabulary is genuinely present.
subject_fidelity = 2

# CORRECTED FROM 0. The props exist: palm, crab, sand castle with a pennant,
# white shells, yellow/orange scatter, pebbles. But every one is a crude proxy
# nobody would mistake for the reference — the palm is a stumpy trunk with six
# flat rectangular planks (no tapered drooping fronds, no coconuts, no grass
# tuft, no long cast shadow), the castle is a cluster of pale prisms with no
# walls, no arched doorway and no readable turret ring, the crab is a red blob
# with a dark stalk, and the starfish are round dots with no arms. That is the
# textbook "1": present but proxy. Still the dominant identity gap and the
# correct next axis.
scene_props_completeness = 1

# LOWERED FROM 2. Chest outlines read. Nothing else does: the palm silhouette
# reads as a stump with sticks, the castle as a bundle of fingers, the crab as a
# smear. The reference's whole appeal is crisp, instantly-nameable low-poly
# silhouettes. Wrong-shaped silhouettes are worse than missing ones -> 1.
silhouette_readability = 1

# Canvas2D flat-shade: hard value steps, no texture, no normal map, no AO, no
# gradient. Sampled proof: the sand field is the SAME RGB at both frame corners
# (222,180,106) while the reference's varies (224,169,90 -> 232,177,98) and
# carries grain. The reference shows voxel-grain wood, brass sheen, grainy sand
# and soft shading falloff. A legible flat proxy -> 1.
material_and_texture_detail = 1

# The reference grounds everything with soft, consistent, directional shadows —
# most conspicuously a LONG palm shadow raking across the sand, plus contact
# shadows under every chest, the crab and the castle, and ambient occlusion in
# the crevices. The champion has a small blob under the palm, faint smudges under
# the chests, and an off-reference glow disc under the centre chest. No coherent
# key direction reads across the frame -> 1.
lighting_and_shadow = 1

# The families are right and the sand is close (222,180,106 vs 224,169,90). Held
# at 2 by two measured shifts: the water is greener and darker (31,150,143 vs
# 49,158,158) and misses the reference's paler shallow RIM ring entirely, and the
# chest wood is a paler tan against the reference's saturated saddle brown. Right
# palette, visibly detuned -> 2.
color_palette = 2

# Global range is comparable (p2/median/p98 = 79/184/210 champion vs 80/163/199
# reference), so this is not an exposure blowout. But the champion's contrast is
# manufactured by hard flat steps between adjacent facets, where the reference's
# comes from soft modelling plus genuinely dark contact shadows. Same range,
# wrong mechanism -> 2.
contrast_and_exposure = 2

# The 3x3 stagger plus faint chest smudges give some grounding, and the pool rim
# separates water from sand. But with no real cast shadows and a flat sand field
# the props sit ON the image rather than IN the scene; the reference separates
# sand / shallows / water / props by value and shadow -> 2.
depth_and_separation = 2

# Chest proportion and grid spacing are close. The PROPS are not: the champion's
# palm is short and narrow-canopied, the castle has a tiny footprint and is too
# tall/thin for it, the crab and starfish are dots where the reference stages
# them as substantial silhouettes. Mixed, with an obvious systematic prop
# under-scaling -> 2.
scale_and_proportion = 2

# The champion is sparse: no grass tuft, no coconuts, no castle doorway or wall
# detail, no starfish arms, few pebbles, no sand grain, and the honeycomb reads
# only faintly. The reference is dense at every scale -> 1.
detail_density = 1

# LOWERED FROM 4. Two conspicuous rendering artifacts: the pool boundary is a
# hard DECAGON where the reference's is a smooth circle (a tessellation artifact
# on a shape meant to read round), and a hard-edged soft-glow disc sits under the
# centre chest with no reference counterpart. Otherwise clean — no z-fighting, no
# tearing, no stray aliasing. Artifact level scores cleanliness, not identity, so
# it stays the highest axis, but not at 4 -> 3.
artifact_level = 3
