[package]
name = "axiom-claude-of-duty"
description = "Claude of Duty: the browser FPS at C:/dev/Claude-of-Duty (Three.js r180, ISC) ported onto Axiom. This crate carries the game — every gameplay concept stays app-local, per the Module Law's composition-leaf rule."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `Seconds` (the fixed step and the frame delta handed to every subsystem),
# `Meters` (the player capsule dimensions and the shadow distance) and `Ratio`
# (render scale, exposure, the ADS FOV/sensitivity scales) — the dimensioned
# quantities the ported `config.js` data is authored in, so a naked float never
# crosses a subsystem boundary with its unit left to guesswork.
axiom-kernel = { path = "../../crates/axiom-kernel" }
