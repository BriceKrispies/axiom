[package]
name = "axiom-claude-of-duty"
description = "Claude of Duty: the browser FPS at C:/dev/Claude-of-Duty (Three.js r180, ISC) ported onto Axiom. This crate carries the game — every gameplay concept stays app-local, per the Module Law's composition-leaf rule."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `Seconds` (the fixed step and the frame delta handed to every subsystem),
# `Meters` (the player capsule dimensions and the shadow distance) and `Ratio`
# (render scale, exposure, the ADS FOV/sensitivity scales) — the dimensioned
# quantities the ported `config.js` data is authored in, so a naked float never
# crosses a subsystem boundary with its unit left to guesswork.
axiom-kernel = { path = "../../crates/axiom-kernel" }

# `Mat4`/`Vec3`/`Quat` — the weapon geometry kit's transform primitives
# (`weapons::geometry`). `Geo::apply` uses `Mat4`'s normal-matrix-correct
# point/direction transform directly; the primitive builders (`box_geo`,
# `lathe_z`, `dome`, `knurl_band`, ...) build `Mat4::translation`/`::scale`
# and `Mat4::from_quaternion` rotations to reproduce
# `BufferGeometry.translate`/`rotateX`/`rotateZ`/`scale` (`geometry.js`)
# rather than hand-rolling a second, parallel transform path.
axiom-math = { path = "../../crates/axiom-math" }

# wasm32-only: the Web Audio binding in `audio::web_audio`, which realises a
# recorded `AudioGraph` against real nodes. Native `cargo test` never compiles
# it, which is exactly the point — the whole synthesis path is verified natively
# against goldens captured from the original JavaScript, and the browser edge is
# a transcriber with no decisions of its own. Module Law #9 confines `web_sys`
# to the `host` layer and the `windowing` module; that rule governs layers and
# modules. This is an app — the tier that owns browser bootstrap.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterType",
    "ConvolverNode",
    "DynamicsCompressorNode",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "OverSampleType",
    "PannerNode",
    "PanningModelType",
    "PeriodicWave",
    "PeriodicWaveOptions",
    "StereoPannerNode",
    "WaveShaperNode",
] }

[dev-dependencies]
# Reads `tests/audio/golden.json` — the capture of the original `src/audio/*.js`
# running under Node. Dev-only: nothing in the shipped crate parses JSON.
#
# `arbitrary_precision` is not decoration. serde_json 1.0.150 parses a decimal
# through `zmij`, whose rounding is off by one ULP on some inputs — measured
# here: the golden `0.20738044381141663` (an exact `f32` widened to `f64`) came
# back as `0.20738044381141665`, one ULP high, where `str::parse::<f64>` gives
# the correctly-rounded value. With this feature a `Number` keeps its source
# text and `as_f64` goes through `str::parse`, so a golden compares as the exact
# value the JavaScript printed. Without it the whole-graph comparisons would
# need a tolerance they do not deserve.
serde_json = { version = "1", features = ["arbitrary_precision"] }
