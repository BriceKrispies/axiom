<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude of Duty — Weapon Parts Viewer</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #07090c; color: #c9d4dd;
                 font-family: ui-monospace, Menlo, Consolas, monospace; }
    main { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
    h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
         margin: 0; color: #7f8f9c; }
    canvas { width: min(94vw, 1280px); aspect-ratio: 16 / 9; background: #040507;
             border: 1px solid #1a2028; touch-action: none; }
    p { margin: 0; font-size: 12px; color: #5d6b77; text-align: center; max-width: 70ch; }
    code { color: #8fa3b2; }
  </style>
</head>
<body>
<main>
  <h1>Weapon Parts &mdash; ported geometry</h1>
  <canvas id="claude-of-duty-parts"></canvas>
  <p>
    Left to right: <code>addUpperReceiver</code>, <code>buildMagazine</code>,
    <code>buildOptic</code>, <code>addMuzzleDevice</code> &mdash; each built at its real
    <code>buildRifle()</code> dimensions, in metres at real scale, on a turntable camera.
  </p>
</main>
<script type="module">
  import init, { claude_of_duty_parts_start } from "./pkg/axiom_claude_of_duty.js";
  await init();
  claude_of_duty_parts_start();
</script>
</body>
</html>
