[package]
name = "axiom-dog"
description = "Axiom app: dog. A composition-leaf browser/WASM scene of concentric rings of walking rigged dachshunds on generated terrain, in which every visible shape is produced by axiom-mesh-ops operators and validated by axiom-mesh, driven live from a generated slider panel. No imported geometry, no hand-typed vertex arrays."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `cdylib` for the app's own wasm bundle (the `dog_start` entry); `rlib` so
# native integration tests can call the pure `scene_meshes` scene builder
# without a browser.
[lib]
name = "axiom_dog"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# The engine umbrella (module `engine`): App/RunningApp, MeshData registration,
# materials, camera, lights, spawning.
axiom = { path = "../../modules/axiom" }
# The unit-safe scalar quantities every mesh operator speaks.
axiom-kernel = { path = "../../crates/axiom-kernel" }
# Vectors, transforms, matrices, and the `Curve` a sweep rides.
axiom-math = { path = "../../crates/axiom-math" }
# The canonical validated mesh + its bounds/normals/transform/combine/digest ops.
axiom-mesh = { path = "../../crates/axiom-mesh" }
# The deterministic geometry library: every shape in this app comes from here.
axiom-mesh-ops = { path = "../../crates/axiom-mesh-ops" }

# Browser/live arm only: the wasm-bindgen glue, the panic hook, the live
# windowing presentation loop, and the query-string read that selects a debug
# view. Confined to wasm32, so native `cargo test` compiles none of it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
axiom-windowing = { path = "../../modules/axiom-windowing" }
# `FrameCamera` — the live presentation arm hands the windowing driver the real
# camera the frame was composed with, rather than one rebuilt from the orbit
# dials. Only the wasm arm presents, so only the wasm arm needs it.
axiom-host = { path = "../../crates/axiom-host" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# Window/Location: the query-string read and the resize-settled reload.
# History: `replaceState`, so every dial move is in the address bar and the one
# non-live dial (detail) can answer with a reload that restores the whole scene.
# Document/Element/Node/HtmlElement/HtmlCanvasElement/HtmlInputElement/
# CssStyleDeclaration: finding the canvas, capturing pointers on it, pinning
# `touch-action: none`, and BUILDING the dial panel — every slider on the page is
# created from the dial table in `src/config.rs`.
# HtmlButtonElement: the stage switch — both buttons on the page are created from
# the `Stage` enum in `src/stage.rs`.
# EventTarget/Event/MouseEvent/PointerEvent/WheelEvent/AddEventListenerOptions:
# the orbit camera's gestures — one pointer path for mouse, touch and pen, plus a
# non-passive wheel listener so `preventDefault()` is honoured.
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "History",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Node",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "Window",
] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
