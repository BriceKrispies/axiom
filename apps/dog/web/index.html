<!doctype html>
<html lang="en">
<head>
  <!-- An inline empty icon. Without it the browser probes /favicon.ico, gets a
       404, and logs a console error — which makes "the console must be clean"
       a useless check for anyone verifying this page. -->
  <link rel="icon" href="data:," />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Dog</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #070a0f; color: #d8e8f6;
                 font-family: ui-monospace, Menlo, Consolas, monospace;
                 /* The canvas owns every gesture inside its box; the page must
                    still never scroll sideways because of what is below it. */
                 overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    main { display: flex; flex-direction: column; align-items: center; gap: 12px;
           padding: 12px 12px 32px; padding-left: max(12px, env(safe-area-inset-left));
           padding-right: max(12px, env(safe-area-inset-right)); box-sizing: border-box; width: 100%; }
    canvas { width: min(94vw, 1180px); max-width: 100%; height: auto; aspect-ratio: 16 / 9;
             display: block; background: #000; border: 1px solid #1b2634;
             /* Required, and not sufficient on its own — the Rust side also
                calls preventDefault() on every pointer and wheel event. Both
                halves are undone while the camera is locked, which is what hands
                scrolling over the canvas back to the page: src/pointer_input.rs
                writes `touch-action: auto` inline, overriding this rule. */
             touch-action: none; }
    /* The stage switch. Both buttons are created by src/stage_input.rs from the
       Stage enum in src/stage.rs — this is only its dress. It sits directly
       under the canvas because it changes what the canvas is showing, where the
       panel below only changes how much of it there is. */
    #dog-stages { width: min(94vw, 1180px); max-width: 100%; box-sizing: border-box;
                  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .stage-button { flex: 1 1 160px; max-width: 260px; min-height: 40px; padding: 10px 16px;
                    font-family: inherit; font-size: 11.5px; letter-spacing: .1em;
                    text-transform: uppercase; color: #9fd4ff; background: #0b1119;
                    border: 1px solid #24384c; border-radius: 6px; cursor: pointer;
                    touch-action: manipulation; }
    .stage-button.on { color: #070a0f; background: #9fd4ff; border-color: #9fd4ff; }
    .stage-button:focus-visible { outline: 1px solid #ffd79a; outline-offset: 2px; }

    /* The camera lock. One button, created by src/lock_input.rs from the
       CameraLock enum in src/camera_lock.rs — this is only its dress. It is a
       mode rather than a choice of scene, so it sits in its own row under the
       stage switch and wears the amber the read-outs use rather than the blue
       the stage switch does. */
    #dog-lock { width: min(94vw, 1180px); max-width: 100%; box-sizing: border-box;
                display: flex; justify-content: center; }
    .lock-button { flex: 0 1 260px; min-height: 40px; padding: 10px 16px;
                   font-family: inherit; font-size: 11.5px; letter-spacing: .1em;
                   text-transform: uppercase; color: #ffd79a; background: #0b1119;
                   border: 1px solid #3c3524; border-radius: 6px; cursor: pointer;
                   touch-action: manipulation; }
    .lock-button.on { color: #070a0f; background: #ffd79a; border-color: #ffd79a; }
    .lock-button:focus-visible { outline: 1px solid #9fd4ff; outline-offset: 2px; }

    p.hint { margin: 0; font-size: clamp(11px, 3vw, 12.5px); letter-spacing: .04em;
             text-align: center; color: #9fd4ff; opacity: .82; max-width: min(94vw, 1180px); }
    p.hint b { color: #ffd79a; font-weight: 600; }
    /* Two hints, one shown: the camera's gestures while it is free, the crowd's
       while it is locked. src/camera_lock.rs owns which class each one wears. */
    p.hint.gone { display: none; }

    /* The dial panel. Every control inside it is created by src/slider_input.rs
       from the dial table in src/config.rs — this is only its dress. The grid
       wraps to one column on a narrow screen, and each row is its own grid so the
       labels and the read-outs line up down the panel. */
    #dog-controls { width: min(94vw, 1180px); max-width: 100%; box-sizing: border-box;
                    display: grid; gap: 6px 18px; padding: 12px 14px;
                    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                    border: 1px solid #1b2634; border-radius: 6px; background: #0b1119; }
    .dial { display: grid; grid-template-columns: 1fr auto; align-items: center;
            column-gap: 10px; row-gap: 2px; }
    .dial-name { font-size: 11.5px; letter-spacing: .08em; opacity: .68; }
    .dial-value { font-size: 11.5px; color: #ffd79a; text-align: right;
                  font-variant-numeric: tabular-nums; }
    /* A touch target a finger can actually land on, with no hover-only
       affordance anywhere: the thumb is always drawn. */
    .dial-slider { grid-column: 1 / -1; width: 100%; margin: 0; height: 26px;
                   accent-color: #9fd4ff; background: transparent; touch-action: pan-y;
                   -webkit-appearance: none; appearance: none; }
    .dial-slider::-webkit-slider-runnable-track { height: 3px; background: #24384c; border-radius: 2px; }
    .dial-slider::-moz-range-track { height: 3px; background: #24384c; border-radius: 2px; }
    .dial-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
                                         width: 20px; height: 20px; margin-top: -8.5px;
                                         border-radius: 50%; background: #9fd4ff; border: 0; }
    .dial-slider::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%;
                                     background: #9fd4ff; border: 0; }
    .dial-slider:focus-visible { outline: 1px solid #ffd79a; outline-offset: 2px; }
  </style>
</head>
<body>
<main>
  <canvas id="axiom-dog-canvas"></canvas>

  <div id="dog-stages"></div>

  <div id="dog-lock"></div>

  <p class="hint" id="dog-hint-camera">
    <b>drag</b> to orbit · <b>pinch</b> or <b>wheel</b> to zoom · <b>two fingers</b> or <b>right-drag</b> to pan
  </p>

  <p class="hint gone" id="dog-hint-dogs">
    <b>drag a dog</b> to move it — it shoves the others aside and walks back into step ·
    <b>drag the ground</b> to scroll the page
  </p>

  <div id="dog-controls"></div>
</main>
<script type="module">
  import init, { dog_start } from "./pkg/axiom_dog.js";
  await init();
  dog_start();
</script>
</body>
</html>
