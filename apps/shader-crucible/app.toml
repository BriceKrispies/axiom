# Axiom app manifest — the shader crucible.
#
# A composition leaf: nothing may depend on it. Every entry below is a layer or
# module this app *names in non-test code*; an entry it never named would be the
# same ceremonial-dependency failure the Layer Law bans.

[app]
name = "shader-crucible"
crate_name = "axiom-shader-crucible"

allowed_layers = [
    # `Ratio`/`Meters` (the dimensioned camera and colour literals), `KernelApi`
    # and `Seconds` (the frame's engine clock — never a wall clock).
    "kernel",
    # `Vec2`/`Vec3`/`Vec4` — the lanes every channel constant, evaluation
    # context and scene transform is built from.
    "math",
    # The typed pointwise field IR. Every station's appearance is an authored
    # `FieldGraph` over the 27 operators.
    "field",
    # The neutral appearance artifact those graphs bind into, and the digest
    # station 4 proves a retune cannot move.
    "surface",
    # `FbmConfig`/`Frequency` — the knob set `FieldOp::Fbm`'s parameter words
    # carry, which `FieldBuilder::push_fbm` takes by value.
    "noise",
    # `BackendCapabilityProfile`/`RenderCapability` (station 9's two profiles),
    # `FramePacket`/`FrameDrawItem` (the one artifact that carries a draw's
    # surface_program across the presentation boundary), and the host
    # presentation request a backend is sized from.
    "host",
    # `PreparationTask` — the startup barrier station 2's program compilation
    # runs on — and the `RuntimeError` a failed barrier reports.
    "runtime",
    # `implicit_surface_mesh` / `ScalarField` — station 7's metaball body.
    "mesh-ops",
    # The neutral triangle mesh that marcher returns.
    "mesh",
    # `TextureOp::Field` — station 3's bake of station 2's graph.
    "proc-texture",
    # The container that one-node bake recipe is written in.
    "recipe",
]

allowed_modules = [
    # The engine umbrella: App/RunningApp, the camera, the meshes, and the
    # `Material::from_surface` that carries a surface's digest onto a draw.
    "engine",
    # `GpuBackendApi::prepare_surfaces` — the preparation barrier, and the only
    # place this app compiles a shader.
    "gpu-backend",
    # `Canvas2dBackendApi::render_offscreen_rgba_with_surfaces` — the one public
    # native path in the engine that renders an authored surface to pixels.
    "canvas2d-backend",
]
