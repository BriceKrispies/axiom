<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Axiom — The Shader Crucible</title>
  <style>
    html, body { margin: 0; background: #070810; color: #e6ecf7;
                 font-family: ui-monospace, Menlo, Consolas, monospace; }
    main { display: flex; flex-direction: column; align-items: center;
           gap: 14px; padding: 16px; }
    h1 { margin: 0; font-size: 18px; letter-spacing: .30em; font-weight: 800;
         color: #7fd4ff; }
    /* `touch-action: none` hands the orbit camera raw pointer streams: without
       it the compositor claims a drag as a scroll or a pinch as a page zoom
       before the listener ever sees it. `src/pointer_input.rs` sets the same
       property in code — see its module docs for why both, and why
       `preventDefault()` on top of them. */
    canvas { width: min(96vw, 1280px); aspect-ratio: 2 / 1; background: #070810;
             border: 1px solid #1a2333; border-radius: 3px; touch-action: none;
             box-shadow: 0 18px 60px rgba(0,0,0,.7); }
  </style>
</head>
<body>
<main>
  <h1>THE SHADER CRUCIBLE</h1>
  <canvas id="shader-crucible-canvas"></canvas>
</main>
<script type="module">
  import init, { shader_crucible_start } from "./pkg/axiom_shader_crucible.js";
  await init();
  shader_crucible_start();
</script>
</body>
</html>
