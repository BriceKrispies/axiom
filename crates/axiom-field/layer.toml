# Axiom layer manifest — axiom-field.
#
# The typed pointwise field IR. `recipe` owns a domain-free operator DAG whose
# operator codes are opaque; `field` assigns meaning to those codes through a
# closed 23-operator algebra and a const signature table, gives every value one
# of four types, type-checks the whole graph in one forward fold, and reduces it
# to a canonical form whose bytes are the same for any two graphs that compute
# the same thing. It is the engine's missing *function-as-a-value*, and it has
# nothing to do with rendering.
#
# Nothing is added to `introduced_capabilities` by validation, canonicalisation,
# evaluation or the rewrite operations: they are methods on the already-declared
# `FieldGraph`, not new public exports, and the checker validates capabilities
# against the crate's root exports. The report *shapes* those methods return —
# FieldDescription, FieldNodeDescription, FieldExplanation, FieldDiff — are new
# exports and are declared.
#
# NodeId, Param, Scalar and MAX_NODES are recipe's types, re-exported here and
# deliberately NOT listed as introduced: this layer publishes them, it does not
# invent them. They are on this layer's own public boundary (a node is named by a
# NodeId, FieldBuilder::push takes Vec<Param>, a FieldValue lane is a Scalar, and
# a rewrite is checked against MAX_NODES), so a consumer that could not name them
# could not call this layer — and before they were published here, every consumer
# had to declare `recipe` itself merely to spell a type `field` handed it. The
# rule: the layer that hands you a value is the layer you name it through.
#
# Why a LAYER and not a module: three engine layers (`mesh-ops`, `proc-texture`,
# `proc-mesh`) must be able to name a field, and a layer may never depend on a
# module. The `axiom-mesh` precedent verbatim.

[layer]
name = "field"
crate_name = "axiom-field"
depends_on = ["kernel", "math", "recipe", "noise"]

meaningful_dependency = """
Field adapts recipe's domain-free operator DAG (RecipeGraph, NodeId, Param, the
append-only acyclic-by-construction invariant, canonical little-endian bytes and
StableHash digest) into a typed pointwise expression language: it assigns meaning
to the opaque u16 operator code through a const signature table, fixes the four
types a value may carry, and states the evaluation contract those expressions are
read under. It builds math's Vec2/Vec3/Vec4 into the value union those
expressions carry and Mat4 into the coordinate-transform operator, whose four
column parameters are derived from the matrix itself. It builds kernel's
BinaryWriter/BinaryReader and SchemaVersion into the field's own canonical byte
layout, StableHash into the structural digest and the deterministic minting of
parameter-slot and graph identity from a name, and Seconds into the evaluation
context's time input. It builds noise's FbmConfig into the Fbm operator's
signature row, whose knob arity is derived from the config type so the operator
and the noise layer it will be evaluated against can never drift. Recipe owns the
container and proves it acyclic; this layer adds the type lattice, the operator
algebra, the evaluation contract and the canonical form that make the container a
language. Because recipe already proves every input names a strictly-earlier
node, this layer's type checker is a single forward fold rather than a graph
walk, and its dead-node pass is a single reverse fold — both are direct
consequences of the container's invariant, not reimplementations of it. The
evaluator is the third such consequence: a flat fold over a MAX_NODES-sized
register file, in which noise's value_noise and Fbm are what the Noise and Fbm
operators mean, math's Mat4 is what Transform means and its Epsilon is the floor
below which a Normalize falls back to +Y, and kernel's Seconds is what Time
reads.
"""

introduced_capabilities = [
    "FieldGraph",
    "FieldBuilder",
    "FieldId",
    "FieldType",
    "FieldValue",
    "FieldOp",
    "FIELD_OP_COUNT",
    "FieldSignature",
    "SignatureKind",
    "FieldParams",
    "FieldParamSlot",
    "EvalContext",
    "FieldError",
    "FieldErrorCode",
    "FieldResult",
    "FIELD_SCHEMA_VERSION",
    "FieldDescription",
    "FieldNodeDescription",
    "FieldExplanation",
    "FieldDiff",
    "FIELD_DESCRIPTION_SCHEMA_VERSION",
]

consumed_capabilities = [
    "RecipeGraph",
    "NodeId",
    "RecipeId",
    "Param",
    "Scalar",
    "RecipeError",
    "Vec2",
    "Vec3",
    "Vec4",
    "Mat4",
    "FbmConfig",
    "value_noise",
    "Fbm",
    "Frequency",
    "Lacunarity",
    "Epsilon",
    "MAX_NODES",
    "StableHash",
    "BinaryWriter",
    "BinaryReader",
    "SchemaVersion",
    "Seconds",
]

# Proof the dependencies are genuine. FieldGraph wraps a RecipeGraph, names the
# output NodeId recipe has no notion of, and digests its structural bytes with
# StableHash. FieldValue is the four-lane union math's vectors enter and leave
# through. EvalContext carries a math Vec3 point and a kernel Seconds time.
# FieldSignature derives Transform's arity from the Mat4/Vec4 column count.
# FieldBuilder writes an Fbm node's knob words straight out of an FbmConfig,
# which is what pins that operator's arity to the noise layer's own knob set.
#
# The agentic half deepens the same dependencies rather than adding any:
# FieldDescription is a schema-stamped record of recipe NodeIds written through
# the kernel's BinaryWriter and labelled with a StableHash, and the three rewrites
# splice recipe RecipeGraphs together against recipe's own MAX_NODES budget.
#
# The evaluator deepens all four dependencies rather than adding any: it samples
# noise's value_noise and Fbm, applies math's Mat4 and reads its Epsilon floor,
# folds over recipe's MAX_NODES-bounded id-ordered nodes, and reads the kernel
# Seconds the context carries.

[[proof_exports]]
export = "FieldGraph"
must_reference = ["RecipeGraph", "NodeId", "StableHash"]

[[proof_exports]]
export = "FieldValue"
must_reference = ["Vec2", "Vec3", "Vec4"]

[[proof_exports]]
export = "EvalContext"
must_reference = ["Vec3", "Seconds"]

[[proof_exports]]
export = "FieldSignature"
must_reference = ["Mat4", "Vec4"]

[[proof_exports]]
export = "FieldBuilder"
must_reference = ["RecipeGraph", "Param", "RecipeId", "FbmConfig"]

[[proof_exports]]
export = "FieldDescription"
must_reference = ["NodeId", "StableHash", "BinaryWriter", "SchemaVersion"]
