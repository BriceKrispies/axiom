[layer]
name = "math"
crate_name = "axiom-math"
depends_on = ["kernel", "runtime"]
meaningful_dependency = "Math consumes kernel primitives (`KernelApi` for binary serialization, `KernelResult`/`KernelError` for wrapped deserialization failures) and runtime substrate (`RuntimeContext`, `TelemetryMetric`) to provide deterministic-scalar, vector, quaternion, 4x4-matrix, transform, and geometry primitives — with checked failures, approximate-equality, binary round-trip, and the closest-point / cast / swept-contact solves over them — that every later rendering / scene / physics / animation / culling layer will build on."

introduced_capabilities = [
    "MathApi",
    "Curve",
    "CurveKind",
    "CurveSample",
    "Segment",
    "Capsule",
    "Triangle",
    "Obb",
    "Hit",
    # The double-precision vector family. `f32` remains the engine's
    # *interchange* scalar — what crosses a facade, fills a vertex buffer and
    # stores a transform — but some domains must be *evaluated* at more than
    # that, and doing them in `f32` introduces disagreements the reference does
    # not have (measured: `axiom_surface::srgb_to_linear` is 0/256 mismatches
    # computed in f64 and narrowed once, 175/256 transcribed natively in f32).
    # `DVec3` gives that rule a vocabulary — a collision kernel over a
    # city-scale world, an atmosphere LUT, a bake-time noise oracle a shader is
    # pinned against — instead of leaving each caller to pass loose `f64`
    # triples. It is not a second engine scalar; `DVec3::to_single` is the one
    # named narrowing point back to `Vec3`. See `src/scalar.rs`.
    "DVec3",
]

consumed_capabilities = [
    "KernelApi",
    "KernelResult",
    "KernelError",
    "RuntimeContext",
    "TelemetryMetric",
    "Tick",
]

[[proof_exports]]
export = "MathApi"
must_reference = ["KernelApi", "RuntimeContext", "TelemetryMetric"]
