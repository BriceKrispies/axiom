[package]
name = "axiom-proc-validate"
description = "Axiom layer: constraints, scoring, validation, and bounded repair over a generation's neutral output words. ProcValidateApi validates a word list against generic, domain-free Constraints (min count / max value / non-zero), producing a deterministic ValidationReport (per-constraint verdict + score). repair() applies a single bounded pass of word-level fixes and returns a re-validatable word list. It names no generation container - the recipe stack is generic over its output type - so domain rules ('rivers reach the sea') stay a terrain module's job and the kernel is the only dependency. depends_on = kernel."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axiom-kernel = { path = "../axiom-kernel" }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
