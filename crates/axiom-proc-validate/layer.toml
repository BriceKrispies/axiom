[layer]
name = "proc-validate"
crate_name = "axiom-proc-validate"
depends_on = ["kernel"]

meaningful_dependency = """
Proc-validate adapts the kernel's serialization + digest into deterministic
validation and bounded repair of a generation's neutral output words.
ProcValidateApi evaluates generic Constraints (min-count / max-value / non-zero)
branchlessly into a ValidationReport whose canonical bytes (BinaryWriter) carry a
StableHash digest, and repairs a failing word list by a single bounded pass of
word-level fixes. It owns no domain rules, never loops to a fixpoint, and - since
the recipe stack is generic over its output type and owns no artifact container -
names no generation type at all, so the kernel is its only genuine dependency.
"""

introduced_capabilities = ["ProcValidateApi", "ValidationReport", "Constraint", "sample_until_valid"]
consumed_capabilities = ["StableHash", "BinaryWriter"]

[[proof_exports]]
export = "ValidationReport"
must_reference = ["StableHash", "BinaryWriter"]
