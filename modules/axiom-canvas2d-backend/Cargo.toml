[package]
name = "axiom-canvas2d-backend"
description = "Axiom engine module: the software, last-resort Canvas 2D presentation backend. A pure, native-testable rasterizer turns a backend-neutral host::FramePacket into 2D draw ops; the thin wasm32 arm interprets them against a CanvasRenderingContext2d. Same shared frame structure as the GPU backend, degraded but recognizable."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
axiom-host = { path = "../../crates/axiom-host" }
axiom-math = { path = "../../crates/axiom-math" }

# The engine's neutral appearance artifact and the expression language under it.
# `surface_shading` evaluates a Surface's channel FieldGraphs on the CPU, once
# per triangle, through an axiom_field::EvalContext.
axiom-surface = { path = "../../crates/axiom-surface" }
axiom-field = { path = "../../crates/axiom-field" }

# `Seconds` — the presentation time an EvalContext carries, and the reason no
# naked f32 crosses this backend's surface boundary.
axiom-kernel = { path = "../../crates/axiom-kernel" }

[dev-dependencies]
# Test-only: `Scalar` and `Param`, the quantity and the raw parameter word a
# hand-built FieldGraph is authored from.
axiom-recipe = { path = "../../crates/axiom-recipe" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "CanvasRenderingContext2d",
    "ImageData",
    "Window",
    "Location",
    "Performance",
    "console",
] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
