# Consumes the same backend-neutral axiom_host::FramePacket as the GPU backend,
# so a game authored/tested against the normal render path stays recognizable
# when the backend is Canvas 2D.

[module]
name = "canvas2d-backend"
crate_name = "axiom-canvas2d-backend"
kind = "engine-module"

allowed_layers = [
    "host",
    "math",
    # surface_shading CPU-evaluates an authored Surface's channel FieldGraphs
    # once per triangle, through an EvalContext carrying a kernel Seconds. This
    # backend runs no shader, so the reference evaluator IS its shading path —
    # all three are named directly in non-test code.
    "surface",
    "field",
    "kernel",
]

allowed_modules = []

introduced_capabilities = [
    "canvas2d-fallback-presentation",
    "cpu-surface-evaluation",
]
