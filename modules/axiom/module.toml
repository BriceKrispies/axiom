# Axiom module manifest — `axiom` (the engine umbrella).
#
# The one crate an app imports (`use axiom::prelude::*;`); composes the engine
# modules into the App/DefaultPlugins/Assets/SceneCommands surface so apps stop
# hand-wiring boundaries. Its single public facade is `pub mod prelude;`.

[module]
name = "engine"
crate_name = "axiom"
kind = "feature-module"

allowed_layers = [
    "kernel",
    "runtime",
    "math",
    "host",
    "frame",
    "ecs",
    # `Material::from_surface` names the neutral appearance artifact and reduces
    # it to its content digest here, once, at the app-facing authoring boundary.
    "surface",
]

allowed_modules = [
    "scene",
    "resources",
    "render-pipeline",
    "webgpu",
    "windowing",
    # The preparation barrier for authored surfaces. This umbrella owns the
    # runtime's preparation schedule, so it is the only tier that can compile a
    # surface's program *before* `RuntimeState::Prepared`; windowing's loop does
    # not exist until long after that phase has completed.
    "gpu-backend",
]

introduced_capabilities = [
    "engine-prelude",
    "app-frontend",
]
