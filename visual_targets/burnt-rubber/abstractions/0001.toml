# TRUE, and for two independent reasons, both invisible from the app tier:
#
# 1. The live browser arm DISCARDED the frame's authored render look.
#    `axiom-windowing`'s `run_web*` entries hardcoded
#    `FrameAmbient::default_hemisphere()` at bind, so burnt-rubber's authored
#    night ambient ([0.15,0.18,0.26]/[0.10,0.11,0.13]) never reached the
#    binder and the live race rendered under the engine's default daylight
#    hemisphere. No value an app can set fixes a value the binder never reads.
#
# 2. The two backends disagreed about atmosphere. The Canvas 2D raster has
#    always run a depth-fog post-pass; the GPU scene renderer had none. The
#    same scene therefore had a soft horizon on Canvas 2D and a hard,
#    un-attenuated one on WebGPU/WebGL2 — a backend divergence, not an art
#    choice, and not expressible as app data because there was no neutral
#    contract for either backend to read.
inexpressible = true

smallest_api = """
`axiom_host::FrameDepthFog` — one neutral value type (colour + normalized-depth
near/far + strength, all `Ratio`, no naked f32), carried as one `Option` field
on `FramePacket` exactly like the existing `FrameAmbient`. Absence is the
disable and `FrameDepthFog::none` is an exact no-op, so no existing frame
changes. Consumed by: the GPU backend (packed into the lights UBO, mixed in the
mesh + SDF fragment stages) and the Canvas 2D backend (drives its existing
`FogCue` from the same numbers). Plus `WindowingApi::set_ambient` /
`set_depth_fog` so the live browser arm binds with the authored look instead of
a hardcoded default.

Full spine footprint (for the reviewer, not a claim of minimality by size):
  crates/axiom-host/src/frame_depth_fog.rs   (new, 126 lines, 2 tests)
  crates/axiom-host/src/frame_packet.rs      (one Option field + accessor)
  crates/axiom-host/src/lib.rs               (one re-export)
  modules/axiom-gpu-backend/*                (UBO pack + fragment mix)
  modules/axiom-canvas2d-backend/*           (FogCue driven from frame data)
  modules/axiom-windowing/*                  (render-look carried to bind)
  modules/axiom/*                            (App facade + prelude)

KNOWN NON-MINIMALITY, recorded rather than hidden: the commit message itself
states the live arm still captures the render look at BIND rather than reading
it per frame, and names "fold ambient + fog into one per-frame render-look
value on the packet route" as the real end state. That follow-on is owed; this
record exists partly so it is not forgotten.
"""

