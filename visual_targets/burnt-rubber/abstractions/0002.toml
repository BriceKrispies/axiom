# TRUE, and the app tier proved it before the spine change was made:
#
#   `Material::with_emissive` existed and was carried faithfully through
#   `axiom-render`'s `RenderMaterial` and `axiom-resources`' `MaterialData`,
#   then DROPPED at `RenderPipelineApi::submit`, which folded only `opacity`
#   into the per-draw colour. `axiom_host::FrameDrawItem` had exactly one
#   shading term, `color`, so neither backend ever saw an emissive at all
#   (`grep -r emissive modules/axiom-gpu-backend modules/axiom-canvas2d-backend`
#   returned nothing).
#
# The only expression available to an app was to crank a lamp's base colour
# white-hot. A base colour is a REFLECTANCE: the shader multiplies it by N.L,
# by the hemisphere ambient and by the shadow term, so under burnt-rubber's
# authored night ambient a full-red lamp lands as a dull pink slab and gets
# DARKER as the car turns away from the key. It also drags every lamp toward
# white, which is exactly why the reference's two saturated glowing strips
# rendered here as one flat orange panel. No value an app can set fixes a term
# the packet does not carry.
inexpressible = true

smallest_api = """
`FrameDrawItem::emissive: [f32; 3]` — one linear-RGB radiance term beside the
existing `color`, on the one contract both backends read a draw's shading terms
from. Additive by construction: `new` stays byte-identical and defaults to
`[0, 0, 0]`, and `with_emissive` is the only setter, so no existing call site
changes and no existing frame renders differently.

Spine footprint (for the reviewer, not a claim of minimality by size):
  crates/axiom-host/src/frame_packet.rs            (the new term + accessor)
  modules/axiom-render-pipeline/src/render_pipeline_api.rs
      (a retained `material_emissive` map beside `material_color`, reported
       per draw — deliberately NOT folded into colour the way opacity is:
       alpha is not light-modulated, radiance is)
  modules/axiom-gpu-backend/src/frame_packet_adapter.rs, scene_renderer.rs
      (instance layout 36 -> 40 floats: mvp | world | colour | emissive+pad;
       mesh shader adds it after every light term and before fog)
  modules/axiom-canvas2d-backend/src/frame_packet_raster.rs
      (added at the same point, after depth cues and before the fog post-pass,
       so the two backends agree)
  modules/axiom-windowing, modules/axiom                (carry-through)

KNOWN NON-MINIMALITY / KNOWN DIVERGENCE, recorded rather than hidden: the rigid
pipeline goes to 14 vertex attributes, inside the WebGL2 downlevel guarantee of
16. The SKINNED pipeline is already at 16, so it carries no emissive lane and
reads zero. The commit argues this is parity because Canvas 2D reaches the same
zero through the same absent field — that is true of the two backends, but it
is NOT parity between a rigid draw and a skinned draw, which now shade
differently for the same authored material. Repacking the skinned instance (its
`joint_base` vec4 has three free lanes) is named in the commit as a separate
change and is owed. A skinned emissive is silently black today.
"""

