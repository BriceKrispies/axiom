# TRUE, on three counts, and the first two are not art choices — they are
# undefined behaviour and a missing mip chain:
#
# 1. THE SHADER BUILT A TANGENT FRAME IT HAD NO USE FOR, AND IT WAS UNDEFINED.
#    `scene_renderer`'s fragment stage computed the Mikkelsen cotangent frame for
#    every fragment of every material, then neutralised it through a flat normal
#    map. Any quad whose four corners share a UV — every
#    `SurfaceBuilder::ground_quad` without explicit coordinates, so burnt-rubber's
#    paint, verge and rail meshes — has zero uv derivatives, so tangent and
#    bitangent are the zero vector. `inverseSqrt(0)` is `+inf`, `nmap.x` is `0.0`
#    with no normal map bound, `0 * inf` is NaN, and `normalize` of NaN is NaN:
#    the fragment's entire lighting result was undefined. The live browser arm
#    binds no normal maps at all, so EVERY surface in EVERY app took this path.
#    It failed per 2x2 pixel quad (`dpdx`/`dpdy` are quad-constant), so it
#    rasterized as a two-pixel weave rather than an obvious hole, and how it
#    resolved depended on the GPU's handling of `0 * inf` — invisible on this
#    desktop, a dense static crosshatch on the reporter's phone. No capture taken
#    for this campaign could reproduce it. An app cannot fix a shader's
#    degenerate arithmetic.
#
# 2. MATERIAL TEXTURES HAD NO MIP CHAIN AND WERE POINT-SAMPLED. Uploaded with
#    `mip_level_count: 1` and `Nearest` on every axis, so a receding surface
#    returned one arbitrary texel of the many a pixel covered — moiré when still,
#    crawl when moving. This one is directly this campaign's business: the
#    asphalt aggregate grain landed at ledger iteration 3 (9412025c) and then
#    re-tiled in world metres at iteration 4 (264a62c9), and both were sampling
#    into a chain that did not exist.
#
# 3. ANISOTROPY COULD NOT BE A GLOBAL. wgpu validates that an anisotropy clamp
#    above one requires linear magnification, which would smooth every magnified
#    texel in every app — the crunchy look several apps depend on. So the choice
#    has to be per material, and there was no per-material place to put it.
inexpressible = true

smallest_api = """
`axiom_host::MaterialTexture` — one named type replacing the anonymous
`(u64, u32, u32, Vec<u8>)` material tuple that was threading six signatures
across four modules, carrying alongside the pixels a `TextureSampling` choice
(`Nearest` default, `Anisotropic` opt-in). Plus `mip_chain`, which builds the
full chain on the CPU averaged in LINEAR light for sRGB albedo (a byte-space
average darkens every level) with alpha averaged as stored.

Magnification stays `Nearest` — that is where the crunchy look lives, and only
MINIFICATION was ever the defect. Only burnt-rubber's tarmac opts into
`Anisotropic`; trilinear alone would blur it laterally by the footprint ratio
and wash the surface to flat grey.

Spine footprint (for the reviewer, not a claim of minimality by size):
  crates/axiom-host/src/material_texture.rs   (new, 191 lines)
  crates/axiom-host/src/lib.rs                (one re-export)
  crates/axiom-host/tests/architecture.rs     (curated-export gate)
  modules/axiom-gpu-backend/*                 (mip upload + sampler choice)
  the shader's tangent frame: length floored so the reciprocal is always finite,
  and N `select`ed to the GEOMETRIC normal when no normal map is bound — taking
  the value, never trusting degenerate arithmetic to cancel itself.

CAPABILITY SHAPE: `Textures` and `NormalMapping` are already GPU-arm
capabilities the Canvas 2D guard arm drops by declaration, so this richness is
arm-scoped for free and the guard arm is not lowered to carry it.

KNOWN COST, recorded rather than hidden: the commit also landed
`apps/burnt-rubber/src/{agent,ghost,probe}.rs` and a large `axiom-agent` block
in the same push. The GHOST HUD line that arrived with it is, by this
campaign's own scorecard, an ARTIFACT — the reference has no counterpart for
it. A commit that fixes a render defect and adds an unrelated HUD element in one
push makes the campaign unable to attribute either.
"""

