# The ">= 3 failed bounded attempts" branch does not apply, and does not need
# to. It is the SAME wall 0003 recorded, one layer further in: 0003 gave the
# spine a grade the offscreen and Canvas 2D arms could apply, and the JUDGED arm
# — the live browser present — still could not receive one. Ledger iterations 4,
