failed_attempts = []

# TRUE, on two independent counts, and neither is an art choice:
#
# 1. THE JUDGED ARM PRESENTED UNGRADED. `FramePostProcess` travelled only on a
#    `FramePacket`, so the two arms that read their pixels back as bytes (the
#    Canvas 2D raster and the off-screen capture) ran `apply_frame_postprocess`
#    over a finished buffer, while a swap-chain frame — which never becomes
#    bytes — presented with no grade at all. `RunningApp::set_postprocess` had
#    documented itself as reaching "both the offscreen capture and the live
#    present arm" since it landed, and did not. That is a backend divergence
#    reachable only from the spine: no app-tier value fixes a path that does not
#    read it. It is also, precisely, why this campaign's judged arm and its
#    guarded arm had been diverging on every colour change for three passes.
#
# 2. THE CHAIN HAD NO SUBTRACT. Exposure is a multiply, so it SCALES a lifted
#    floor instead of removing it; the contrast S-curve pivots on 0.5, so on a
#    night frame whose every pixel sits below 0.2 any contrast > 1 drives the
#    whole image negative. A low-key frame's defect is never its highlights — it
#    is that the floor never reaches the bottom. There is no composition of
#    exposure/contrast/saturation/white-balance that expresses "remove 0.16 of
#    lift". The operator was absent from the algebra, not mis-tuned.
inexpressible = true

smallest_api = """
One field, one scalar, one forwarding method — no new type:

  `FrameRenderLook` gains the GRADE as its fifth part, beside the ambient, the
                    fog, the sky and the bloom. This is the minimality argument
                    0003 already paid for: the parts travel together through
                    every binder, so a fifth field costs no signature anywhere,
                    where a parallel channel would widen four signatures and a
                    dozen wasm32-only call sites the native gate never compiles.

  `FramePostProcess::black_point` — one `Ratio`, applied FIRST, as
                    `max(v - black, 0) / (1 - black)`. `black_point = 0` is the
                    exact identity, so `cinematic()` and every frame graded
                    before this commit are byte-identical. A new grade preset
                    would not have been smaller: it would have hidden the same
                    arithmetic behind a name and left the operator unavailable
                    to every other frame.

  `WindowingApi::set_render_look` forwarding for the grade — the existing
                    forwarding shape, not a new one.

Arm behaviour is DECLARED, not divergent: the live GPU arm folds the grade into
the fullscreen composite it already draws (encoding to sRGB first, so it is the
same arithmetic on the same numbers as the CPU stage, not the same formula in a
different space); the off-screen arm passes `None` and keeps its read-back loop.
One grade per frame, whichever arm applies it. The guarded Canvas 2D arm takes
the black point through the CPU stage it already ran — it darkened in parallel
and stayed legible, which is the guard rule met, and is NOT scored.

Spine footprint (for the reviewer, not a claim of minimality by size):
  crates/axiom-host/src/frame_postprocess.rs        (+167)
  crates/axiom-host/src/frame_render_look.rs        (+74)
  modules/axiom-gpu-backend/src/post_chain.rs       (+124)
  modules/axiom-gpu-backend/src/live_gpu_binding.rs (+55)
  modules/axiom-gpu-backend/src/offscreen.rs        (+5)
  modules/axiom-windowing/src/windowing_api.rs      (+25)
  modules/axiom/src/prelude.rs                      (+5)
"""

