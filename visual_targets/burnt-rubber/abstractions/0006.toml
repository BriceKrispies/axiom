# Why no config or data change could reach it — quoting the commit's own
# diagnosis, which the critic pass verified against the diff:
#
#   "HostDeviceProfile::render_size only ever scaled a surface DOWN, and
#    live_gpu_binding clamped the render target to <= the swapchain, so an
#    upward direction did not exist to ask for."
#
# The axis's defect is a sampling-rate defect: at one render sample per surface
# pixel, every near-vertical edge stair-steps in runs of 1/slope pixels, and
# this app's frame is almost entirely thin receding geometry — lane markings,
# kerb blocks, the post rows running to a vanishing point. No material, light,
# grade, camera or geometry change at the app tier can remove it, because none
# of them changes how many samples are taken. The engine had no anti-aliasing of
# any kind and no way for an app to ask for more samples. That is the textbook
# shape of the gate's second branch: the current implementation cannot express
# the needed change, so the structural fix is correct on the first attempt.

smallest_api = """
Three pieces, each at the lowest layer that could own it:

  crates/axiom-host  — `HostDeviceProfile::render_supersample() -> u32`, a
    per-tier table (Baseline 1, ExtendedLimits 2) folded into the existing
    `render_size` before the existing tier cap. One const fn on an enum that
    already existed, on a type that already owned the render-size decision. It
    adds no new type and no new field. Baseline is bit-for-bit unchanged, so
    every app on the mobile default is untouched by it.

  modules/axiom-windowing — `configure_surface_with_profile(w, h, profile)`;
    the existing `configure_surface(w, h)` delegates with Baseline. Deliberately
    an ARGUMENT rather than a setter, so a tier can never be silently ignored by
    a caller that forgot to set it — which is the smaller API in the sense that
    matters, not the one with fewer characters.

  modules/axiom-gpu-backend — no new surface at all: the <=-swapchain clamp
    becomes a real device-limit clamp (aspect preserved), the downlevel 2048
    texture floor is raised to what the adapter itself reports (capped 4096,
    never lowered), and the present blit's minification is always Linear so a 2x
    target resolves as an exact 2x2 box average instead of discarding three of
    four samples.

Smaller alternatives that were NOT available: a manifest/config knob (there is
no field to add it to that anything reads), an app-tier render-scale (the clamp
lived below the app and refused values above 1.0), or MSAA (the engine has no
multisample path at all, and adding one is strictly more surface than a scale
factor the pipeline already carried).
"""

