# CONCERN 1 — SPENT OFF THE ATTACKED AXIS
# ---------------------------------------------------------------------------
# The pass's attacked axis was `lighting_and_shadow`. This abstraction was spent
# on `atmosphere`, which was one of four axes tied at 0 going in. The board runs
# seven lenses in parallel by design and that is not itself a violation — but the
# gate exists so that the ONE structural allowance a pass gets is aimed at the
# flaw the rule chose. Recorded so a reader can see where it went.
#
# ---------------------------------------------------------------------------
# CONCERN 2 — THE PROOF, AND WHAT VERIFICATION ACTUALLY RETURNED
# ---------------------------------------------------------------------------
# The architect's proposal named its own falsifiable test: whether the field
# reads as discrete cumulus rather than as a wash was "the one thing GPU
# verification had to judge". Verification ran, on the judged arm, and answered
# WASH. Measured on the promoted champion: 19.3% of the sky band clips to white,
# and the zenith reads (234,255,232-255) against the reference's (0,102,207) —
# two channels pinned at 255, so the gradient the layer was meant to sit in
# front of is buried rather than revealed.
#
# The abstraction is therefore JUSTIFIED but its first tuning is UNPROVEN. The
# pass-1 scorecard scored `atmosphere` 0 -> 2 on the strength of the mechanism
# existing; this critic pass corrected it to 1 on the strength of what the
# mechanism produced. `CLOUD_COVERAGE = 0.55` was authored blind and is a
# one-constant retune, at the config rung of the ladder — no further abstraction
# is owed for it, and none should be reached for.
