inexpressible = true

# Why no config or data change could reach it, and why the fix belongs at exactly
# this layer and no higher:
#
#   `WindowingApi` only ever let a caller DECLARE a surface size, and hardcoded
#   its scale factor to 1.0. A page's canvas is laid out by CSS and filled with
#   device pixels at a ratio only the browser knows, so the declared pair is
#   neither the right size nor the right shape, and every camera resolved against
#   it compounds the error instead of cancelling it.
#
# The "nothing above it could have caught this" claim is not rhetoric — it is
# Module Law #9. Browser and platform APIs are legal only in the `host` layer and
# the `windowing` module (PLATFORM_FACING_LAYERS / PLATFORM_FACING_MODULES in
# crates/xtask/src/hygiene.rs). An app may not look at a canvas, so an app-tier
# value could not have carried the measurement even in principle, and a
# mechanically enforced law says so. That is the strongest inexpressibility
# argument any abstraction on this campaign has offered.
#
# Ruling: MISSING-RECORD, backfilled — not too-early, not ceremonial.

smallest_api = """
One module, three entry points, and the call sites that adopt them.

  modules/axiom-windowing — `configure_surface_with_scale(width, height, ratio)`
    takes the shape a real surface has: a logical box plus a device pixel ratio.
    `configure_surface_with_profile` is its profile-carrying sibling, and
    `surface_scale_factor()` REPORTS the ratio rather than asserting 1.0. The two
    older entry points become this one at ratio 1, so every existing app is
    bit-identical and no caller is forced to migrate. A non-finite or
    non-positive ratio is an error, not a silent fallback — the surface stays
    unconfigured and the caller is told, rather than the engine quietly
    rendering at a scale the platform never reported.

  `25d16abf` then types the ratio as the kernel's `Ratio` instead of a naked
    f32, which is the correct home for a dimensionless quantity many layers need
    (the same reasoning as Meters/Radians) and keeps the public surface from
    trafficking in bare floats.

Smaller was available and would have been wrong: a bare `set_device_pixel_ratio`
setter would have left the surface configurable in two independent, ordering-
sensitive steps, and a caller could have configured a size and then never
supplied a ratio — reproducing the original bug with an extra method. The
constructor takes both because a surface HAS both; that is why this API is the
right size rather than merely a small one.

Nothing above the module changed shape: `axiom_host::HostViewport` has modelled
logical size + scale factor since it existed. The windowing facade was simply
never offering what the host layer already knew how to hold, which is the
signature of a missing adapter rather than a missing concept.
"""

