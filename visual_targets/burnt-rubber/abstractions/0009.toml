axis = "color_palette"

# The ">= 3 failed bounded attempts" branch does not apply on the count, and the
# commit explains why it could not: the bounded attempts were not merely
# unsuccessful, they were arithmetically impossible past a known point. The app
# had been authoring its zenith stop as a slope hack for several passes — a
# colour chosen for where it lands at 54% blend rather than for what the sky
# overhead is — and that hack hit a hard wall: reaching the reference's
# top-of-frame green required a blend of 0.88, and the camera's 32-degree
# ceiling supplied 0.545, at which the required green is NEGATIVE. No value of
# either authored stop could have converged, because the wall was the gradient's
# SHAPE and the app could only author its two ends.
failed_attempts = []

inexpressible = true

# Why nothing at the app tier could reach it:
#
#   `FrameSky` ran its two stops over a fixed smoothstep of the raw
#   up-component, fixing the gradient's midpoint at 30 degrees of elevation.
#   That is a reasonable default for a camera that looks at the sky and wrong
#   for every camera that does not. A chase camera pinned near the horizon never
#   evaluates the upper half of its own sky, so the authored zenith is a colour
#   the frame never contains. An app may author the two stops; it may not author
#   the curve between them, and the curve was the defect.
#
# CAPABILITY SCOPING — CORRECT, AND CHECKED. The change rides the EXISTING `Sky`
# capability rather than introducing a new bit: the GPU arm evaluates it and the
# Canvas 2D profile drops the whole sky and reports that it did
# (`crates/axiom-host/src/frame_capability.rs`). The richness therefore lands on
# the judged arm and degrades on the guarded one BY DECLARATION, which is the
# disposition the brief asks for. The uniform layout is unchanged — the height
# rides in `horizon.w`, which was padding — so no backend contract widened.
#
# Ruling: MISSING-RECORD, backfilled — not too-early, not ceremonial.

smallest_api = """
One method on one existing layer type, plus the mirror that makes it real on the
judged arm.

  `FrameSky::with_haze_height(h)` names the up-component at which the dome
  stands halfway between its two stops. It is one scalar on a type that already
  owns both stops, so the concept lands where the concept is defined rather than
  being smuggled through an app-tier fudge of one of the colours.

  The reshaping curve is a rational bias, `up / (up + (1 - up))` generalised by
  the height, and NOT a power. Three consequences, all of which are why this is
  the right size rather than merely a small one: at the default 0.5 it collapses
  to `up` exactly, so every sky authored before the parameter existed evaluates
  to identical bits and the pre-existing exactness test passes untouched; both
  ends stay exact at every height, so a gradient cannot return almost-horizon
  colour at eye level and draw a seam along every outdoor horizon; and it is
  four arithmetic ops, so the WGSL mirror cannot drift the way `pow` against
  `exp2(log2(x))` can across backends.

Smaller was available and would have been wrong. A burnt-rubber-side remap of
the zenith stop is what the app was ALREADY doing, and its ceiling is the whole
reason this commit exists — it is the bounded attempt, and it is exhausted.
Larger was also available and was correctly declined: no new capability bit, no
new uniform slot, no second sky type.
"""

