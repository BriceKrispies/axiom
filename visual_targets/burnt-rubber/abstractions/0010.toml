# The gate opens on EITHER >= 3 failed bounded attempts on the axis OR genuine
# inexpressibility. This one takes the second branch, and cleanly.
inexpressible = true
failed_attempts = []

inexpressibility_argument = """
The pre-existing `FrameDepthFog` expressed distance haze as a NORMALISED DEPTH
WINDOW: a `near`/`far` pair in clip-depth units, with the ramp clamped flat
past `far`. Two consequences follow from the units alone, and neither is
reachable from an app.

First, clip depth is non-linear in metres, so a single pair cannot hold both a
near band and a far band apart: at the app's previous `far` = 0.9970 the ramp
saturated at 322 m, and every object from 322 m to the horizon received the
identical haze value. The reference's distance is layered — surf, sea,
sailboats, village, headland, mountain — and a flat far band collapses all of
them onto one plane no matter what colour it is graded.

Second, the window is expressed in the CAMERA's depth range, so its meaning
changes when the projection changes. An app cannot compensate: it does not own
the projection at the point it authors the look, and it cannot convert metres
to clip depth without duplicating the camera's arithmetic in app code — which
is the app re-deriving a layer's own transform, i.e. the shortcut the
No-Shortcuts rule bans.

The only app-tier route left was to keep hand-tuning the two clip-depth
scalars per camera, which is a slope hack whose ceiling is arithmetic rather
than a matter of effort. Expressing the ramp in METRES OF AIR (a per-metre
density plus a far distance) is the smallest change that removes both
consequences at once, and metres are the layer's own vocabulary — the kernel
already carries `Meters`.
"""

smallest_api_note = """
The API added is a per-metre density term and a far distance on the existing
`FrameDepthFog`, plus one capability bit. It did NOT add a new frame part, a
new uniform buffer, or a new pass. The capability bit is the right shape and
is correctly scoped: `RenderCapability::AerialPerspective` is evaluated on the
GPU arm and DROPPED BY DECLARATION on the Canvas 2D profile, which is exactly
the degradation contract in `crates/axiom-host/src/frame_capability.rs` and
exactly what the campaign's judged/guarded split asks for — richness that
lands on the judged arm and degrades on the guarded one by declaration, not by
a lens quietly authoring around the software rasterizer.

ONE RESERVATION, recorded rather than ruled on. The `canvas2d_backend_api.rs`
+51 lines mean the guarded arm gained code in the same commit. The campaign's
rule is "legibility, not parity" for that arm, and code that keeps it legible
under a new capability is legitimate; code that TUNES it would not be. This
pass has not rendered either arm, so the distinction cannot be checked here.
The next pass that captures the guard should confirm that nothing in this
commit is guarded-arm tuning dressed as degradation.
"""

ruling = "missing-record, backfilled"
gate_cleared = true
gate_cleared_on = "inexpressibility"
verified_on_judged_arm = false
