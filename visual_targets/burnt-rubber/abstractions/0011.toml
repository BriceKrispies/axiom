inexpressibility_argument = """
`FramePostProcess` has no public constructor. Its whole public surface is five
`const fn` getters (`exposure`, `white_balance`, `contrast`, `saturation`,
`black_point`) and three `const fn` PRESETS (`cinematic`, `sunlit`,
`low_key`) — verified by reading `crates/axiom-host/src/frame_postprocess.rs`
at this commit. An app therefore cannot author a grade at all; it can only
pick one of the presets the layer ships.

So the diagnosis the commit makes — that `cinematic` is authored to rescue a
warm-brown flat raster (red eased to 0.98, blue lifted to 1.06, saturation
pushed to 1.18 to put colour back) and that applying those two corrections to
a midday exterior drives an already-red-starved frame further down and an
already-dominant blue further up — is a defect an app genuinely cannot route
around. Its only options were to accept the wrong grade or to add a preset.
That is inexpressibility in the strict sense, and the gate opens.
"""

smallest_api_note = """
Given the shape of `FramePostProcess` today, a fourth preset IS the smallest
change: it adds one `const fn`, touches no other type, changes no existing
preset, and rides the existing post chain on both arms.

BUT THE SHAPE IS THE REAL FINDING, and this record exists partly to say so
where the next architect will read it. A grade type whose only entry points
are named presets forces every app that wants a look the engine did not
anticipate to add a preset TO THE ENGINE LAYER. That is the wrong direction of
dependency pressure: the layer accumulates one app's authored look per
campaign, named after that look, and the vocabulary drifts from "what a grade
IS" toward "what burnt-rubber needed in round 3". `sunlit()` is defensible
under the current shape and indefensible as a pattern. The structurally
correct fix is a constructor (or builder) on `FramePostProcess` so that a look
is authored where looks belong — in the app — and the presets stay as the two
or three genuinely general starting points. Flagged, not demanded: it is a
spine change and belongs to an architect pass with the four gates behind it,
not to a bookkeeping commit.

CAPABILITY SCOPING: correct by inheritance. The preset rides the existing post
chain, so the GPU arm evaluates it and the Canvas 2D profile degrades it by
declaration. Nothing here was authored at the guarded arm.
"""

