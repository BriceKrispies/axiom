# Convergence campaign — burnt-rubber
#
# The machine-readable half of this campaign: which app, which renderer arm is
# JUDGED, which arms are only GUARDED, how to capture each of them, and the fixed
# axis order. The foreman (/visual-convergence-propose) reads this in Step 1
# instead of re-deriving the recipe from ledger prose.

[campaign]
slug = "burnt-rubber"
app = "burnt-rubber"
source_dir = "apps/burnt-rubber/"
substrate = "Rust"                    # Rust wasm cdylib on axiom-windowing
reference_era = "C"                   # bump when the user supplies a new reference
reference_supplied = 2026-08-06

# The moment both images must show: driving the COASTAL SWEEPERS section at
# ~155 km/h, mid-course, open road with scenery on both shoulders.
#
# Era C moved the moment as well as the look, and the two are not independent.
# The reference is captioned "COASTAL HIGHWAY" at 72% progress — but this course
# has no such section, and 72% lands the car inside CANYON RUN with rock walls
# on both sides, which is the one place on nine kilometres that cannot show what
# the reference is about. The reference is a concept frame, not a screenshot, so
# the campaign matches its PLACE (the game's own COASTAL SWEEPERS, open road,
# scenery both sides, ~21%) rather than its percentage. Matching the number
# instead would have compared a canyon to a beach and called the difference a
# lighting problem.
moment = "COASTAL SWEEPERS at ~155 km/h, open road, both shoulders in frame"

# The fixed axis order — the tie-break for "lowest axis", so its position in the
# file is load-bearing. It lives under [campaign] rather than at the end of the
# file because TOML binds a bare key to whichever table precedes it: sitting
# below [capture.guard], as it did from era B until 2026-08-06, it parsed as
# `capture.guard.axes` and any foreman that read this file mechanically would
# have found no axis order at all. It was never noticed because it was only ever
# read by eye.
axes = [
  "composition_and_framing",
  "subject_fidelity",
  "silhouette_readability",
  "material_and_texture_detail",
  "lighting_and_shadow",
  "color_palette",
  "contrast_and_exposure",
  "depth_and_separation",
  "atmosphere",
  "scale_and_proportion",
  "detail_density",
  "artifact_level",
]


# ---------------------------------------------------------------------------
# Renderer arms
# ---------------------------------------------------------------------------
# The engine drives every backend from ONE full-richness frame and lets each
# backend degrade what it cannot do (crates/axiom-host/src/frame_capability.rs).
# This campaign therefore judges exactly one arm and merely guards the other.

[arms]
# The arm the scorecard, the ledger and every lens are aimed at. On this machine
# WebGPU device creation fails (dxil.dll) and the cascade lands on WebGL2 — the
# same hardware arm the reference was shot on. `gpu` here means "whichever
# hardware backend the cascade binds", not specifically Dawn.
judged = "gpu"

# Captured every pass and shown to the human, but NOT scored and NOT a target.
# A lens must never spend its change making this arm better, and must never
# trade GPU-arm parity away to keep it identical. It may drift. It may not
# become illegible or error out — that is a regression the foreman reports.
guard = ["canvas2d"]
guard_rule = "legibility, not parity"

# ---------------------------------------------------------------------------
# Capture
# ---------------------------------------------------------------------------
# The reference is a phone screenshot, so the champion must be one too: a live
# browser at a phone viewport, not an axiom-shot native slice (different aspect,
# no DOM HUD).
#
# GOTCHA 1: AXIOM_PW_* are read when the controller LAUNCHES the browser. If a
#   daemon is already up from an earlier session it keeps its old viewport —
#   `playwright_controller.py stop` first, or you silently capture a desktop
#   frame at the wrong aspect.
# GOTCHA 2: since 2f5ad14b the app opens on a start screen. The race must be
#   started (Enter / Space / tap) or every frame is the title card.
# GOTCHA 3: era C's moment is mid-race, so it is PLACED with the probe rather
#   than waited for. Driving there would take ~40 s of real time and arrive
#   somewhere different every run — the traffic decides. The probe hooks are
#   `#[wasm_bindgen]` exports that index.html does not import, so the page has to
#   pull the already-initialised module in again to reach them:
#     import('./pkg/axiom_burnt_rubber.js').then(m => { window.__probe = m; })
#   ES module caching returns the same instance, so nothing is re-initialised.
# GOTCHA 4: FREEZE BEFORE YOU PLACE. See the ordering note below — this is the
#   one that silently cost the campaign its before/after comparability.

[capture]
serve = "uv run scripts/localhost_servers.py start-app burnt-rubber --port 8085"
viewport = "470x836"
dpr = 2
touch = true
start_race = "window.dispatchEvent(new KeyboardEvent('keydown',{code:'Enter',key:'Enter',bubbles:true}))"
settle_ms = 2500     # after goto, before starting the race

# FREEZE, then place, then step a FIXED COUNT. The order is the whole point.
#
# Until 2026-08-09 this recipe placed the car and only then froze it, with a
# 900 ms `place_settle_ms` in between. Those 900 ms were wall-clock: the car
# coasted for however many frames the machine happened to render, so the freeze
# landed wherever it landed. Two captures of the SAME BUILD, minutes apart,
# stopped at 2039.1 m / 148 km/h and 1969.0 m / 155 km/h — 70 metres apart, on a
# course whose geometry changes over that distance. Every before/after composite
# this campaign has produced therefore contained an unknown amount of "the road
# moved" mixed into "the lenses changed something", and no scorecard could tell
# the two apart. It was never noticed because the HUD's section name matched and
# nobody read the metres.
#
# Frozen first, `place_at` + `launch_at` are exact and `probe_step(30)` advances
# a fixed 30 fixed-steps of settle, so the moment is arithmetic rather than
# wall-clock. Verified: two consecutive runs return byte-identical state,
# distance 1922.346 m and speed 44.382 m/s. That number is now a property of
# the recipe, and a capture that reports anything else is a failed capture.
freeze = "window.__probe.burnt_rubber_probe_pause(true)"
freeze_settle_ms = 200
place = "window.__probe.burnt_rubber_probe_place(1900, 45)"
place_settle_ms = 200
# 90 steps, and the count is load-bearing for a second reason: GO_BANNER_STEPS
# is 60. Freezing straight after Enter leaves the race's full-screen "GO" banner
# alive, and the first version of this recipe stepped only 30 — so the capture
# came back with a 64 px word across the middle of a frame whose reference has
# no banner at all, which would have been scored as a composition and artifact
# defect that the game does not actually have at this moment. 90 outlives the
# banner with margin and still costs only 1.5 s of course.
step = "window.__probe.burnt_rubber_probe_step(90)"
step_settle_ms = 500

# The moment's fingerprint. `probe_state()` must return these to the millimetre
# before a capture is allowed to be scored or promoted. Verified identical over
# two consecutive runs.
expect_distance_m = 1966.118
expect_speed_ms = 43.157
expect_no_banner = true    # GO must have expired; see the step count above

[capture.judged]
url = "http://localhost:8085/"                  # no ?backend= — take what the cascade binds
expect_backend = "Gl"                           # console: "axiom: render backend = Gl"
out = "champion.png"

[capture.guard]
url = "http://localhost:8085/?backend=canvas2d"
expect_backend = "Canvas2d"
out = "canvas-guard.png"

