reason = """
Era-C pass 1 — the night-to-day conversion. Seven lenses ran; SIX stacked, one \
declined by the human. Attacked lighting_and_shadow 0 -> 2. No axis fell; seven \
rose. final_score 0.20 -> 1.175. \
