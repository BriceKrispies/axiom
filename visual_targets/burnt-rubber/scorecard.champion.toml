# Champion scorecard — burnt-rubber
#
# ============================================================================
# ERA C — RECALIBRATED against the RE-BASELINED champion (ffd4334e)
# ============================================================================
# This file previously described d054860b's image. That image is no longer on
# disk. `ffd4334e` ("champion: re-baseline burnt-rubber to main (72c847e0) at
# the era-C moment") replaced champion.png with a fresh capture of main after
# the course-authoring rework moved the road under the recipe's own placement,
# and said so in its own message: "The scorecard is NOT touched here: it still
# describes d054860b's image ... this pass's critic re-scores against this
# baseline rather than inheriting numbers measured on a different road."
#
# This is that re-score. Every number below is re-derived from the two PNGs on
# disk. Nothing is inherited. No score crosses an era boundary — both images are
# era C, same reference, same moment class (COASTAL SWEEPERS, placed + frozen).
#
# THE HEADLINE: nine of the twelve credits the pass-3 scorecard recorded DO NOT
# REPRODUCE on the image that is actually on disk. The frame moved, and it moved
# backwards on most of the statistics the pass-3 rises were argued from. Eight
# axes fall 2 -> 1. final_score 2.00 -> 1.10.
#
#   measured over the whole frame unless stated
#                             reference   pass-3 (claimed)   ON DISK NOW
#   whole-frame mean luma        114.4         118.6            115.6
#   scene-band median (.30-.72h) 139.7          96.4             78.4
#   whole-frame saturation       0.522         0.340            0.340
#   pixels above L=250           1.43%         0.27%            1.54%
#   sky median luma              124.1           --             170.5
#   ground median luma           114.9           --              69.1
#   road, four samples      (95,82,73)..    (132,97,93)     (68,69,74) flat,
#                           (236,211,152)                   b > r at every tap
#   horizon row (centre col)     0.384h          --            0.484h
#   low-sat bright sky ("cloud") 12.1%      "~19 vs ~18%"       2.2%
#   painted-body w/h        1.14 (1.13 at    1.79 claimed       2.10
#                            iteration 15)
#
# READ THAT ROAD ROW AGAIN. The pass-3 scorecard's material_and_texture_detail
# rise rested on "the road's hue is now nearly exact — (132,97,93) against the
# reference's (119,103,92), where pass 2 was blue-tilted at (113,105,122)". The
# road on disk samples (68,69,74) at seven taps from the bumper to the horizon:
# achromatic, BLUE-TILTED AGAIN (b exceeds r at every tap), and dead flat — no
# ramp at all where the reference runs a 140-level warm gradient from (95,82,73)
# in the foreground to (236,211,152) where the sun strikes it. Both halves of
# that axis's credit are gone.
#
# THE FRAME'S GLOBAL EXPOSURE IS RIGHT FOR THE WRONG REASON. Mean luma 115.6 vs
# 114.4 and clipping 1.54% vs 1.43% both look like convergence. They are two
# opposite errors cancelling: the sky is 46 levels too BRIGHT (170.5 vs 124.1)
# and the ground is 46 levels too DARK (69.1 vs 114.9). The reference is a deep
# cobalt sky over a sun-struck road; this frame is a hot pale sky over a dark
# one. A single-number match built out of an inverted tonal balance is not
# evidence for the axis and is not scored as such.
#
# final_score = lowest_axis * 0.7 + average_axis * 0.3
#             = 1 * 0.7 + (16/12) * 0.3 = 1.10   (was 2.00, on a different image)
#
# NEXT FLAW = composition_and_framing. Eight axes sit at 1, so the fixed axis
# order breaks an eight-way tie at its first entry. The campaign's declared
# next-attack axis is therefore UNCHANGED and CORRECT — but note it is now
# correct because that axis is genuinely at the floor, not because it won a
# twelve-way tie among equals at 2.
#
# WHAT IS NOT A FINDING. The guarded canvas2d arm is not scored, credited or
# blamed anywhere in this file or in the ledger; campaign.toml scopes it right
# ("legibility, not parity"). Parity language: clean — nothing in this campaign
# claims the render matches, is done, or has reached the reference, and nothing
# here is above 2.

[scores]
# 2 -> 1. The layout family still matches — car low-centre, road receding, HUD
# telemetry top-left, ring buttons bottom-right — but two structural divergences
# now sit under it, not one. (a) THE ROAD IS A RIGHT-HAND SWEEPER with a
# guardrail wall and its vanishing point off-centre; the reference is a dead
# straight avenue to a centred vanishing point, colonnaded symmetrically. The
# course rework moved this, not a lens. (b) the horizon sits at 0.484h against
# the reference's 0.384h, so a tenth of the frame's height moved from
# scenery-and-road into empty sky. (c) the HUD furniture the previous scorecard
# held this axis at 2 for is unchanged and still differs IN KIND: a mono ASCII
# `[####----]` track against a graphic progress rail with a car token riding it,
# grey rings against cyan/green, no gear numeral, and a BOOST row printed
# straight across both steering pads. Three divergences of kind is a 1.
composition_and_framing = 1

# 2 -> 1. The pass-3 rise was bought entirely with one measurement — painted-body
# width-to-height 2.94 -> 1.79 against a reference stated as 1.41. On the image
# on disk that ratio is 2.10, and this campaign's OWN iteration-15 recalibration
# put the reference at 1.13 (my own read: 1.14). So the gap is 1.84x, wider than
# the 1.27x the credit was written against. The car reads as an orange coupe with
# white stripes seen from behind and little more: no wheels in frame, no exhaust,
# axis-aligned box corners, and a tail cluster of salmon slats flanking a grey
# circular badge above a grey plate that reads as a FRONT GRILLE rather than as
# the reference's thin red lamp bars. The glazed rear aperture from 3456e56e is
# genuinely present and is the one sub-feature that survives; one sub-feature
# against a governing-ratio error of 1.84x is a 1.
subject_fidelity = 1

# 2 -> 1, on the same measurement and for the same reason it rose. An outline at
# 2.10 wide-to-tall against 1.14 is a slab, which is the exact word the pass-2
# critic used at 2.94 and the exact reason pass 3 claimed the axis back at 1.79.
# The cast shadow does still ground the silhouette — that part of the credit
# reproduces — but the shape it grounds is back near the aspect that held this
# axis at 1 for three passes.
silhouette_readability = 1

# 2 -> 1. BOTH reasons this axis rose are unreproducible on the image on disk.
# The hue: the road samples (68,69,74) at seven taps — achromatic and blue-tilted
# (b > r everywhere), i.e. the pass-2 defect the pass-3 note declared repaired,
# not the (132,97,93) it recorded. The grain: the road is flat to within a few
# levels across 400 px of foreground asphalt; no cross-road octave is legible at
# capture resolution. Nothing else in frame carries sand, foam, roof tile, bark
# or frond detail. This is not an accusation that the pass-3 measurement was
# false on ITS image — it is that this axis's evidence does not describe THIS
# image, and an axis is scored on the frame that exists.
material_and_texture_detail = 1

# 2 - HELD, and the only pass-3 headline that survives the re-baseline intact.
# The car does cast a shadow, it falls left of the car consistent with an
# upper-right key, and it grounds the subject. That is a real, checkable
# sub-feature and it is why this axis is not 1.
# It stays 2 and cannot go higher for a reason larger than the one recorded last
# pass: the reference's palm shadows raking the road are still absent, AND the
# road shows no light direction at all — seven taps from bumper to horizon return
# the same value, where the reference ramps 140 levels from shadowed foreground
# to sun-struck mid-distance. One blob shadow inside a scene with no readable key
# is the ceiling here, not the palms alone.
lighting_and_shadow = 2

# 2 - HELD, but on different evidence than last pass recorded, and the record
# should say so. Saturation is unchanged at 0.340 against the reference's 0.522.
# What is NOT still true is the supporting claim that the road hue is near-exact
# (see material_and_texture_detail: it is cool grey again). What holds the 2 is
# the colour FAMILIES: orange car, blue sky, green verge, grey road are all the
# right hue families, wrong in depth and saturation. The zenith reads (79,155,255)
# against the reference's cobalt (1,99,204) — the blue channel is clipped at 255
# and the red channel is 79 where the reference has ~1, which is exactly the
# cyan-not-cobalt cast the colorist attributed to cinematic()'s tint x 1.18 and
# declared unreachable from the palette. That diagnosis stands.
color_palette = 2

# 2 -> 1. The global numbers improved and the frame did not. Mean luma 115.6 vs
# 114.4 and clipping 1.54% vs 1.43% are both close — but they are the sum of a
# sky 46 levels too bright and a ground 46 levels too dark (see the header). The
# statistic this axis was actually scored on, the scene band median, went the
# WRONG WAY: 96.4 -> 78.4 against the reference's 139.7. The mid-tones are now 61
# levels low where the pass-3 note called 43 low insufficient for a 3. An axis
# cannot hold a 2 whose own headline number regressed by 18 levels.
contrast_and_exposure = 1

# 2 - HELD. Aerial haze is present and real, the palm colonnade recedes, the
# sweeper's guardrail carries the eye into depth, and the cast shadow separates
# the car from the road. Several correct sub-features, so not 1. Not 3: the
# reference layers near palms, beach, sea, sailboats, village, headland and sky,
# and four of those planes do not exist in this frame at all.
depth_and_separation = 2

# 2 -> 1. The pass-3 credit was "coverage 0.55 -> 0.32 ... for ~18% cloud against
# the reference's measured ~19%". On the image on disk, low-saturation bright sky
# pixels are 2.2% of the sky region against the reference's 12.1% — the sky is
# very nearly empty, carrying two faint wisps near the horizon. The reference's
# other defining atmospheric element, a blown sun with a lens flare in the upper
# right, is absent entirely; the champion has a soft pale patch low-left instead.
# Distance haze is present and is the single correct sub-feature, which is why
# this is 1 and not 0.
atmosphere = 1

# 2 - HELD. The width finding from iteration 15 reproduces on this image and is
# the reason: the champion's painted body spans 0.306 of frame width against the
# reference's ~0.30, so there is no size gap and the pulled-back rig costs this
# axis nothing. Lane width, palm height and guardrail scale all read plausibly
# against the road. What holds it at 2 is proportion, not size — the 2.10 body
# aspect against 1.14 (see subject_fidelity).
scale_and_proportion = 2

# 2 -> 1. Held at 2 for four passes on the strength of the palm avenue and the
# shrub band; the re-baseline's verges are flatter than the image that was scored
# — long stretches of unbroken flat green on both shoulders. Counted against the
# reference: no sea, no beach, no sailboats, no stilt houses, no parasols, no
# headland, no mountains, no roofs, no rocks, no surf, ~2% cloud instead of ~12%.
# What IS in frame is a palm line, a guardrail, a shrub tuft or two and some
# distant grey boxes. That is a small fraction of the reference's object count and
# it should have been a 1 earlier than this.
detail_density = 1

# 2 -> 1. Four defects, three of them in the HUD and all of them plainly visible:
# (a) the BOOST row prints straight across both steering pads; (b) the keyboard
# hint row runs through the same two pads AND is flush-clipped to x=0 with no
# margin, where the reference's hint rows are centred and clear; (c) the gear disc
# still reads "R" at 148 km/h — now the oldest unfixed item in this file at six
# passes, and a capture-recipe defect rather than a render one; (d) clipping is
# back to 1.54% from the 0.27% the axis was credited for, and a blown foreground
# lane dash cuts a hard white wedge across the BOOST ring. Three overlapping HUD
# defects plus a returned clip is not "largely gone".
artifact_level = 1
