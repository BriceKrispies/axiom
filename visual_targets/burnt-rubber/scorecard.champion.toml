# Champion scorecard — burnt-rubber
#
# ============================================================================
# ERA B, PASS 2 — scored 2026-08-05 against the render this pass produced
# ============================================================================
# Seven lenses, seven commits, all cherry-picked clean, one render. The attacked
# axis was subject_fidelity (the critic's pass-1 recalibration moved the target
# there from silhouette_readability) and it moved. Measured over the scene band
# (rows 0.30h..0.72h) unless stated, same method every pass:
#
#                        reference    pass 1     pass 2
#   band luma median         3.9        0.0        0.0
#   pixels below L=16       80.2%      83.7%      76.6%
#   sky                    (1,2,4)    (0,0,0)    (0,0,0)
#   road, left            (7,8,11)   (0,2,11)  (14,14,17)
#   verge                  (3,5,4)    (0,0,0)    (0,1,0)
#   lamp centroid row        0.651      0.609      0.641
#   lamp span               0.522w     0.312w     0.424w
#   lit-road mean|dx|         0.28       0.07       0.37
#
# THE PASS-1 OVERSHOOT IS FIXED, AND NOT BY THE ROUTE THIS SCORECARD PREDICTED.
# Pass 1 named low_key()'s 0.16 black point as the constant to retune. The
# lighting lens instead found the compounding term: the black point subtracts
# 41/255 in display space as a hard clip, and pass 1 had ALSO cut KEY_INTENSITY
# 0.85 -> 0.30, so tarmac rendered at byte 27 and the verge at 35 — both under
# the subtract, both clipped to zero. It predicted a byte-35 verge and measured
# 0.0. Raising the key to 0.88 puts the road above the clip: the ground plane is
# back at (14,14,17) against the reference's (7,8,11), where it was (0,2,11).
# The grade was not touched, so the two fixes did not compound — the lens said
# explicitly that they must not, and no other lens moved exposure this pass.
#
# WHAT COULD NOT BE MEASURED, AND IS THEREFORE NOT CREDITED. The architect's
# supersample (2x render target, linear resolve) is aimed at the stair-stepped
# edges. The edge-ramp probe reads 2.34 -> 4.11 ramp-pixels per bright pixel
# against the reference's 1.03 — but the road's luminance rose in the same pass,
# which widens that ramp whether or not sampling changed. The probe cannot
# separate the two, so artifact_level is HELD and the anti-aliasing is recorded
# as unverified, not as a win and not as a regression.
#
# final_score = lowest_axis * 0.7 + average_axis * 0.3
#             = 1 * 0.7 + (21/12) * 0.3 = 1.225   (was 1.125)
#
# NEXT FLAW = silhouette_readability. Three axes tie at 1 and campaign.toml's
# fixed order breaks it 3rd, ahead of atmosphere (9th) and artifact_level (12th).
#
# STANDING FINDING, NOT YET ACTED ON — THE JUDGED ARM IS ANAMORPHIC. Two lenses
# reached it independently. apps/burnt-rubber/src/web.rs boots the surface and
# the camera from the compile-time landscape 1280x720 while the live canvas is a
# portrait 470x836 @ DPR 2, so the camera aspect is baked at 1.778 against an
# actual 0.562 — and 0.562/1.778 = 0.316, which is the horizontal squash the
# art-director measured off the tail-light bar (0.72m x 0.13m world, aspect 5.5,
# rendering at aspect 1.8). The architect adds that WindowingApi::configure_surface
# hardcodes a 1.0 scale factor, so the host never learns the device pixel ratio
# either. The frame is composed and rasterized at an aspect and a density
# unrelated to the pixels it is shown on. It is NOT scored as a defect here for
# one reason: the reference carries the same squash in its world (its posts
# measure 0.155 against the champion's 0.154) and only its car was redrawn at
# true proportions, so un-squashing would diverge from the reference on the
# composition axis. That makes it a foreman/art-director decision about what the
# campaign is converging toward, not a silent engine correction.

[scores]
# 2 - HELD. The subject's placement converged hard this pass, but that is
# scale_and_proportion's half of the frame and is scored there. What holds this
# axis at 2 is what has held it since era B opened and what no lens has touched:
# the HUD. The champion still carries a `GHOST -832 m` line the reference has no
# counterpart for, and its BOOST bar is still drawn near the bottom over the touch
# pad instead of on line 2 under the speed where the reference puts it. Horizon,
# vanishing point and moon are unchanged and remain on-model.
composition_and_framing = 2

# 1 -> 2, the attacked axis. The tail now carries the reference's ARRANGEMENT:
# each lamp is a dark bezel holding two thin lens tubes rather than one filled
# block, with a centre badge in the gap between them. The modeler also found why
# the old lamps read square — braking inflated the whole fixture, so the captured
# frame showed a 0.72 x 0.30 near-square block; braking now swells the light
# inside a fixed bezel. That is structure, not a decal, which is why it moves.
# It stops at 2 and not 3 on things that are measured, not felt: the red lamp
# area is 33416 px against the reference's 7513 (4.4x), so the bars are far too
# thick for their length; the badge renders as a dark ellipse — a hole, where the
# reference has a lit chrome roundel; the decklid is still a bright red slab where
# the reference's car is black head to toe; and there are still no wheels and no
# glass anywhere on the model.
subject_fidelity = 2

# 1 - HELD, and still the campaign's target. The outline is a slab with hard
# corners. The pass made the car larger and better lit, which makes the flat
# corners MORE legible, not less, and the bright red decklid now cuts the
# silhouette in half across its widest point. The modeler and the architect agree
# on the ceiling and on the fix: the app's cube/plane/sphere/cylinder vocabulary
# cannot chamfer or loft, and the lowest correct owner of a real bevel is a new
# op on `crates/axiom-proc-mesh` with its own coverage — not a pile of app-side
# boxes approximating a curve.
silhouette_readability = 1

# 1 -> 2, on a measurement that only became possible this pass. Surfacing found
# the grain's weighting (`SMOOTH_SHARE = 0.75`) was bought to defend a
# `Repeat + Nearest, no-mipmap` sampler that no longer exists — the engine grew
# mip chains and per-material anisotropy, and palette.rs already opts the tarmac
# into `TextureSampling::Anisotropic` — so a stale premium was being paid as a
# visible cellular quilt. Moving the amplitude to texel scale, with total
# variation held constant by construction, plus the road actually being lit again,
# puts the lit-road neighbour step at 0.37 against the reference's 0.28, where
# pass 1 measured 0.07 and the axis could not be scored at all. Not 3: there is
# still no specular anywhere, and the reference's asphalt is wet-glossy with a
# long reflection down the lane.
material_and_texture_detail = 2

# 2 - HELD, and this is the pass's biggest single repair held at its old score,
# deliberately. The ground plane came back: road (0,2,11) -> (14,14,17) against
# the reference's (7,8,11), so the frame is no longer lane paint floating in a
# void. But the axis asks about the whole rig and half of it is still absent —
# the verge measures (0,1,0) against the reference's (3,5,4) and is still clipped
# to black, and nothing but the car interacts with light: the posts, the kerb
# blocks and the sign each sit in their own small pool in the reference and cast
# nothing here. A repair that restores what a previous pass broke is not the same
# as reaching the reference.
lighting_and_shadow = 2

# 2 - HELD. The colorist found the road's blue was a surface property, not a
# lighting choice — the tarmac albedo was authored blue a quarter above red — and
# rotated it to neutral-warm at matched luminance (0.0889 vs 0.0886, under one
# display level), so the change is a pure hue move. The road now reads neutral at
# (14,14,17) against the reference's (7,8,11): right hue family, ~1.7x too bright.
# Held at 2 because the car is still the wrong colour in kind (a red decklid
# against a black car) and the verge carries no hue at all, being clipped.
color_palette = 2

# 2 - HELD. The band is now 76.6% below L=16 against the reference's 80.2%, having
# been 83.7% — so the frame has crossed from below the reference to just above it
# and is closer in absolute terms than at any point in the campaign. It does not
# reach 3 because the deep floor is still clipped rather than dark: the band median
# is 0.0 against the reference's 3.9, and the reference's darks carry hue where the
# champion's carry none. Bracketing a target is not landing on it.
contrast_and_exposure = 2

# 2 - HELD. The far road still dissolves into black before the horizon and the car
# still separates from the tarmac by light rather than by hue, both correct. The
# receding post rows still alias into a dotted stipple toward the vanishing point,
# and the dissolve is still a harder fade than the reference's graded one.
depth_and_separation = 2

# 1 - HELD, and untouched for a third consecutive pass. The sky samples a literal
# (0,0,0) with no gradient and no hue, against the reference's live (1,2,4) that
# still carries a faint vertical falloff. The moon's halo remains larger and softer
# than the reference's tight one. This axis has now been named as next flaw once
# and attacked zero times across era B.
atmosphere = 1

# 1 -> 2, both halves measured for the first time. The art-director set the rig off
# the one ruler both frames share — the tail-light bar, whose world size is a source
# constant — and solved for the two disagreements at once. Span 0.312w -> 0.424w
# against the reference's 0.522w, and the lamp centroid row 0.609 -> 0.641 against
# the reference's 0.651, i.e. the subject now sits within 1% of frame height of where
# the reference puts it. Not 3 because the remaining width gap is not a camera fact:
# the reference's car spans ~55% of the road width and this one spans ~21%, so the
# rest belongs to CAR_WIDTH or the track's half_width.
scale_and_proportion = 2

# 1 -> 2. Detail is scored in the reference's own terms — on the car and the road —
# and both gained this pass. The car gained a centre badge, two lamp bezels and four
# lens tubes where it had two flat rectangles; the road gained an aggregate that is
# now measurably present rather than invisible (neighbour step 0.07 -> 0.37 against
# the reference's 0.28). Not 3: the plate still has no lettering, the badge no
# roundel detail, and the road no wet sheen picking out the lane paint.
detail_density = 2

# 1 - HELD, and held BECAUSE the pass's own instrument could not settle it. The
# architect's supersample is aimed squarely at this axis and may well have worked;
# the edge-ramp probe cannot say, because the road's luminance rose in the same pass
# and that widens the measured ramp on its own. Crediting an unverifiable improvement
# is the exact move this campaign's record keeps having to strike, so it is not
# credited. Two new artifacts are visible and are why this does not drop either: the
# badge reads as a dark hole rather than a lit roundel, and the lamp bars carry 4.4x
# the reference's red area. Re-score with a probe that isolates sampling from
# exposure — a matched-luminance edge crop, or a render at fixed lighting with the
# supersample toggled.
artifact_level = 1
