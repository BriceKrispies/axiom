# Champion scorecard — burnt-rubber
#
# ============================================================================
# ERA C, PASS 2 — scored 2026-08-06. THE ANAMORPHIC SQUASH IS GONE.
# ============================================================================
# Seven lenses, seven commits, all six app/spine proposals stacked clean plus
# the critic's bookkeeping. The pass's object was the projection, and it landed.
#
# VERIFIED AT THE SOURCE, NOT INFERRED FROM PIXELS:
#   canvas drawing buffer  940x1672   aspect 0.5622
#   canvas CSS box          470x836   aspect 0.5622   devicePixelRatio 2
# Identical to four decimals. Before this pass the buffer was declared at the
# compile-time 1280x720 (aspect 1.778) against that same 0.562 box — the 3.16x
# horizontal squeeze two lenses measured independently last pass. The fix landed
# in axiom-windowing because it is the only crate that can see a canvas, which is
# why nothing above it ever caught it.
#
# Measured over the scene band (rows 0.30h..0.72h) unless stated:
#
#                          reference    pass 1     pass 2
#   band luma median          139.7      178.3       99.1
#   whole-frame saturation    0.522      0.204      0.221
#   whole-frame mean luma     114.4      160.8      137.1
#   pixels above L=250         1.43%     11.01%      7.50%
#   sky, high             (27,111,198) (228,231,232) (227,231,232)
#   sky, at horizon      (145,219,239) (128,202,249) (157,218,241)
#   road, foreground        (64,57,55) (121,122,127)  (63,65,72)
#
# THREE THINGS THE NUMBERS SAY PLAINLY:
#
#  1. The road is right. (63,65,72) against the reference's (64,57,55), from
#     (121,122,127). Surfacing found specular was live and the gloss set had
#     never been re-sized for a key that tripled — peak specular is exactly
#     (1-roughness)*KEY_INTENSITY, so the tarmac was throwing 0.83 linear against
#     its own 0.08 diffuse. Lighting then solved the key against the reference's
#     measured tarmac rather than through a retired black point. Two lenses, two
#     halves of one error, and the surface landed.
#  2. The exposure overshot the other way. Band median 178.3 -> 99.1 against
#     139.7: it was 39 over, it is now 40 under. That is a symmetric miss, not a
#     convergence, and it is recorded as such.
#  3. The zenith did not move. (228,231,232) -> (227,231,232) against the
#     reference's (27,111,198). The colorist's bloom fix repaired the road streak
#     and the horizon band — (157,218,241) against (145,219,239) is close — but
#     the upper sky is unchanged, which confirms the colorist's own 15% caveat:
#     the milk up there is the CLOUD LAYER's coverage, not bloom.
#     CLOUD_COVERAGE = 0.55 is now the single named cause and a one-constant fix.
#
# final_score = lowest_axis * 0.7 + average_axis * 0.3
#             = 1 * 0.7 + (20/12) * 0.3 = 1.20   (was 0.375)
#
# A SCORING RISK THIS PASS, DECLARED RATHER THAN HIDDEN. The projection fix
# improves what three axes measure at once. The previous critic pass struck four
# axes for exactly that kind of double-credit, so the split here is deliberate:
# scale_and_proportion takes the rise (it is the fix's own axis),
# silhouette_readability takes a smaller one (the axis literally measures whether
# the outline reads, and for the first time it does), and subject_fidelity is
# HELD at 1 — the model did not change, and no wheels, no exhausts and a grey
# plate are still no wheels, no exhausts and a grey plate. If a critic folds
# silhouette back, that is a fair call and this note is the evidence for it.
#
# NEXT FLAW = subject_fidelity. Five axes tie at 1 and the fixed order breaks it
# 2nd. It is also the honest next target: the projection fix means the car's real
# shape is finally visible, so modelling work will no longer be spent twice.

[scores]
# 2 - HELD. Where things sit was already on-model and the projection fix did not
# move it: the horizon still sits at 0.474 of frame height against the reference's
# 0.464 (the architect solved the rig to hold the pitch precisely so it would not
# move). What holds this at 2 is the HUD, unchanged and unattacked for three
# passes: one monochrome mono font against the reference's gear disc, progress
# track with a car token, and coloured button rings.
composition_and_framing = 2

# 1 - HELD, deliberately, against the temptation to raise it. The car reads far
# better in this frame — but that is the projection fix, and it is scored at
# scale_and_proportion. The MODEL is byte-identical to last pass: still no
# wheels, no exhaust tips, a grey plate where the reference has warm yellow, and
# a flat rear panel where the reference has a moulded one. What HAS changed is
# that these are now visible and therefore finally worth attacking, which is why
# this axis is next.
subject_fidelity = 1

# 1 -> 2. This axis asks whether the outline reads, and for the first time it
# does: a low wide wedge instead of a rectangle. The art-director predicted this
# exactly — "a wedge squashed 3x in plan IS a rectangle" — so the silhouette work
# blocked behind the aspect fix is now unblocked. It is 2 and not 3 because the
# corners are still hard (no chamfer or loft in the mesh vocabulary) and the
# roofline does not yet taper into the deck the way the reference's does.
silhouette_readability = 2

# 2 - HELD. The road's VALUE is now nearly exact — (63,65,72) against (64,57,55)
# — which is the precondition for this axis rather than the axis itself. The
# grain surfacing tuned to 1.87% two passes ago should now be visible against a
# correctly-exposed tarmac, but that was not separately measured this pass and is
# not credited on assumption. Nothing in frame yet carries the reference's sand,
# foam, roof tile or frond detail.
material_and_texture_detail = 2

# 1 -> 2. The level half of this axis is now measured-correct: lighting inverted
# the pipeline against both frames and solved the key against the reference's own
# sunlit tarmac (byte 68.0 warm-median), landing the road within a level or two.
# It also overturned the foreman's earlier 2.6, which had been reconciled by
# arithmetic through a black point rather than against any render — a measurement
# beating a derivation, correctly.
#
# The SHADOW half remains 0, and this pass established why it is not a tuning
# problem: modules/axiom-render-pipeline/src/shadow_view.rs sets SHADOW_EXTENT =
# 20.0 as an orthographic box anchored at Vec3::ZERO, and this moment is ~1.9 km
# down a 9 km course. The module's own doc says it — "a 9 km course starting at
# the origin is shadowed for its first ~20 m". Every cast shadow in the judged
# frame is geometrically outside the shadow map, so the reference's defining
# feature — hard palm shadows raking the road — cannot appear at ANY key setting.
# That is a frame-contract change (a focus point or a fitted frustum) and it is
# the largest single known blocker left on this axis.
lighting_and_shadow = 2

# 1 - HELD. Saturation moved 0.204 -> 0.221 against the reference's 0.522, which
# is noise next to the gap. The hue families are right and the values are far
# closer than a pass ago, but the frame is still washed rather than saturated,
