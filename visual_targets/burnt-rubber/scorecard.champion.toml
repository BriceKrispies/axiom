# is `PadButton::Reset => "R"`, with line 749 stating "The reset button sits
# top-right". Nine passes of lenses were pointed at a fix that could not exist,
# and an axis was held down on it. Struck at `artifact_level`; the true fact
# underneath (the reference puts a gear numeral where this game puts a reset
# button) is HUD furniture differing in kind and is already charged once, at
