# Champion scorecard — burnt-rubber
#
# ============================================================================
# ERA C, PASS 3 — the frame casts shadows, and the sky is blue
# ============================================================================
# Seven lenses, seven commits, ZERO cherry-pick conflicts — the first clean
# stack of the campaign, despite two lenses in render/mod.rs and two in
# tuning.rs. Every axis is now at 2 or above for the first time.
#
# Measured over the scene band (rows 0.30h..0.72h) unless stated:
#
#                          reference    pass 2     pass 3
#   band luma median          139.7       99.1       96.4
#   whole-frame mean luma     114.4      137.1      118.6
#   whole-frame saturation    0.522      0.221      0.340
#   pixels above L=250         1.43%      7.50%      0.27%
#   sky zenith            (27,111,198) (227,231,232) (96,158,232)
#   road, mid-distance     (119,103,92) (113,105,122) (132,97,93)
#   road, foreground        (64,57,55)  (63,65,72)  (65,67,73)
#   painted body w/h            1.41       2.94       1.79
#
# FOUR LENSES FOUND THE SAME CLASS OF BUG, and it is worth naming because it
# is the campaign's most reusable lesson: a value that reads correct in the
# source and is destroyed downstream.
#   · CLOUD_COVERAGE 0.55 produced a threshold of 0.329 against a cloud field
#     whose own mean is 0.5 — so "just over half coverage" painted 82% of the
#     dome. The zenith gradient was already the reference's cobalt; a lid was
#     drawn over it. That is why it never moved when the bloom changed.
#   · The asphalt grain was authored isotropically and sampled by a 16x
#     anisotropic filter at grazing incidence — a directional low-pass ALONG
#     the road. 1.87% authored arrived as 0.49% near and 0.22% mid. The road
#     was being flat-filled by its own filter.
#   · The hemisphere ambient had a 0.067 span between ground and sky across the
#     whole normal sphere: a constant ambient wearing a hemisphere's name, so
#     nothing in frame could go dark.
#   · The shadow map was complete, correct and aimed at the world origin, 1.9 km
#     from the moment. scene_renderer.rs says outright that fragments outside the
#     frustum "are treated as lit", so it was not dimming shadows — it was
#     discarding every one of them.
#
# THE SHADOWS ARE THE HEADLINE. The car casts one for the first time in
# fourteen iterations. The reference's defining feature — palm shadows raking
# the road — is still NOT present, which is why lighting_and_shadow is 2 and not
# 3; see that axis.
#
# final_score = lowest_axis * 0.7 + average_axis * 0.3
#             = 2 * 0.7 + (24/12) * 0.3 = 2.00   (was 1.10)
#
# A CLAIM I DECLINED TO CREDIT. The art-director's proposal rested on "zero road
# paint below 60% of frame height in the champion, against 91% in the
# reference". My own detector finds lane paint reaching 0.95 of frame height in
# the PRE-change champion and 0.95 after — i.e. unchanged, and not matching the
# stated defect. The two detectors disagree and I could not reproduce theirs, so
# composition_and_framing is HELD at 2 and the depression change is recorded as
# landed-but-uncredited. It may well have improved the frame; this scorecard
# does not know that it did.
#
# NEXT FLAW = composition_and_framing. Every axis now sits at 2, so the fixed
# order breaks a twelve-way tie at the first entry. That is a real change in the
# campaign's character: there is no longer a single dominant defect, and the next
# pass is choosing among equals rather than repairing a hole.

[scores]
# 2 - HELD, and held against a rise I could not verify. The art-director attacked
# this axis on a paint-reach measurement my own detector does not reproduce (see
# the header). What is unchanged and still holds it at 2 is the HUD: one
# monochrome mono font against the reference's gear disc, its progress track with
# a car token riding it, and its cyan/green button rings. Four passes, unattacked.
composition_and_framing = 2

# 1 -> 2, and measured rather than eyeballed: the painted body's width-to-height
# goes 2.94 -> 1.79 against the reference's 1.41. The cause is a construction fix,
# not detailing — the cabin was spawned with the GLASS material, so the car's
# entire top surface was one navy pane flank-to-flank, and BACKLIGHT_RAKE 0.21
# with a 1.09 m screen ran the glass back to z=-1.60 against a decklid lip at
# -1.56, leaving literally zero deck. The rear screen is now a glazed aperture in
# painted bodywork with sail panels either side and the stripes on a real deck.
# Not 3: no wheels, no exhaust tips, a grey plate where the reference has warm
# yellow, and the hard axis-aligned corners the mesh vocabulary cannot chamfer.
subject_fidelity = 2

# 1 -> 2, on the same measurement and for the same reason. An outline at 1.79
# wide-to-tall against 1.41 is a car seen from behind; at 2.94 it was a slab. The
# cast shadow also grounds it — a silhouette that meets its own shadow reads as an
# object rather than a decal. Not 3 while the corners stay hard and the haunches
# stay unrolled, which the modeler recorded as needing a bevel/loft MeshOp rather
# than more app-tier boxes.
silhouette_readability = 2

# 1 -> 2. Two things landed. The road's hue is now nearly exact — (132,97,93)
# against the reference's (119,103,92), where pass 2 was blue-tilted at
# (113,105,122) — and the grain finally survives the filter that was eating it: a
# cross-road octave, constant along the course, so all sixteen anisotropic taps
# return the same value. Not 3 because the surviving amplitude sits mid-band
# (~1.77%) against the reference's 2.44%, and nothing yet carries its sand, foam,
# roof tile or frond detail.
material_and_texture_detail = 2

# 1 -> 2, THE HEADLINE, and deliberately not 3. The car casts a shadow for the
# first time in this campaign. The shadow map was never broken — it was anchored
# at Vec3::ZERO while the moment sits 1.9 km along the course, and the shader
# treats anything outside the frustum as lit, so every shadow was being discarded
# rather than dimmed. Anchoring the volume on the view fixes it without touching
# the frame contract, because the pipeline already resolves the camera. The
# hemisphere also became a real gradient (ground term to a quarter of the sky
# dome), so undersides darken ~3x and verticals ~29% — the flat-slab read is gone.
#
# It is 2 and not 3 because the reference's DEFINING feature is still absent: palm
# shadows raking across the road. The car's shadow is present; the avenue's is
# not. Whether the palms fall outside the 20 m box laterally or their shadows land
# off-road is unestablished, and the architect flagged SHADOW_EXTENT as the likely
# one-constant follow-up. Scored on what the image shows.
lighting_and_shadow = 2

# 1 -> 2. Saturation 0.221 -> 0.340 against the reference's 0.522 — a 54% move on
# the axis's own headline statistic. The zenith goes (227,231,232) -> (96,158,232)
# against (27,111,198): from white to blue, but a paler blue than the reference's
# cobalt. The colorist named the residual precisely and left it as out of its
# lane: cinematic()'s tint x saturation 1.18 clips the sky's blue channel at 255,
# so open sky reads cyan rather than cobalt, and no palette value can reach it.
color_palette = 2

# 1 -> 2. The blowout is gone: 7.50% of the frame above L=250 becomes 0.27%,
# against the reference's 1.43% — the frame now clips LESS than the reference
# does. Whole-frame mean luma lands at 118.6 against 114.4, close. It is not 3
# because the scene band's median is still 96.4 against 139.7: the mid-tones sit
# about 43 levels low even though the highlights and the overall level are right,
# which reads as a frame that is correctly exposed and insufficiently contrasty.
contrast_and_exposure = 2

# 2 - HELD. The palm colonnade, the shrub band and now real cast shadows all
# separate near from far, and the horizon haze is no longer a white wall. But the
# reference layers near palms, beach, sailboats, village, headland and sky, and
# four of those planes still do not exist in this frame at all.
depth_and_separation = 2

# 1 -> 2. The cloud lid came off: coverage 0.55 -> 0.32 puts the shader's
# threshold at 0.610, above the field's 0.5 mean, for ~18% cloud against the
# reference's measured ~19%. The sun's flare reads as a flare against sky rather
# than as a bright patch in milk. Not 3 while the blue stays pale (see
# color_palette) and the remaining puffs sit where a sinusoid lattice puts them
# rather than where cumulus would.
atmosphere = 2

# 2 - HELD, and one of its two reasons has now been retired. The width residual
# this axis was scored against does not exist: the reference car spans ~0.30 of
# frame width, not the 0.598 an earlier naive bbox returned by swallowing roofs,
# an umbrella and sand — and the champion is at 109% of that. So the human's
# decision to keep the pulled-back rig has cost this axis nothing. What remains is
# proportion, not size: the painted body is 1.79 wide-to-tall against 1.41.
scale_and_proportion = 2

# 2 - HELD. No new content this pass — the palms and shrubs are unchanged, and the
# absences are the same and still large: no sea, no beach, no sailboats, no stilt
# houses, no parasols, no headland. Those need a hillside; the verge is one flat
# quad out to 46 m, which the architect placed as app-tier terrain work rather
# than an engine capability.
detail_density = 2

# 1 -> 2. The frame's own artifacts are largely gone: clipping is down to 0.27%
# from 7.50%, the specular sheet and the blown streak are both absent, and the
# shadow gives the car a contact it never had. What holds it at 2: the HUD boost
# row still overprints the touch pad, and the gear disc still reads "R" at speed —
# a defect in the capture recipe rather than the render, and now the oldest
# unfixed item in this file at five passes.
artifact_level = 2
