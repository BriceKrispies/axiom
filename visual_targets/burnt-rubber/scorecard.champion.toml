# Champion scorecard — burnt-rubber
#
# ============================================================================
# PASS 1 OF ERA B — scored 2026-08-04 against the render this pass produced
# ============================================================================
# Seven lenses committed, all seven cherry-picked clean, one render. The
# attacked axis was contrast_and_exposure (0) and it moved. Measured over the
# scene band (rows 0.30h..0.72h), same method every pass:
#
#                        reference     before      after
#   band luma median         3.9        40.9        0.0
#   pixels below L=16       80.2%        2.4%      83.7%
#   sky                    (1,2,4)   (26,32,44)   (0,0,0)
#   road, left            (7,8,11)   (50,54,65)   (0,2,11)
#   shoulder               (3,5,4)   (47,56,55)   (0,0,0)
#   tail-light span         0.522w      0.220w     0.312w
#   bright-yellow area      0.98%       1.88%      0.94%
#
# THE OVERSHOOT, NAMED. The frame no longer sits above the reference — it now
# sits BELOW it, clipped. The reference's darks are dark but alive: sky (1,2,4),
# shoulder (3,5,4), a floor that still carries hue. The champion's are literal
# zero. Three commits pushed the same direction at once — the colorist dropped
# SKY ~13x, lighting cut ambient ~4x and the key 0.85->0.30, and the architect's
# low_key() black point subtracts 0.16 on top — and the architect said in its own
# proposal that 0.16 was derived from the OLD 0.18 floor and would over-crush a
# frame whose ambient had already come down. It did. That constant is the single
# number the next pass should move, and it is a retune, not a revert: the
# histogram SHAPE is now right (83.7% vs 80.2% below L=16) where it was 2.4%.
#
# What moved and is not in dispute: the post bloom that was 1.88% of the band
# against the reference's 0.98% is now 0.94% — that axis's added-atmosphere
# complaint is gone. The far road dissolves into black instead of into a hard
# aliased line. The car reads at 0.312w against 0.220w.
#
# final_score = lowest_axis * 0.7 + average_axis * 0.3
#             = 1 * 0.7 + (20/12) * 0.3 = 1.20   (was 0.275)
#
# NEXT FLAW = silhouette_readability. Four axes tie at 1 and campaign.toml's
# fixed order breaks it 3rd. The car is bigger and striped now, which makes the
# box-on-box outline MORE visible, not less — the art-director's own note that
# camera work has spent its envelope (the reference car is 55% of road width,
# this one 21%) points at the same place: the model, not the shot.

[scores]
# 2 - HELD, for the same reason as before the pass: the road framing was already
# on-model (centred vanishing point, moon within a few pixels of the reference's
# bbox) and what keeps it off 3 is the HUD, which no lens touched. The champion
# still carries a `GHOST -651 m` line the reference has no counterpart for, and its
# BOOST bar is still drawn near the bottom over the touch pad instead of on line 2
# under the speed. The chase rig moved (art-director, 1fa94054) but that is scored
# at scale_and_proportion; the frame it frames is unchanged.
composition_and_framing = 2

# 1 -> 2. The reference car's single most identifying feature is its twin centre
# stripes, and they are now there (modeler, ca3a8891): visible on the roof and on
# the raked backlight, plus a plate on the valance. That is the difference between
# "a car-shaped box" and "that car, crudely". It stops at 2 on three counts, all
# visible in the crop: the decklid is a bright red slab and is now the lightest
# thing on the car, where the reference's whole body is near-black; the plate
# renders silver-grey, not the reference's warm yellow, because one `trim` material
# serves both stripe and plate (the modeler flagged this in its own proposal as the
# colorist's follow-up); and the lamps are still two filled rectangles where the
# reference has two thin bars with a badge between them.
subject_fidelity = 2

# 1 - HELD, and it is now the campaign's target. The outline is still a rectangle
# with a smaller rectangle set on it: hard corners, no rolled haunch, no tucked
# valance. The pass made this MORE visible rather than less - the car is larger in
# frame and sits against a now-black surround, so the flat box reads harder than it
# did against a lifted navy wash. The modeler recorded the ceiling honestly: the
# mesh vocabulary (cube/plane/sphere/cylinder, no CSG, no subdiv) cannot chamfer or
# loft, so the corners stay hard at app tier. That is the next structural question,
# not a config one.
silhouette_readability = 1

# 1 - HELD, and the reason changed. The grain itself is fixed: surfacing (5e9eb60b)
# found the champion's tarmac was a periodic quilt at exactly TILE_METRES/LATTICE -
# an 18.75 cm cell reading as cobbles - and rescaled RES/LATTICE together so the
# texel lands near 1.2 cm with the interpolation slope, and therefore the alias
# budget, numerically unchanged. But at this exposure almost none of it is visible:
# the road is at or near zero across most of the frame, so the axis cannot be
# credited from this image. There is still no specular anywhere, and the reference's
# asphalt is wet-glossy with a long reflection down the lane. Re-score once the
# black point is retuned - this axis is currently hidden, not measured.
material_and_texture_detail = 1

# 1 -> 2. The structure is now the reference's: one pool of light around the car,
# and real falloff away from it. Before, the road read 50 at the frame's left edge
# and the "pool" was a 0.4-unit difference; now the edge is black and the lit road
# is confined to the car's surround. Lighting (1def5117) got there by cutting the
# two GLOBAL terms - ambient ~4x, key 0.85->0.30 - and leaving the car's local pool
# to carry the near road, which is the right diagnosis: the darks were lifted by
# lights, not by grade. Not 3 because nothing but the car interacts with light -
# the posts, kerb blocks and sign still cast nothing, where the reference's posts
# each sit in their own small pool.
lighting_and_shadow = 2

# 1 -> 2. Every value moved a long way toward the reference and one moved past it.
# Sky (26,32,44) -> (0,0,0) against the reference's (1,2,4). Road (50,54,65) ->
# (0,2,11) against (7,8,11) - genuinely close. Shoulder (47,56,55) -> (0,0,0)
# against (3,5,4). The lifted blue cast is gone. What holds it at 2 is that the
# convergence overshot into clipping: where the reference's darks still carry hue,
# the champion's are literal zero, so the palette is not wrong-but-close, it is
# absent across the bottom of the range. The car is also still red where the
# reference's is black.
color_palette = 2

# 0 -> 2, the attacked axis, and the largest single move the campaign has made.
# Before: median 40.9, 2.4% of the band below L=16, against a reference that is
# 80.2% below L=16 - a night scene with no blacks at all. After: 83.7% below L=16.
# The histogram SHAPE is now the reference's. It is not 3 because the frame
# overshot: median 0.0 against the reference's 3.9, and the floor is clipped rather
# than dark. Three commits pushed the same way in one pass (SKY down ~13x, ambient
# and key down, then low_key()'s 0.16 black point subtracted on top of both), and
# the architect predicted this exact interaction in its own proposal. The fix is to
# retune that one constant, not to revert any of the three.
contrast_and_exposure = 2

# 1 -> 2. The reference separates depth two ways and the champion now does both:
# the far road dissolves into black well before the horizon instead of converging
# to a hard aliased line, and the car separates from the tarmac by light - a lit
# pool behind it, dark under it - rather than by being a different colour. Not 3
# because the receding post rows still alias into a dotted stipple toward the
# vanishing point, and the dissolve is a hard fade rather than the reference's
# graded one.
depth_and_separation = 2

# 0 -> 2, measured rather than judged. The critic's 0 rested on three specifics: a
# navy sky at ~7x the reference, a green/teal haze band across the horizon, and a
# bloom halo on every post at 1.88% of band area against the reference's 0.98%. All
# three are gone: sky (0,0,0), no haze band, and the bright-yellow area is now
# 0.94% - within 0.04 points of the reference. Not 3 because the sky is now flat
# zero where the reference's is a live (1,2,4) with a faint gradient, and the moon's
# halo is larger and softer than the reference's.
atmosphere = 2

# 1 -> 2. The car spans 0.312 of frame width by its tail-light bar against 0.220
# before and the reference's 0.522. The art-director (1fa94054) got there by
# scaling the whole chase rig - eye 1.35 -> 1.10 m with the distances following -
# on the measurement that on-screen width divided by distance-below-horizon reduces
# to width/eye_height, so chase distance cancels and only eye height is a real
# lever. Worth carrying forward: it also measured that full parity is unreachable
# from the camera at all, because the reference car spans ~55% of the ROAD width and
# this one spans ~21%. The rest of this axis belongs to CAR_WIDTH or the track's
# half_width, not to the rig.
scale_and_proportion = 2

# 1 - HELD. The frame lost the conifers and the lit green shoulders, which is
# correct (the reference has neither), and the car gained stripes and a plate. But
# density is scored in the reference's own terms, and the reference spends its
# detail on the car and the road surface: a badge, plate lettering, lane paint
# picked out by a wet sheen, aggregate underfoot. The car has no badge and no
# lettering, and the new asphalt grain is invisible at this exposure. Nothing was
# added where this reference puts its detail.
detail_density = 1

# 1 - HELD, with the ledger of what moved each way. Gone: the disproportionate post
# bloom (1.88% -> 0.94%) and the paving-stone quilt in the tarmac. Arrived: a
# clipped black floor, which is itself an artifact - a night frame whose darks are
# all exactly zero has quantised away information the reference retains. Unchanged
# and now more visible against black: the lane markings stair-step in hard 4-8 px
# staircases (surfacing traced this to the absence of MSAA on the GPU arm and handed
# it to the architect rather than faking it app-side), and the car's decklid reads
