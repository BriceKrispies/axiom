# Champion scorecard — burnt-rubber
#
# ============================================================================
# REFERENCE ERA C — the reference was REPLACED on 2026-08-06
# ============================================================================
# The user supplied a new reference and said plainly that they understand it is
# sunny where the last two were night, and that this is what they want. So this
# is not a drift to be corrected — it is the target.
#
#   era A (b8010795, retired): stylized night straight, green conifers, lit
#     apartment blocks, a bright red car, a blue horizon glow.
#   era B (retired 2026-08-06, recoverable at 493dac58): near-black night, a
#     black muscle car with stripes on wet glossy asphalt, one pool of light.
#   era C (current): full daylight on a coastal highway. Deep blue sky with a
#     sun and lens flare top-right, cumulus banks, turquoise sea with sailboats
#     to the left, a sand beach, palms lining both shoulders casting hard
#     shadows ACROSS the road, stilt houses and green mountains to the right, a
#     scarlet wedge coupe with twin white stripes mid-road at 162 km/h.
#
# NOTHING CARRIES ACROSS AN ERA. Every score below is fresh. Era B's champion
# scored 1.225 and that number is now meaningless: it measured how close a night
# render was to a night reference. This scorecard measures how close the same
# night render is to a daylight one, and the answer is "not at all" — the
# final_score falls to 0.25 without a single thing about the app getting worse.
# A reader comparing 1.225 to 0.25 and concluding the render regressed would be
# reading two different exams.
#
# ============================================================================
# THE MOMENT ALSO MOVED, AND THAT IS A SEPARATE DECISION
# ============================================================================
# Eras A and B were both shot parked on the opening straight at ~0:09. This
# reference is mid-race: 162 km/h, gear 4, 72% progress, captioned "COASTAL
# HIGHWAY". The campaign follows it to a driving moment — but to the game's own
# COASTAL SWEEPERS section (~21%), not to 72%.
#
# 72% was tried first and rejected on evidence: it places the car inside CANYON
# RUN, walls on both sides, which is the one stretch of the nine kilometres that
# structurally cannot show a sea, a beach or a palm. The reference is a concept
# frame — its section name does not exist in this game — so matching its NUMBER
# would have scored a canyon against a beach and filed the difference under
# lighting. Matching its PLACE is the honest read of what it depicts.
#
# ============================================================================
# THE CHAMPION THIS SCORES
# ============================================================================
# A fresh capture of main (2026-08-06, c8d11623), placed with the browser probe
# at 1900 m / 45 m/s and then FROZEN, so the moment is repeatable rather than
# dependent on how fast the screenshot lands. Live browser, phone viewport
# 470x836 @ DPR 2, WebGL2 (WebGPU device creation fails on this machine), which
# is the judged arm. 940x1672, reading COASTAL SWEEPERS, 156 km/h, 21%.
#
# The reference is 941x1672 — within a pixel of the champion, so for once the
# two frames are directly comparable without normalising.
#
# ============================================================================
# MEASUREMENTS THIS SCORECARD RESTS ON
# ============================================================================
# Scene band = rows 0.30h..0.72h, both images, same method:
#
#                          reference        champion
#   band luma median          139.7             0.1
#   band luma 1st pct          23.2             0.0
#   pixels below L=16          0.5%           78.1%
#   sky, high              (27,111,198)     (19,19,20)
#   sky, at horizon       (145,219,239)      (0,1,0)
#   road, centre           (111,35,23)      (10,10,10)
#   left shoulder           (74,197,186)     (2,6,5)
#   whole-frame mean luma     114.4            23.3
#   whole-frame saturation    0.522           0.141
#
# The champion's scene band is 78% black against a reference that is 0.5% black.
# Its most common tone is one the reference essentially does not contain.
#
# final_score = lowest_axis * 0.7 + average_axis * 0.3
#             = 0 * 0.7 + (10/12) * 0.3 = 0.25
#
# NEXT FLAW = lighting_and_shadow. Four axes sit at 0 and campaign.toml's fixed
# order breaks the tie 5th, ahead of color_palette (6th), contrast_and_exposure
# (7th) and atmosphere (9th). That order is also the right order causally: the
# other three are all downstream of the frame being lit by a moon. Nothing about
# the palette, the exposure or the sky can be judged until there is a sun.

[scores]
# 2 — the one axis era C inherits in good shape, because it is about where things
# sit rather than what colour they are. Both frames are a chase camera behind a
# centred car on a road converging to a centred vanishing point, horizon near
# 0.46 of frame height, HUD block top-left, driving controls bottom-right. The
# HUD even carries the same *fields* — speed, section, progress, elapsed, near
# misses, ghost delta, a boost meter. What holds it at 2: the reference styles
# them (a gear disc top-right, a progress track with a car token riding it, cyan
# and green button rings, coloured near-miss text) where the champion is one
# monochrome mono font throughout, and the reference's boost meter is solid cyan
# blocks against the champion's ASCII hashes.
composition_and_framing = 2

# 1 — the reference's car is a scarlet wedge: a long tapering nose, a cabin set
# well back, twin white stripes running its whole length, thin red lamp bars, a
# black rear window and visible exhaust tips. The champion's is a box with a
# raised deck, grey stripes, four orange bars and a badge — and in a night frame
# it is barely lit at all, so most of what it does have is invisible here. The
# shape is not the reference's shape and the paint is not its paint.
subject_fidelity = 1

# 1 — the champion's outline is a rectangle with a smaller rectangle on top; the
# reference's is a wedge that tapers in plan and in profile. Daylight makes this
# worse to look at, not better: era B's darkness hid the flat corners that a lit
# frame will show in full.
silhouette_readability = 1

# 1 — the reference carries readable material everywhere: grain in the asphalt,
# sand, sea foam, individual palm fronds, roof tiles, painted stilts. The
# champion has one procedural asphalt grain — real, and measured earlier this
# campaign — and essentially nothing else, and at this exposure even that is
# invisible. Scored on what the image shows, not on what the code contains.
material_and_texture_detail = 1

# 0 — THE ATTACKED AXIS, and it is 0 rather than 1 because the frame is lit by
# the wrong celestial body. This is not a night scene that needs lifting; it is a
# night scene where the reference is noon. The reference has a hard directional
# sun high and to the right, throwing palm shadows clear across the road — the
# single most characteristic thing in the image — plus a bright sky fill that
# lights every surface facing up. The champion has a moon, one pool light riding
# the car, and no cast shadow from anything. Every other axis at 0 is downstream
# of this one: there is no correcting the palette, the exposure or the sky of a
# frame whose key light is in the wrong sky.
lighting_and_shadow = 0

# 0 — mean saturation 0.141 against 0.522, and the hue families do not merely
# differ, they are absent. The reference is built from saturated blues (sky
# (27,111,198), sea and horizon haze (145,219,239)), sand, palm green and a
# scarlet car. The champion's corresponding samples are (19,19,20), (0,1,0) and
# (10,10,10) — greys with a hint of hue at best. You cannot be the wrong shade of
# a colour you do not have.
color_palette = 0

# 0 — band median 139.7 against 0.1, and 0.5% of the reference's scene band below
# L=16 against the champion's 78.1%. The champion's most common tone is one the
# reference essentially does not contain. This is three stops and more, and it is
# the same finding as lighting_and_shadow seen through the histogram rather than
# through the light rig.
contrast_and_exposure = 0

# 1 — the reference layers depth explicitly: near palms, mid beach and boats,
# a village, mountains, then sky, each plane separated by aerial haze. The
# champion recedes to a vanishing point and dissolves into black, which is a real
# depth cue and the reason this is not 0 — but it is the only one, and darkness
# is doing the work that atmosphere does in the reference.
depth_and_separation = 1

# 0 — the reference's atmosphere is half the picture: cumulus banks, a lens
# flare, sun glare washing the horizon, haze thickening over the sea, light
# scattering through the palms. The champion has a black sky and a moon. There is
# no gradient, no cloud, no scattering and no flare to grade toward.
atmosphere = 0

# 2 — the car occupies a comparable share of frame in both, and the road's width
# at the bottom edge is close, so the rig's scale is roughly on-model. It does
# not reach 3 because the reference's road carries four visible lanes plus
# shoulders where the champion shows a narrower ribbon, and its palms establish a
# vertical scale the champion has nothing to answer with.
scale_and_proportion = 2

# 1 — the reference is dense and the density is the point: two rows of palms in
# perspective, a village of stilt houses, parasols, rocks, sailboats, breaking
# surf, mountain ridges. The champion has reflector posts, a few dark conifers
# and a sign. In the reference's own terms — scenery flanking an open road — this
# is sparse, and most of what is there is not visible at this exposure.
detail_density = 1

# 1 — the champion's aliasing (lane edges, kerb blocks, the receding post rows)
# is currently half-hidden by darkness and will be fully exposed by a daylight
# frame, which is worth stating before it looks like a regression later. The
# crushed floor that this era inherits from era B's grade is itself an artifact
# here: against a daylight reference it is not a look, it is clipping.
artifact_level = 1
