#
# THREE AXES CHANGE HERE, ALL BECAUSE THE IMAGE CHANGED UNDER THE SCORE:
#   lighting_and_shadow   1 -> 2   (the feature that caused the 1 came back)
#   color_palette         2 -> 1   (LOWERED: the road hue, measured above)
#   contrast_and_exposure 1 -> 2   (two headline statistics landed)
#
# A NOTE THE NEXT READER IS OWED, because two of those three go UP and a critic
# raising numbers should have to say why it is not inflation. `lighting_and_
# shadow` was 2 for six passes, was lowered to 1 one pass ago for exactly one
# reason — the palm shadows vanished — and that reason is measurably gone. To
# refuse the 2 back would be the same offence as inflating: scoring the record
# instead of the image. It is NOT reported as progress over round 2: it is the
# same feature going away and coming back, and any lens that quotes "1 -> 2"
# across those two passes as a gain is misreading this file. `contrast_and_
# exposure`'s 2 is likewise fragile and coupled: the exposure was hit BY the
# colour defect (a warm 3.2x key plus a warm grade), so the colour fix will
# cost some of it back. That coupling is the finding, not the score.
#
# final_score = lowest_axis * 0.7 + average_axis * 0.3
#             = 1 * 0.7 + (15/12) * 0.3 = 1.075
# The previous 1.05 was measured on a DIFFERENT IMAGE. The 0.025 is not a
# movement, is not progress, and must not be quoted as either.
