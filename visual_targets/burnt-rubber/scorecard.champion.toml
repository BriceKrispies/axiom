# A NINE-PASS PHANTOM DEFECT IS STRUCK. Every scorecard since era B has charged
# `artifact_level` with "the gear disc still reads 'R' at 155 km/h", named it
# the campaign's longest-standing unfixed item, and diagnosed it as a
# capture-recipe fault (the probe placing the car without engaging a forward
