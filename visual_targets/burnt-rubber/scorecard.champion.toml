scale_and_proportion = 1

# 1 - HELD. Round 2's modeler planted a second rank of palms, which is a real
# gain in count and does not move an axis scored against what the reference
# contains. Counted against it, still: no sea, no beach, no surf, no sailboats,
# no stilt houses, no parasols, no headland, no mountains, no village roofs, no
