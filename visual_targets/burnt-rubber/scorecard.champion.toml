# Champion scorecard — burnt-rubber
#
# ############################################################################
# THE PREVIOUS BANNER ON THIS FILE WAS FALSE BY THE TIME IT WAS READ.
# ############################################################################
# It opened "THIS FILE NOW DESCRIBES THE IMAGE ON DISK. The offset is
# discharged." That was true when `845e6beb` wrote it. It stopped being true
# one commit later: `7f33fca4` overwrote `champion.png` with the ROUND-2
# render (829,972 -> 840,496 bytes; md5 now 70f3fd2e...) and did not touch this
# file. From that commit until this one the campaign carried a scorecard whose
# first sentence asserted it described an image it did not describe.
#
# That is worse than the plain one-pass offset it replaced, and the reason is in
# `7f33fca4`'s own message: "the scorecard header it wrote already says so in
# its own words." The header said the OPPOSITE. A promote that believes the
# scorecard is disclosing an offset, and a scorecard that is declaring the
# offset discharged, together produce a record in which nobody is lying and
# nothing is true. A declared-stale score is recoverable; a declared-current
# stale score is not, because it stops the next reader from checking.
#
# EVERY NUMBER BELOW IS RE-DERIVED FROM THE PNG NOW ON DISK — the round-2
# render, judged arm (WebGL2), captured at the arithmetic moment 1966.118 m /
# 43.157 m/s. Nothing is inherited from the round-1 read.
#
# ============================================================================
# ERA C — measured, whole frame, one detector across all three images
# ============================================================================
# The detector is this critic's own (grid sample, step = W/300; "hazy sky" =
# sat < 0.25 AND L > 150 within 0.05h..0.40h). It is NOT the detector the
# previous three scorecards used, and its reference readings differ from theirs
# by a few levels and by several points of cloud fraction. Stated here so that
# no one reads a detector difference as a movement. All three columns below are
# measured with the SAME code in the same run, so the columns are comparable to
# each other and to nothing else.
#
#                            reference   round-1 (SCORED)   ON DISK NOW
#   mean luma                  114.3        101.0              97.0
#   scene-band median (.30-.72h) 139.8        72.3              95.2
#   p95 luma                     235         174               191
#   max luma                     255         249               254
#   pixels above L=235          5.03%       2.10%             3.01%
#   pixels above L=250          1.44%       0.00%             0.34%
#   whole-frame saturation      0.522       0.574             0.566
#   zenith RGB               (2,101,204) (7,139,199)       (7,90,187)
#   road r-b at 0.56h            +43         +22               +23
#   hazy/bright sky fraction    13.4%        1.5%              3.1%
#
# WHAT ROUND 2 GENUINELY MOVED TOWARD THE REFERENCE, and the record should say
# it as plainly as it says the loss:
#
#   * SCENE BAND 72.3 -> 95.2 against 139.8. The largest single move on any
#     luminance statistic in era C. The mid-frame is no longer 67 levels down;
#     it is 45 down.
#   * HIGHLIGHT END. p95 174 -> 191, >L=235 2.10% -> 3.01%, >L=250 0.00% ->
#     0.34%, against 235 / 5.03% / 1.44%. The frame has a highlight end for the
#     first time in era C. The sun disc is in frame.
#   * ZENITH green 139 -> 90 against 101. Off by 38, now off by 11 — and now
#     slightly PAST the reference rather than short of it, which is a different
#     error and is not reported as a smaller one.
#   * HAZY SKY 1.5% -> 3.1% against 13.4%. Still a near-empty sky; still a real
#     move, from a horizon haze band that did not exist before.
#   * THE HUD BOTTOM BAND. The BOOST row and the two legend rows no longer
#     print across the steering pads, and neither legend row overflows a frame
#     edge. Verified on a crop of the band, not by eye at full size.
#
# WHAT ROUND 2 LOST, and it is the axis-defining feature of the whole era:
#
#   * THE PALM SHADOWS ARE GONE. Round 1 put raking palm shadows across the
#     carriageway — the reference's single most distinctive lighting event, and
#     the credit every scorecard since has rested `lighting_and_shadow` = 2 on.
#     Verified here independently of the promote message, by cropping the
#     IDENTICAL road band (0.50h..0.72h, same pixel rows, same moment) from both
#     frames and stacking them: round 1 carries four hard shadow bars across the
#     right lanes; the image on disk carries none. The only shadow in the road
#     band is the car's own contact blob.
#   * MEAN LUMA 101.0 -> 97.0 against 114.3. Third consecutive capture in which
#     the frame's overall exposure moves away, and the third in which no lens
#     attacks the axis that owns it.
#
# ONE AXIS IS LOWERED HERE: lighting_and_shadow 2 -> 1. It is lowered because
# THE IMAGE CHANGED UNDER THE SCORE, not because the same image is re-read more
# harshly. `7f33fca4` named the regression itself and promoted anyway with the
# human's reasoning attached — that is the human's call to make and this file
# does not second-guess it. What it does is the part the promote explicitly
# deferred: score it. A regression that is named in a commit message and not
# carried into the scorecard is a regression the next pass will not see.
#
# THE REJECT RULE COULD NOT FIRE, AND THAT IS A STANDING HOLE. The loop rejects
# a candidate when a non-attacked axis falls >= 2. `lighting_and_shadow` fell by
# 1, from 2, because 1 is the floor for anything legible. Iteration 18 recorded
# the same hole one pass ago in the same words. With eleven of twelve axes at or
# below 2, the reject rule is arithmetically unreachable on this campaign for
# any single-step regression, and it will stay unreachable until several axes
# clear 3. Noted so that "no reject fired" is never read as "nothing regressed".
#
# final_score = lowest_axis * 0.7 + average_axis * 0.3
#             = 1 * 0.7 + (14/12) * 0.3 = 1.05
# (The previous 1.075 was measured on the round-1 image. Different images. The
#  0.025 is not a movement and is not reported as one.)
#
# NEXT FLAW = composition_and_framing. Ten axes now sit at 1 and the fixed axis
# order breaks the tie at its first entry. UNCHANGED and CORRECT.
#
# GUARDED ARM. `canvas-guard.png` was re-captured by the same promote; it reads
# mean luma 61.5 over a 9..246 range with the subject, road, palm line, bollards
# and full HUD present — legible, not black, not errored. It is not scored,
# credited or blamed anywhere in this file, and `campaign.toml` scopes it
# correctly ("legibility, not parity").
#
# PARITY LANGUAGE: clean. Nothing in round 2's seven commits, the promote, or
# this file claims the render matches, is done, or has reached the reference.
# `a17c44ad` reports a top-of-frame stop landing one level off the reference's;
# that is one sub-metric of one gradient stop, stated as measured, generalised
# to nothing. It is not a parity claim and is not struck.

[scores]
# 1 - HELD. The one composition change round 2 made — the bottom band stacking
# instead of colliding — is a HUD-overlap fix and is credited at
# artifact_level, where the previous file charged it. The three divergences of
# KIND that hold this axis at 1 are all untouched: (a) the road is a right-hand
# sweeper with a left guardrail and an off-centre vanishing point against a
# dead-straight, symmetrically colonnaded avenue to a centred one; (b) the
# horizon sits well below the reference's, leaving empty sky where the reference
# has beach, sea, village and headland; (c) the HUD furniture differs in kind
# for a seventh pass — a mono ASCII `[####------]` track against a graphic
# progress rail with a car token riding it, grey rings against cyan/green, and
# no gear numeral. The subject's vertical placement remains close, and a subject
# placed right inside a frame composed wrong is still a 1.
composition_and_framing = 1

# 1 - HELD, and no lens attacked it this round. Against the reference's
# fastback the car still has: no wheels in frame, no exhaust tips, no emissive
# in the tail bars (flat salmon slats where the reference's lamps glow through
# dark bezels), a grey circular badge and a grey plate that together read as a
# FRONT grille, stripes that break and step across the rear deck, and a
# greenhouse that reads as a separate stacked box rather than a fastback
# roofline. The painted body is still markedly wider-than-tall against a
# reference body that is very nearly square in its painted extent. One
# sub-feature — the glazed rear aperture — survives from `3456e56e`.
subject_fidelity = 1

# 1 - HELD, and its stated support has WEAKENED without changing the score. The
# previous file justified this partly on "the palm shadows now crossing the road
# behind it give the ground plane something to read the silhouette against."
# That is gone. What grounds the outline now is the car's own contact shadow
# alone. The shape itself — two stacked boxes against a wedge — is unchanged, so
# the axis was never going to move on that account; the point of recording it is
# that the reasoning under a held number went stale and the number did not.
silhouette_readability = 1

# 1 - HELD. Round 2's surfacing lens combed leaflets into the foliage albedo and
# that is visible: the palm crowns are ranked fronds rather than flat slabs.
# It does not move the axis, because the axis is scored on the surfaces that
# occupy the frame. The road still carries no legible aggregate at capture
# resolution — it reads as smooth fill with a haze ramp — and nothing in frame
# carries sand grain, surf foam, roof tile or bark. The reference's asphalt runs
# a long warm ramp from shadowed foreground to sun-struck mid-distance; the
# champion's mid-frame sits 45 levels under it and flat.
material_and_texture_detail = 1

# 2 -> 1. LOWERED, on the image that is now on disk.
#
# The 2 rested, in the previous file's own words, on "three checkable
# sub-features": palm shadows raking the carriageway, the car's cast shadow, and
# a single consistent upper-right key. The first of those — named there and in
# the ledger as "the reference's defining lighting event" — is ABSENT from this
# frame. Verified by stacking the identical road band (rows 0.50h..0.72h) from
# the round-1 and on-disk frames: four hard shadow bars across the right lanes
# become none. Cause is documented in `7f33fca4`: round 2's key moved from
# 28.8 deg right / 20.2 up to 16.2 / 23.8, and a higher, less lateral key drops
# the palms' shadows onto the verge behind them.
#
# The sun disc IS now in frame, which is a genuine reference feature and the
# deficit the last critic named. It does not restore the 2, for two reasons.
# First, it was cited in the previous file as a CEILING argument ("the sun
# itself is not in frame" — a reason the axis could not reach 3), not as part of
# the floor; removing a ceiling argument does not raise a floor. Second, it is
# rendered as a hard-edged white circle clipped by the right frame edge with a
# tight halo and no rays, against a reference sun that is a blown core throwing
# wide multi-ray flare across the upper quadrant — a divergence of kind, not a
# match.
#
# What is left in frame: one contact shadow under the subject, and a key whose
# direction is internally consistent. The lit road still shows no sun-strike
# ramp — the reference climbs to near-cream where the sun hits the asphalt; this
# frame's mid-band median is 95.2 against 139.8. One cast shadow plus a pasted
# disc is a 1, and "when unsure, take the lower" resolves the rest.
lighting_and_shadow = 1

# 2 - HELD, and better supported than last pass. The zenith is now (7,90,187)
# against the reference's (2,101,204): the red wash is gone and the blue channel
# no longer clips, which is the closest this era's sky has been. Hue FAMILIES
# are all right — orange car, blue sky, green verge, warm grey road, and the
# road's warm tilt holds at r-b +23 against +43. Two things pin it at 2. The
# saturation is still crossed over, 0.566 against 0.522, and an overshoot is a
# different error rather than a smaller one. And four of the reference's
# defining colours still have no representative anywhere in frame: the turquoise
# sea, the cream sand, the painted village roofs, and the sun-struck cream of
# the lit road.
color_palette = 2

# 1 - HELD, and for the first time in era C its evidence is SPLIT rather than
# uniformly worse. Toward: the scene band went 72.3 -> 95.2 (reference 139.8),
# and the frame acquired a highlight end — p95 174 -> 191, >L=235 2.10% ->
# 3.01%, >L=250 0.00% -> 0.34%, against 235 / 5.03% / 1.44%. Away: mean luma
# 101.0 -> 97.0 against 114.3, so the frame overall is 17 levels dark and has
# now moved away on this statistic three captures running. A mid-band 45 levels
# under the reference and a highlight population at three fifths of it is a 1
# on both ends at once. It is not the next flaw only because the fixed axis
# order puts composition first among the ten axes tied at 1, and this is the
# fourth consecutive pass in which no lens has attacked it.
contrast_and_exposure = 1

# 2 - HELD. Aerial haze is real and now graded through its own colour, the palm
# grove is two-rank and recedes, the sweeper's guardrail carries the eye into
# depth, and the horizon carries a haze band that did not previously exist.
# Several correct sub-features, so not 1 — though one of last pass's stated
# supports (the palm shadows separating subject from road plane) is gone and the
# subject now separates on its own contact shadow alone. Not 3: the reference
# layers near palms, beach, surf, sea, sailboats, village, headland, mountain
# and sky, and five of those planes do not exist in this frame — the distance
# resolves into a cyan wash with two ghosted grey blocks in it.
depth_and_separation = 2

# 1 - HELD, on better evidence than last pass and still nowhere near the axis.
# Hazy/bright sky is 3.1% against the reference's 13.4%, up from 1.5%: the
# horizon haze band and the sun's halo are real atmosphere and they are the
# reason this moved at all. What the axis is scored against is still absent —
# the reference's cumulus bank across the whole horizon, the multi-ray lens
# flare, and the haze layer over the sea. Distance haze plus a sun halo against
# four fifths of the reference's sky content missing is a 1.
atmosphere = 1

# 1 - HELD at the value the previous critic pass lowered it to, and the two
# reasons it was lowered both reproduce on this frame. The car's painted width
# is still right, which is the one correct sub-measurement. Against it: the
# roadside palms still stand at roughly half the reference's height relative to
# the carriageway they line — the reference's two foreground palms leave the top
# of the frame and none of the champion's comes close to it, and round 2's
# second rank of palms adds count without adding height — and the carriageway is
# still markedly wider in frame at the comparable row, five dash columns against
