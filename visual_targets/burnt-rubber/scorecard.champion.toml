# Champion scorecard — burnt-rubber
#
# ============================================================================
# ERA C, PASS 1 — scored 2026-08-06 against the render this pass produced
# ============================================================================
# Seven lenses ran. SIX were stacked; the art-director's was declined by the
# human (see below). Two conflicted on render/mod.rs and were resolved by the
# foreman rather than dropped, because dropping either would have left a
# daylight rig under a night sky — a broken frame and a wasted pass.
#
# THE FRAME IS DAYLIGHT NOW. That was the pass's whole object and it happened.
# Measured over the scene band (rows 0.30h..0.72h):
#
#                          reference    before      after
#   band luma median          139.7       0.1       178.3
#   pixels below L=16          0.5%      78.1%       0.0%
#   whole-frame saturation    0.522      0.141      0.204
#   whole-frame mean luma     114.4       23.3      160.8
#   sky, high             (27,111,198) (19,19,20) (228,231,232)
#   sky, at horizon      (145,219,239)  (0,1,0)  (128,202,249)
#   left shoulder          (74,197,186)  (2,6,5)  (105,149,166)
#
# TWO OVERSHOOTS, BOTH NAMED AND NEITHER SMOOTHED:
#
#  1. The frame is now BRIGHTER than the reference, not darker — median 178.3
#     against 139.7 — and flatter: saturation 0.204 against 0.522. It went from
#     three stops under to about half a stop over, which is the right kind of
#     error to have but is still an error.
#  2. The zenith is WHITE. (228,231,232) against the reference's deep
#     (27,111,198). The horizon band, by contrast, is nearly right —
#     (128,202,249) against (145,219,239). So the sky gradient is correct and
#     the cloud layer is burying it: CLOUD_COVERAGE = 0.55 was authored blind,
#     and the architect said in its own proposal that whether the field reads as
#     cumulus rather than a wash was the one thing GPU verification had to judge.
#     It reads as a wash. That is a one-constant answer, and it is the reason
#     color_palette and contrast_and_exposure are 1 rather than 2.
#
# WHAT THE REFERENCE STILL HAS THAT THIS DOES NOT: the sea, the beach, the
# stilt houses, the sailboats — the entire left third of the reference is water
# and the champion's left shoulder is a green hillside. And no palm throws a
# shadow across the road, which is the reference's single most characteristic
# feature.
#
# final_score = lowest_axis * 0.7 + average_axis * 0.3
#             = 1 * 0.7 + (19/12) * 0.3 = 1.175   (was 0.20)
#
# NEXT FLAW, BY THE RULE = silhouette_readability (five axes tie at 1; fixed
# order breaks it 3rd). BUT the human has already scheduled the anamorphic fix
# for the next pass, and the art-director measured why that ordering is right:
# the judged arm squeezes the world 3.16x horizontally, and "a wedge squashed 3x
# in plan IS a rectangle" — so silhouette work cannot survive on this arm and
# would be spent twice. scale_and_proportion is therefore the pass-2 target by
# human decision, with silhouette_readability blocked behind it. Recorded rather
# than quietly re-ordered.
#
# THE CAMERA PROPOSAL WAS DECLINED, AND THAT IS NOT A DROPPED PROPOSAL. The
# art-director measured the car at 20% of frame width against the reference's
# 30% and proposed scaling the rig 0.70 to close it. The human declined: the
# camera was pulled back and lifted two days ago as an explicit gameplay
# requirement — road ahead to read a corner and the traffic in it — and a
# reference cannot overrule that. scale_and_proportion is therefore capped by a
# deliberate design decision, not by an unfixed flaw, and no future pass should
# re-propose the rig scale without the human revisiting it.

[scores]
# 2 - HELD. Camera, centred subject, horizon and HUD corners still match above
# proxy level and no lens touched them. The HUD is still one monochrome mono font
# where the reference styles its own (a gear disc, a progress track with a car
# token, cyan and green button rings) — unchanged, and unattacked.
composition_and_framing = 2

# 1 -> 2. The car is LIT for the first time in this campaign: its red body and
# white stripes read, and the pure-black rear-facing panel that surfacing flagged
# (N.L <= 0 against an ambient of ~0.001 linear) is gone now that there is a sky
# fill under the key. What holds it at 2 is unchanged shape — a box with a raised
# deck against the reference's tapering wedge — and, per the art-director's
# measurement, that shape cannot be judged on this arm until the squash is fixed.
subject_fidelity = 2

# 1 - HELD, and deliberately not attacked. The outline is still box-on-box. The
# art-director's finding is why this stays where it is rather than being worked:
# the judged arm squeezes the world 3.16x horizontally, and a wedge squashed 3x
# in plan renders as a rectangle — so modelling a wedge now would be spent twice,
# once before the aspect fix and once after. Blocked behind scale_and_proportion
# by decision, not by difficulty.
silhouette_readability = 1

# 1 -> 2. Surfacing measured the reference's asphalt variation at 1.6-2.3% and
# the champion's authored 5.92%, cut MIN_MULTIPLIER 0.62 -> 0.86 to land at
# 1.87%, and the road no longer reads as static — it reads as tarmac. Because
# the grain is a multiplied albedo that ratio is exposure-invariant, so it
# survived the day conversion landing on top of it, which is exactly what the
# lens predicted. Not 3: the surfaces are washed by the cloud haze, and nothing
# in frame yet carries the reference's sand, foam, roof tile or frond detail.
material_and_texture_detail = 2

# 0 -> 2, the attacked axis and the pass's object. The rig is a daylight rig:
# key 0.88 cool -> 2.6 warm-white, hemisphere ambient from a night residual
# (~0.019 mean) to a blue-sky-over-warm-sand fill, and the car's pool light
# 1.0 -> 0.16 so a lamp stops out-lighting the sun. Every surface in frame is now
# lit by something. It is not 3 for one reason and it is the big one: NO PALM
# THROWS A SHADOW ACROSS THE ROAD. That is the reference's most characteristic
# feature and the engine has one directional shadow caster; whether it can reach
# is an architect question nobody has answered yet.
lighting_and_shadow = 2

# 0 -> 1. The hue families exist now — blue above, green land, a red car — where
# before there were greys. But saturation is 0.204 against the reference's 0.522
# and the zenith is (228,231,232) where the reference is (27,111,198). The frame
# is day-coloured and washed out rather than day-coloured and saturated, and the
# cloud layer burying the gradient is most of why.
color_palette = 1

# 0 -> 1. The crushed floor is gone: 78.1% of the band below L=16 is now 0.0%,
# against the reference's 0.5%. That is the whole of the improvement and it is
# real. It stops at 1 because the error changed sign rather than closing — median
# 178.3 against 139.7, so the frame is now about half a stop hot, and with the
# zenith blown to near-white the range is compressed at the top instead of the
# bottom. Under before it was over.
contrast_and_exposure = 1

# 1 -> 2. The palm avenue does what depth cues do: a receding colonnade at a
# known spacing reads distance far better than a converging road alone, and
# there are distinct planes now (road, verge, hills, sky). Not 3 because the haze
# washes the mid-distance into the sky rather than separating them, and the
# reference's layering — near palms, beach, boats, village, mountains, sky — has
# four planes this frame does not contain at all.
depth_and_separation = 2

# 0 -> 2. There is weather in the sky. The architect's cloud layer composites on
# a cloud plane so lumps foreshorten toward the vanishing point, and it carries
# no colour of its own — which is why it survived the palette going from night to
# noon underneath it without a retune. The horizon band lands at (128,202,249)
# against the reference's (145,219,239), close. It is not 3 because at
# CLOUD_COVERAGE 0.55 the layer reads as a milky wash rather than discrete
# cumulus, and it has buried the zenith the gradient was painting correctly.
atmosphere = 2

# 1 - HELD, on two separate causes that both resolve outside this pass. The
# anamorphic 3.16x squash is unfixed and is scheduled for pass 2 by human
# decision. The chase rig is unchanged because the human declined the proposal to
# scale it, preferring the road-ahead visibility they asked for over reference
# parity — so the part of this axis that is about subject size is capped by
# choice and should stop being re-proposed.
scale_and_proportion = 1

# 1 -> 2. The palm avenue is real new content: 7-blade procedural crowns on
# scaled stems, planted every 24 m on both shoulders through the coast sections,
# ~150 instances in the visible window for 2 extra draw calls. Not 3 because the
# reference's density is mostly things this frame still lacks entirely — the sea,
# the sailboats, the beach, the stilt houses, the parasols, the mountains — and
# because the fronds are flat blades rather than pinnate leaves, which the
# modeler recorded as the app-tier ceiling without an alpha-cutout foliage card.
detail_density = 2

# 0 -> 1. Three of the six artifact classes the critic named are gone with the
# night: the crushed floor, the stray green sky streak, and the black rear panel.
# What replaces them is smaller but real — the cloud wash flattening the upper
# band, and aliasing on lane edges and palm stems that daylight now shows in full
